server {
    listen 6200;
    server_name _;

    # Allow large MBTiles uploads (up to 8 GB)
    client_max_body_size    8192m;
    client_body_timeout     600s;

    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header Permissions-Policy      "microphone=*, geolocation=*";

    # Backend REST
    location /api/ {
        proxy_pass                http://backend:6001/;
        proxy_set_header          Host $host;
        proxy_set_header          X-Real-IP $remote_addr;
        proxy_read_timeout        600s;
        proxy_send_timeout        600s;
        # Stream request body directly to backend — avoids buffering multi-GB uploads
        proxy_request_buffering   off;
    }

    # Stream WebSocket (Android camera producer: /api/streams/{id}/produce)
    location ~ ^/api/streams/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         http://backend:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # WebSocket endpoints
    location ~ ^/(ws|mumble/voice) {
        proxy_pass         http://backend:6001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;
    }

    # MapServer OGC WMS/WFS
    location /mapserver/ {
        resolver           127.0.0.11 valid=30s ipv6=off;
        set $ms            http://mapserver;
        rewrite            ^/mapserver/ /cgi-bin/mapserv break;
        proxy_pass         $ms;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # TAK Bridge REST API
    location /tak/ {
        proxy_pass                http://tak-bridge:8099/;
        proxy_set_header          Host $host;
        proxy_set_header          X-Real-IP $remote_addr;
        proxy_read_timeout        30s;
        proxy_request_buffering   off;
    }

    # Web dashboard
    location / {
        proxy_pass                http://web:6002;
        proxy_set_header          Host       $host;
        proxy_set_header          X-Real-IP  $remote_addr;
        proxy_read_timeout        120s;
        proxy_request_buffering   off;
    }
}
