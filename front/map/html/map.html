// ---- RainViewer live radar (no API key needed) -----------------------
let _radarLayer = null;
let _radarFrames = [];
let _radarIdx = 0;
let _radarTimer = null;

async function loadRainRadar() {
  try {
    const resp = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    const data = await resp.json();
    const host  = data.host || 'https://tilecache.rainviewer.com';
    const past  = data.radar?.past || [];
    if (!past.length) return;

    // Build frames (past 3 + nowcast 2)
    const nowcast = data.radar?.nowcast || [];
    _radarFrames = [...past.slice(-4), ...nowcast.slice(0,2)];

    function showFrame(idx) {
      if (_radarLayer) { LAYERS.weather.removeLayer(_radarLayer); _radarLayer=null; }
      const frame = _radarFrames[idx];
      if (!frame) return;
      const url = `${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
      _radarLayer = L.tileLayer(url, {
        opacity: 0.65,
        minZoom: 0, maxZoom: 20, maxNativeZoom: 8,
        attribution: '© RainViewer',
      });
      _radarLayer.addTo(LAYERS.weather);
      WEATHER_LAYERS['rain_radar'] = _radarLayer;
    }

    _radarIdx = _radarFrames.length - 3; // start near latest
    showFrame(_radarIdx);

    // Animate through past frames every 600ms, then pause on latest
    if (_radarTimer) clearInterval(_radarTimer);
    let animCount = 0;
    _radarTimer = setInterval(() => {
      _radarIdx = (_radarIdx + 1) % _radarFrames.length;
      showFrame(_radarIdx);
      animCount++;
      if (animCount >= _radarFrames.length * 2) {
        clearInterval(_radarTimer);
        _radarTimer = null;
        // Settle on latest past frame
        _radarIdx = _radarFrames.filter(f=>!f.path.includes('nowcast')).length - 1;
        showFrame(Math.max(0,_radarIdx));
      }
    }, 550);

    // Show label
    document.getElementById('wx-radar-label').style.display = 'block';
    document.getElementById('weather-panel').classList.add('active');

  } catch(e) {
    console.warn('[Weather] RainViewer load failed:', e);
  }
}

function stopRainRadar() {
  if (_radarTimer) { clearInterval(_radarTimer); _radarTimer = null; }
  if (_radarLayer) { LAYERS.weather.removeLayer(_radarLayer); _radarLayer = null; }
  delete WEATHER_LAYERS['rain_radar'];
  document.getElementById('wx-radar-label').style.display = 'none';
}

// ---- OWM tile layers (needs API key) ----------------------------------
async function setWeatherLayer(name, visible) {
  if (visible) {
    if (name === 'rain_radar') {
      await loadRainRadar();
      await fetchWeatherAtCenter();
      return;
    }
    if (!weatherOwmKey) {
      console.warn('[Weather] OWM API key not set');
      return;
    }
    if (WEATHER_LAYERS[name]) { LAYERS.weather.removeLayer(WEATHER_LAYERS[name]); }
    const url = `https://tile.openweathermap.org/map/${name}/{z}/{x}/{y}.png?appid=${weatherOwmKey}`;
    WEATHER_LAYERS[name] = L.tileLayer(url, { opacity: 0.6, minZoom: 1, maxZoom: 18, maxNativeZoom: 8 });
    WEATHER_LAYERS[name].addTo(LAYERS.weather);
    await fetchWeatherAtCenter();
  } else {
    if (name === 'rain_radar') { stopRainRadar(); return; }
    if (WEATHER_LAYERS[name]) {
      LAYERS.weather.removeLayer(WEATHER_LAYERS[name]);
      delete WEATHER_LAYERS[name];
    }
  }
}

function setWeatherApiKey(key) { weatherOwmKey = key; }

// ---- Open-Meteo point weather (free, no key) ---------------------------
const WX_CODE = {
  0:'Clear',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
  45:'Fog',48:'Rime fog',
  51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  61:'Light rain',63:'Rain',65:'Heavy rain',
  71:'Light snow',73:'Snow',75:'Heavy snow',
  80:'Rain showers',81:'Showers',82:'Heavy showers',
  95:'Thunderstorm',96:'Thunderstorm+hail',99:'Severe thunderstorm',
};

async function fetchWeatherAtCenter() {
  const c = map.getCenter();
  try {
    const url = `https://api.open-meteo.com/v1/forecast`
      + `?latitude=${c.lat.toFixed(4)}&longitude=${c.lng.toFixed(4)}`
      + `&current=temperature_2m,apparent_temperature,wind_speed_10m,wind_direction_10m`
      + `,wind_gusts_10m,precipitation,weather_code,cloud_cover,visibility`
      + `&wind_speed_unit=kmh&timezone=auto`;
    const resp = await fetch(url);
    const data = await resp.json();
    const cur  = data.current || {};

    const code  = cur.weather_code;
    const desc  = WX_CODE[code] || `Code ${code}`;
    const temp  = cur.temperature_2m;
    const feel  = cur.apparent_temperature;
    const wind  = cur.wind_speed_10m;
    const gust  = cur.wind_gusts_10m;
    const wdir  = cur.wind_direction_10m;
    const prec  = cur.precipitation;
    const cloud = cur.cloud_cover;
    const vis   = cur.visibility;
    const card  = degToCardinal(wdir);

    document.getElementById('wx-rows').innerHTML = `
      <div class="wx-row"><span class="wx-icon">☁</span><span class="wx-val">${desc}</span></div>
      <div class="wx-row"><span class="wx-icon">🌡</span><span class="wx-lbl">TEMP</span><span class="wx-val">${temp??'—'}°C</span><span class="wx-lbl">(feels ${feel??'—'}°C)</span></div>
      <div class="wx-row"><span class="wx-icon">💨</span><span class="wx-lbl">WIND</span><span class="wx-val">${wind??'—'} km/h ${card}</span><span class="wx-lbl">gusts ${gust??'—'}</span></div>
      <div class="wx-row"><span class="wx-icon">🌧</span><span class="wx-lbl">PREC</span><span class="wx-val">${prec??'—'} mm/h</span></div>
      <div class="wx-row"><span class="wx-icon">☁</span><span class="wx-lbl">CLOUD</span><span class="wx-val">${cloud??'—'}%</span></div>
      ${vis!=null?`<div class="wx-row"><span class="wx-icon">👁</span><span class="wx-lbl">VIS</span><span class="wx-val">${vis>=1000?(vis/1000).toFixed(1)+' km':vis+' m'}</span></div>`:''}
    `;
    document.getElementById('wx-location').textContent = latLonToMGRS(c.lat, c.lng);
    document.getElementById('weather-panel').classList.add('active');
  } catch(e) {
    console.warn('[Weather] Open-Meteo failed:', e);
  }
}

function hideWeatherPanel() {
  document.getElementById('weather-panel').classList.remove('active');
}

function degToCardinal(d){if(d==null)return'—';const dirs=['N','NE','E','SE','S','SW','W','NW'];return dirs[Math.round(d/45)%8];}

let _measActive = false;   // is a measure tool running?

// ── Distance / Azimuth measurement ────────────────────────────────────────
function _fmtDist(m) {
  if (m >= 10000) return (m/1000).toFixed(1) + ' km';
  if (m >= 1000)  return (m/1000).toFixed(2) + ' km';
  return Math.round(m) + ' m';
}
function _bearing(p1, p2) {
  const r  = Math.PI / 180;
  const dL = (p2.lng - p1.lng) * r;
  const y  = Math.sin(dL) * Math.cos(p2.lat * r);
  const x  = Math.cos(p1.lat * r) * Math.sin(p2.lat * r)
              - Math.sin(p1.lat * r) * Math.cos(p2.lat * r) * Math.cos(dL);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

function startMeasure(mode) {
  // Clean up previous
  _stopMeasure();
  _measActive = true;
  _measPts    = [];
  document.getElementById('meas-panel').classList.add('active');
  document.getElementById('range-panel').classList.remove('active');
  _clearMeasPanel();
  document.getElementById('m-mode').textContent =
    mode === 'azimuth' ? 'AZIMUTH — click 2 points'
                       : 'DISTANCE — click points, right-click to stop';
  map.on('click',        _measClick);
  map.getContainer().style.cursor = 'crosshair';
}

function _measClick(e) {
  const pt = e.latlng;
  _measPts.push(pt);

  // Yellow dot marker
  const mk = L.circleMarker(pt, {
    radius:6, color:'#ffff00', fillColor:'#ffff00', fillOpacity:.95, weight:2, zIndexOffset:500
  }).addTo(map);
  _measLayers.push(mk);

  if (_measPts.length >= 2) {
    const p1  = _measPts[_measPts.length - 2];
    const p2  = _measPts[_measPts.length - 1];
    const d   = p1.distanceTo(p2);
    const brg = _bearing(p1, p2);
    const bk  = (brg + 180) % 360;

    // Draw segment line
    const seg = L.polyline([p1, p2], {
      color:'#ffff00', weight:2.5, dashArray:'8,4', opacity:.9
    }).addTo(map);
    _measLayers.push(seg);

    // Label at midpoint
    const mid  = L.latLng((p1.lat+p2.lat)/2, (p1.lng+p2.lng)/2);
    const lb   = L.marker(mid, {
      icon: L.divIcon({
        html: `<div style="background:rgba(0,0,0,.82);border:1px solid #ffff00;
               color:#ffff00;font-family:'Courier New',monospace;font-size:10px;
               font-weight:700;padding:2px 8px;border-radius:2px;white-space:nowrap">
               ${_fmtDist(d)}</div>`,
        className:'', iconAnchor:[0,-8]
      })
    }).addTo(map);
    _measLayers.push(lb);

    // Update panel
    document.getElementById('m-dist').textContent = _fmtDist(d);
    document.getElementById('m-az').textContent   =
      brg.toFixed(1) + '°   /   ' + Math.round(brg * 17.7778) + ' mil';
    document.getElementById('m-baz').textContent  =
      bk.toFixed(1)  + '°   /   ' + Math.round(bk  * 17.7778) + ' mil';
    document.getElementById('m-from').textContent = latLonToMGRS(p1.lat, p1.lng);
    document.getElementById('m-to').textContent   = latLonToMGRS(p2.lat, p2.lng);

    if (bridge) bridge.onMeasureComplete(
      _fmtDist(d),
      brg.toFixed(1)+'° / '+Math.round(brg*17.7778)+' mil'
    );

    // Azimuth mode: stop after 2 points
    if (document.getElementById('m-mode').textContent.startsWith('AZIMUTH')) {
      _stopMeasure(null);
    }
  }
}

function _measStop(e) {
  if (e) { e.originalEvent.preventDefault(); e.originalEvent.stopPropagation(); }
  _stopMeasure(e);
  // Reopen context menu after a short delay if it was a right-click
}

function _stopMeasure(e) {
  map.off('click', _measClick);
  map.getContainer().style.cursor = '';
  _measActive = false;
}

function clearMeasure() {
  _stopMeasure(null);
  _measLayers.forEach(l => map.removeLayer(l));
  _measLayers = [];
  _measPts    = [];
  document.getElementById('meas-panel').classList.remove('active');
  _clearMeasPanel();
}

function continueMeasure() {
  if (!_measActive && _measPts.length > 0) {
    _measActive = true;
    map.on('click', _measClick);
    map.getContainer().style.cursor = 'crosshair';
  }
}

function _clearMeasPanel() {
  ['m-dist','m-az','m-baz','m-from','m-to'].forEach(id=>{
    document.getElementById(id).textContent = '—';
  });
}

let _rangeMode = false;   // true while range tool is active

function startRangeMode() {
  _stopMeasure(null);                 // stop any distance measuring
  _rangeMode = true;
  document.getElementById('range-panel').classList.add('active');
  document.getElementById('meas-panel').classList.remove('active');
  // Always (re)bind a single center-click handler
  map.off('click', _rangeCenterClick);
  map.off('click', _rangeRadiusClick);
  if (!_rangeCtr) {
    _setRangeStatus('① Click map to set CENTER');
    map.on('click', _rangeCenterClick);
  } else {
    _setRangeStatus('② Pick a radius, or click map for distance');
    map.on('click', _rangeRadiusClick);
  }
  map.getContainer().style.cursor = 'crosshair';
}

function _setRangeStatus(txt) {
  document.getElementById('range-center-label').textContent = txt;
}

function _rangeCenterClick(e) {
  map.off('click', _rangeCenterClick);
  _rangeCtr = e.latlng;
  // Center marker
  const cm = L.circleMarker(_rangeCtr, {
    radius:7, color:'#3fb950', fillColor:'#3fb950', fillOpacity:.95, weight:2, zIndexOffset:600
  }).addTo(map);
  _rangeLyrs.push(cm);
  _setRangeStatus('CTR ' + latLonToMGRS(_rangeCtr.lat, _rangeCtr.lng) + '  · pick radius');
  // Now allow distance-based radius by clicking the map again
  map.on('click', _rangeRadiusClick);
}

function _rangeRadiusClick(e) {
  if (!_rangeCtr) return;
  const r = Math.round(_rangeCtr.distanceTo(e.latlng));
  if (r > 0) addRangeCircle(r);
}

function addRangeCircle(r) {
  if (!_rangeCtr) {
    _setRangeStatus('⚠ Set a CENTER first (click map)');
    return;
  }
  const circle = L.circle(_rangeCtr, {
    radius: r, color:'#3fb950', weight:2, fillColor:'#3fb950',
    fillOpacity:0.04, dashArray:'8,4'
  }).addTo(map);
  // Label placed at the north edge of the ring
  const edge = L.latLng(_rangeCtr.lat + r/111320, _rangeCtr.lng);
  const lbl = L.marker(edge, {
    icon: L.divIcon({
      html:`<div style="background:rgba(0,0,0,.82);border:1px solid #3fb950;color:#3fb950;
            font-family:'Courier New',monospace;font-size:10px;font-weight:700;
            padding:1px 7px;border-radius:2px;white-space:nowrap">${_fmtDist(r)}</div>`,
      className:'', iconAnchor:[0,8]
    })
  }).addTo(map);
  _rangeLyrs.push(circle, lbl);
  _setRangeStatus(_rangeLyrs.length > 1 ?
    'Ring added · ' + _fmtDist(r) : '');
}

function addCustomRange() {
  const inp = document.getElementById('range-input');
  const v = parseFloat(inp.value);
  if (v > 0) { addRangeCircle(v); inp.value=''; }
}

function clearRangeCircles() {
  map.off('click', _rangeCenterClick);
  map.off('click', _rangeRadiusClick);
  _rangeLyrs.forEach(l => map.removeLayer(l));
  _rangeLyrs = [];
  _rangeCtr  = null;
  _rangeMode = false;
  _setRangeStatus('Center: click map to set');
  map.getContainer().style.cursor = '';
}

function closeRangePanel() {
  map.off('click', _rangeCenterClick);
  map.off('click', _rangeRadiusClick);
  _rangeMode = false;
  document.getElementById('range-panel').classList.remove('active');
  map.getContainer().style.cursor = '';
}

// RADIAL MENU (circular — 8 petals around a central hub)
// ================================================================
let _radialLatLng = null;

// [icon, label, css-class, action-key]
const RADIAL_PETALS = [
  ['🔵', 'FRIENDLY', 'green',  'friendly'],
  ['🔴', 'ENEMY',    'red',    'enemy'],
  ['📍', 'POI',      '',       'poi'],
  ['⚡', 'TIC',      'red',    'tic'],
  ['🚁', 'MEDEVAC',  'amber',  'medevac'],
  ['⟷', 'DISTANCE', '',       'dist'],
  ['⊙', 'RANGE',    'green',  'range'],
  ['🛸', 'DRONE',    'purple', 'drone'],
];
const _RADIAL_RADIUS = 104;   // px from hub centre to petal centre

// Build petals once
(function _buildPetals(){
  const menu = document.getElementById('radial-menu');
  const n    = RADIAL_PETALS.length;
  RADIAL_PETALS.forEach((p, i) => {
    const [icon, label, cls, key] = p;
    const el = document.createElement('div');
    el.className = 'radial-petal' + (cls ? ' ' + cls : '');
    el.dataset.key = key;
    el.dataset.index = i;
    el.innerHTML = `<span class="rp-icon">${icon}</span><span class="rp-lbl">${label}</span>`;
    el.addEventListener('click', ev => { ev.stopPropagation(); _radialAct(key); });
    menu.appendChild(el);
  });
})();

function openRadial(containerPoint, latlng) {
  _radialLatLng = latlng;
  const menu = document.getElementById('radial-menu');

  // Position menu centre at the click, clamped so all petals stay on-screen
  const mapSize = map.getSize();
  const pad = _RADIAL_RADIUS + 44;
  let cx = Math.max(pad, Math.min(containerPoint.x, mapSize.x - pad));
  let cy = Math.max(pad, Math.min(containerPoint.y, mapSize.y - pad));
  menu.style.left = cx + 'px';
  menu.style.top  = cy + 'px';
  menu.classList.add('active');

  // Position petals instantly (no CSS transitions — they create GPU layers
  // that black out the Qt6/macOS Metal compositor)
  const petals = menu.querySelectorAll('.radial-petal');
  const n = petals.length;
  petals.forEach((el, i) => {
    const ang = (-90 + i * (360 / n)) * Math.PI / 180;
    const tx  = Math.round(Math.cos(ang) * _RADIAL_RADIUS);
    const ty  = Math.round(Math.sin(ang) * _RADIAL_RADIUS);
    el.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px))`;
  });

  // Close on any click outside the menu — no backdrop overlay needed
  setTimeout(() => {
    document.addEventListener('mousedown', _radialOutsideClick, {once: true});
  }, 50);
}

function _radialOutsideClick(e) {
  const menu = document.getElementById('radial-menu');
  if (!menu.contains(e.target)) closeRadial();
  else document.addEventListener('mousedown', _radialOutsideClick, {once: true});
}

function closeRadial() {
  document.removeEventListener('mousedown', _radialOutsideClick);
  document.getElementById('radial-menu').classList.remove('active');
}

function _radialAct(key) {
  closeRadial();
  const ll = _radialLatLng;
  if (!ll) return;
  if (key === 'friendly')      openSymbolPicker(ll.lat, ll.lng, 'FRIENDLY');
  else if (key === 'enemy')    openSymbolPicker(ll.lat, ll.lng, 'HOSTILE');
  else if (key === 'dist')     startMeasure('distance');
  else if (key === 'range')    startRangeMode();
  else if (bridge)             bridge.onRadialAction(key, ll.lat, ll.lng);
}

function latLonToMGRS(lat,lon){try{if(typeof mgrs!=='undefined')return mgrs.forward([lon,lat],5);}catch(_){}return `${lat.toFixed(5)}, ${lon.toFixed(5)}`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ================================================================
// FREE DRAW
// Pen: Leaflet mousedown → document mousemove/mouseup for accuracy.
// Text: Leaflet click → inline overlay input.
// ================================================================
let _fdColor     = '#f85149';
let _fdThick     = 2;
let _fdTool      = 'none';
let _fdDown      = false;
let _fdPts       = [];
let _fdCurLyr    = null;
let _fdHistory   = [];
let _fdPendingLL = null;

function setFreeDraw(tool, color, thickness) {
  _fdStopAll();
  _fdColor = color     || '#f85149';
  _fdThick = thickness || 2;
  _fdTool  = tool      || 'none';

  if (tool === 'pen') {
    drawMode = 'freedraw';
    map.getContainer().style.cursor = 'crosshair';
    map.dragging.disable();
    // Leaflet mousedown gives us accurate latlng for the first point
    map.on('mousedown', _fdLeafletDown);
    // Document-level for smooth mid-stroke tracking and reliable release
    document.addEventListener('mousemove', _fdDocMove, false);
    document.addEventListener('mouseup',   _fdDocUp,   false);
  } else if (tool === 'text') {
    drawMode = 'freedrawtext';
    map.getContainer().style.cursor = 'text';
    map.on('click', _fdTextClick);
  } else {
    drawMode = 'pointer';
    map.getContainer().style.cursor = '';
    map.dragging.enable();
  }
}

function _fdStopAll() {
  map.off('mousedown', _fdLeafletDown);
  map.off('click',     _fdTextClick);
  document.removeEventListener('mousemove', _fdDocMove, false);
  document.removeEventListener('mouseup',   _fdDocUp,   false);
  if (_fdDown) { _fdDown = false; map.dragging.enable(); }
  if (_fdCurLyr) { LAYERS.freedraw.removeLayer(_fdCurLyr); _fdCurLyr = null; }
  _fdPts = [];
  closeFreeDrawTextInput();
}

// Called by Leaflet's mousedown — gives us precise latlng anchor
function _fdLeafletDown(e) {
  _fdDown = true;
  _fdPts  = [e.latlng];
}

// Document-level mousemove: convert clientX/Y → map LatLng
function _fdDocMove(e) {
  if (!_fdDown) return;
  const rect = map.getContainer().getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const ll = map.containerPointToLatLng(L.point(x, y));
  _fdPts.push(ll);
  // Redraw live preview
  if (_fdCurLyr) LAYERS.freedraw.removeLayer(_fdCurLyr);
  if (_fdPts.length >= 2) {
    _fdCurLyr = L.polyline(_fdPts.slice(), {
      color: _fdColor, weight: _fdThick, opacity: .92,
      lineCap: 'round', lineJoin: 'round', interactive: false
    }).addTo(LAYERS.freedraw);
  }
}

// Document-level mouseup: commit stroke and persist to backend
function _fdDocUp() {
  if (!_fdDown) return;
  _fdDown = false;
  if (_fdCurLyr) { LAYERS.freedraw.removeLayer(_fdCurLyr); _fdCurLyr = null; }
  if (_fdPts.length >= 2) {
    const lyr = L.polyline(_fdPts.slice(), {
      color: _fdColor, weight: _fdThick, opacity: .92,
      lineCap: 'round', lineJoin: 'round', interactive: false
    }).addTo(LAYERS.freedraw);
    _fdHistory.push(lyr);
    // Persist — broadcasts via WS so web + all other fronts see it
    const coords = _fdPts.map(ll => [ll.lat, ll.lng]);
    if (bridge) bridge.onFreeDrawSaved(
      'FREEDRAW_LINE',
      JSON.stringify({type:'line', coords}),
      JSON.stringify({color:_fdColor, thick:_fdThick})
    );
  }
  _fdPts = [];
}

// Text tool: click → show input overlay near click point
function _fdTextClick(e) {
  if (drawMode !== 'freedrawtext') return;
  _fdPendingLL = e.latlng;
  const pt = map.latLngToContainerPoint(e.latlng);
  const ov = document.getElementById('fd-text-overlay');
  ov.style.left = Math.min(pt.x + 8, window.innerWidth  - 310) + 'px';
  ov.style.top  = Math.min(pt.y - 18, window.innerHeight - 60) + 'px';
  ov.classList.add('active');
  const inp = document.getElementById('fd-text-input');
  inp.value = '';
  setTimeout(() => inp.focus(), 40);
}

function placeFreeText() {
  const text = (document.getElementById('fd-text-input').value || '').trim();
  if (text && _fdPendingLL) {
    const sh = '1px 1px 3px #000,-1px -1px 3px #000,1px -1px 3px #000,-1px 1px 3px #000';
    const lyr = L.marker(_fdPendingLL, {
      interactive: false,
      icon: L.divIcon({
        className: '',
        html: `<div style="color:${_fdColor};font-family:'Courier New',monospace;` +
              `font-size:13px;font-weight:700;white-space:nowrap;` +
              `text-shadow:${sh};pointer-events:none;">${esc(text)}</div>`,
        iconSize: [0, 0], iconAnchor: [0, 8]
      })
    }).addTo(LAYERS.freedraw);
    _fdHistory.push(lyr);
    // Persist — broadcasts via WS so web + all other fronts see it
    if (bridge) bridge.onFreeDrawSaved(
      'FREEDRAW_TEXT',
      JSON.stringify({type:'point', coords:[[_fdPendingLL.lat, _fdPendingLL.lng]]}),
      JSON.stringify({color:_fdColor, text})
    );
  }
  closeFreeDrawTextInput();
}

function closeFreeDrawTextInput() {
  const ov = document.getElementById('fd-text-overlay');
  if (ov) ov.classList.remove('active');
  _fdPendingLL = null;
}

function undoFreeDraw() {
  if (!_fdHistory.length) return;
  LAYERS.freedraw.removeLayer(_fdHistory.pop());
}

function clearFreeDrawLayer() {
  LAYERS.freedraw.clearLayers();
  _fdHistory = [];
  _fdCurLyr  = null;
}

document.getElementById('fd-text-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter')  { placeFreeText();          e.preventDefault(); }
  if (e.key === 'Escape') { closeFreeDrawTextInput(); e.preventDefault(); }
});

// ================================================================
// OWN GPS POSITION
// ================================================================
let _myPosMarker      = null;
let _myPosAccCircle   = null;
let _gpsWatchId       = null;
let _gpsWifiWatchId   = null;   // fallback WiFi watcher
let _gpsCenterOnFix   = true;
let _gpsShowAccuracy  = true;
let _gpsFirstFix      = true;
let _gpsUsingWifi     = false;  // true when running on WiFi fallback
let _gpsMaxAgeMs      = 4000;
let _gpsEnabled       = true;
let _gpsHighAccuracy  = true;

// Called by Python after map ready (and after settings change)
function setGPSConfig(enabled, highAccuracy, maxAgeMs, centerOnFix, showAccuracy) {
  _gpsCenterOnFix  = centerOnFix;
  _gpsShowAccuracy = showAccuracy;
  _gpsMaxAgeMs     = maxAgeMs || 4000;
  _gpsEnabled      = enabled;
  _gpsHighAccuracy = highAccuracy;

  _gpsStopAll();

  if (!enabled) {
    if (_myPosMarker)    { map.removeLayer(_myPosMarker);    _myPosMarker    = null; }
    if (_myPosAccCircle) { map.removeLayer(_myPosAccCircle); _myPosAccCircle = null; }
    document.getElementById('own-gps-hud').style.display = 'none';
    return;
  }

  document.getElementById('own-gps-hud').style.display = '';
  _gpsFirstFix  = true;
  _gpsUsingWifi = false;
  _gpsStartPrimary();
}

function _gpsStopAll() {
  if (_gpsWatchId !== null)     { navigator.geolocation.clearWatch(_gpsWatchId);     _gpsWatchId     = null; }
  if (_gpsWifiWatchId !== null) { navigator.geolocation.clearWatch(_gpsWifiWatchId); _gpsWifiWatchId = null; }
}

// Try GPS (high-accuracy) first
function _gpsStartPrimary() {
  if (!navigator.geolocation) {
    document.getElementById('own-gps-mgrs').textContent = 'N/A';
    return;
  }
  _gpsSetLabel('SEARCHING…', '#d29922');
  _gpsWatchId = navigator.geolocation.watchPosition(
    _onGPSSuccess,
    _onGPSPrimaryError,
    { enableHighAccuracy: !!_gpsHighAccuracy, maximumAge: _gpsMaxAgeMs, timeout: 12000 }
  );
}

// GPS failed → fall back to WiFi / network positioning
function _gpsStartWifiFallback() {
  if (_gpsWifiWatchId !== null) return;   // already running
  _gpsSetLabel('NO GPS — WIFI…', '#d29922');
  _gpsWifiWatchId = navigator.geolocation.watchPosition(
    _onGPSSuccess,
    _onGPSFinalError,
    { enableHighAccuracy: false, maximumAge: 15000, timeout: 30000 }
  );
}

// Default startup (before Python pushes config)
function initGPS() {
  setGPSConfig(true, true, 4000, true, true);
}

function _onGPSSuccess(pos) {
  const lat  = pos.coords.latitude;
  const lon  = pos.coords.longitude;
  const acc  = Math.round(pos.coords.accuracy);
  const mgrs = latLonToMGRS(lat, lon);

  // If WiFi fallback fired but GPS watcher is still open, keep both running —
  // GPS watcher will win once it gets a fix (higher accuracy shows in HUD).
  const viaWifi = (pos.coords.accuracy > 200);   // rough heuristic
  _gpsUsingWifi = viaWifi;

  // Center map on first fix
  if (_gpsCenterOnFix && _gpsFirstFix) {
    map.setView([lat, lon], Math.max(map.getZoom(), 14));
    _gpsFirstFix = false;
  }

  // Source badge
  const src   = viaWifi ? 'WIFI' : 'GPS';
  const color = viaWifi ? '#d29922' : '#3fb950';

  // Update HUD
  document.getElementById('own-gps-hud').classList.add('has-fix');
  document.getElementById('own-gps-label').textContent = 'OWN POS · ' + src;
  document.getElementById('own-gps-label').style.color = color;
  document.getElementById('own-gps-mgrs').textContent  = mgrs;
  document.getElementById('own-gps-ll').textContent    = lat.toFixed(5) + ', ' + lon.toFixed(5);
  document.getElementById('own-gps-acc').textContent   = '±' + acc + ' m';
  document.getElementById('own-gps-acc').style.color   = color;

  // Pulsing dot marker
  const ll        = [lat, lon];
  const dotColor  = viaWifi ? '#d29922' : '#388bfd';
  const ringColor = viaWifi ? 'rgba(210,153,34,.28)' : 'rgba(56,139,253,.28)';

  if (!_myPosMarker) {
    const icon = L.divIcon({
      className: '',
      html: '<div class="my-pos-wrap"><div class="my-pos-ring"></div><div class="my-pos-dot"></div></div>',
      iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -12],
    });
    _myPosMarker = L.marker(ll, {icon, zIndexOffset: 2000, interactive: true})
      .bindPopup('', {maxWidth: 220})
      .addTo(map);
    _myPosAccCircle = L.circle(ll, {
      radius: acc, color: dotColor, weight: 1,
      opacity: _gpsShowAccuracy ? 0.5 : 0,
      fillColor: dotColor, fillOpacity: _gpsShowAccuracy ? 0.06 : 0,
      interactive: false,
    }).addTo(map);
  } else {
    _myPosMarker.setLatLng(ll);
    _myPosAccCircle.setLatLng(ll).setRadius(acc).setStyle({
      color: dotColor, fillColor: dotColor,
      opacity:     _gpsShowAccuracy ? 0.5  : 0,
      fillOpacity: _gpsShowAccuracy ? 0.06 : 0,
    });
  }

  // Recolour pulsing dot via CSS variable trick (inject style)
  const wrap = _myPosMarker.getElement();
  if (wrap) {
    const dot  = wrap.querySelector('.my-pos-dot');
    const ring = wrap.querySelector('.my-pos-ring');
    if (dot)  { dot.style.background  = dotColor;  dot.style.boxShadow = `0 0 6px ${dotColor}cc`; }
    if (ring) { ring.style.background = ringColor; }
  }

  _myPosMarker.setPopupContent(
    '<div style="font-family:monospace;color:#c9d1d9;padding:8px 12px;font-size:11px">' +
    '<div style="font-weight:bold;color:' + dotColor + ';border-bottom:1px solid #30363d;' +
    'padding-bottom:4px;margin-bottom:5px">OWN POSITION · ' + src + '</div>' +
    '<div>MGRS ' + mgrs + '</div>' +
    '<div style="color:#6e7681;font-size:9px">' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</div>' +
    '<div style="color:' + color + ';margin-top:3px">ACC ±' + acc + ' m</div></div>'
  );
}

// Primary (GPS) error → start WiFi fallback, keep GPS watcher alive for recovery
function _onGPSPrimaryError(err) {
  if (err.code === 1) {
    // PERMISSION_DENIED — no point retrying
    _gpsSetLabel('DENIED', '#f85149');
    document.getElementById('own-gps-acc').textContent = '';
    return;
  }
  // POSITION_UNAVAILABLE (2) or TIMEOUT (3) → try WiFi
  _gpsStartWifiFallback();
}

// WiFi fallback also failed
function _onGPSFinalError(err) {
  const msgs = {1: 'DENIED', 2: 'NO SIGNAL', 3: 'TIMEOUT'};
  _gpsSetLabel(msgs[err.code] || 'ERR', '#f85149');
  document.getElementById('own-gps-acc').textContent = '';
  document.getElementById('own-gps-hud').classList.remove('has-fix');
}

function _gpsSetLabel(text, color) {
  const el = document.getElementById('own-gps-label');
  el.textContent = text;
  el.style.color = color || '#484f58';
}

// ================================================================
// BRIDGE
// ================================================================
function initBridge(){
  if(typeof QWebChannel==='undefined'){console.warn('[ArrowFront] No bridge');return;}
  new QWebChannel(qt.webChannelTransport,function(channel){
    bridge=channel.objects.bridge;bridge.onReady();console.log('[ArrowFront] Bridge ready');
  });
}
document.addEventListener('DOMContentLoaded', function() {
  initBridge();
  initGPS();
});
</script>
</body>
</html>
