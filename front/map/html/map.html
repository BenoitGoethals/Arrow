<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arrow Front COP</title>
<link  rel="stylesheet" href="lib/leaflet.css">
<script src="lib/leaflet.js"></script>
<link  rel="stylesheet" href="lib/leaflet.draw.css">
<script src="lib/leaflet.draw.js"></script>
<script src="lib/milsymbol.js"></script>
<script src="lib/mgrs.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#0d1117;overflow:hidden;font-family:'Courier New',monospace;}
/* will-change + translateZ forces #map into its own persistent GPU layer.
   Qt6/macOS Metal then composites overlays ON TOP of the map layer instead of
   re-rendering the map, eliminating the black-screen compositor bug. */
#map{width:100vw;height:100vh;background:#0d1117;
     will-change:transform;transform:translateZ(0);isolation:isolate;}
/* Keepalive: a zero-size child with a continuous transform animation forces
   the Chromium GPU process to submit fresh frames to the macOS Metal
   compositor every tick.  Without this, Metal marks the WebEngine IOSurface
   as stale after a native Qt overlay (QMenu) disappears and shows black. */
@keyframes _mk{from{transform:translateX(0)}to{transform:translateX(.001px)}}
#_mk{position:absolute;width:0;height:0;top:0;left:0;pointer-events:none;
     z-index:-1;animation:_mk 1s linear infinite;}
.leaflet-container{cursor:crosshair !important;}
.mil-icon{background:transparent !important;border:none !important;}

/* Popups */
.leaflet-popup-content-wrapper{background:#161b22;border:1px solid #30363d;border-radius:2px;color:#c9d1d9;padding:0;box-shadow:0 4px 16px rgba(0,0,0,.7);}
.leaflet-popup-content{margin:0;}
.leaflet-popup-tip-container{display:none;}
.leaflet-popup-close-button{color:#8b949e !important;right:6px !important;top:4px !important;}
.graphic-label{background:rgba(0,0,0,.78) !important;border:1px solid rgba(255,255,255,.22) !important;color:#e6edf3 !important;font-family:'Courier New',monospace !important;font-size:9px !important;font-weight:bold !important;letter-spacing:1.5px !important;padding:1px 5px !important;white-space:nowrap !important;border-radius:0 !important;box-shadow:none !important;}
.graphic-label::before{display:none !important;}
.leaflet-control-scale-line{background:rgba(13,17,23,.88);border:1px solid #30363d;color:#8b949e;font-family:'Courier New',monospace;font-size:9px;}
.leaflet-control-zoom a{background:#161b22 !important;border:1px solid #30363d !important;color:#c9d1d9 !important;}
.leaflet-control-zoom a:hover{background:#21262d !important;}
.leaflet-draw-toolbar a{background-color:#161b22 !important;border-color:#30363d !important;}

/* ================================================================
   RADIAL MENU (circular, large touch targets)
   ================================================================ */
/* backdrop removed — was creating a new GPU compositing layer in Qt6/macOS
   Metal that caused the map to go black; replaced with document mousedown */
#radial-menu{
  display:none;position:absolute;z-index:2000;
  width:300px;height:300px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
#radial-menu.active{display:block;}
/* central hub */
#radial-hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;
  background:rgba(10,13,18,.96);border:2px solid #30363d;
  display:flex;align-items:center;justify-content:center;
  pointer-events:all;cursor:pointer;z-index:5;
  box-shadow:0 2px 12px rgba(0,0,0,.7);
}
#radial-hub:hover{border-color:#f85149;}
#radial-hub .hub-x{color:#6e7681;font-size:20px;line-height:1;}
#radial-hub:hover .hub-x{color:#f85149;}
/* each petal — NO CSS transitions (each transition creates a promoted GPU
   layer; 8 simultaneous promotions overwhelm the Qt6/macOS Metal compositor
   and black out the map).  Petals appear instantly at their ring position. */
.radial-petal{
  position:absolute;left:50%;top:50%;
  width:72px;height:72px;
  margin:-36px 0 0 -36px;
  border-radius:50%;
  background:rgba(14,18,26,.97);
  border:2px solid #30363d;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;
  cursor:pointer;pointer-events:all;user-select:none;
  box-shadow:0 3px 14px rgba(0,0,0,.6);
}
#radial-menu.active .radial-petal{display:flex;}
.radial-petal .rp-icon{font-size:26px;line-height:1;pointer-events:none;}
.radial-petal .rp-lbl{
  font-family:'Courier New',monospace;font-size:8px;font-weight:700;
  letter-spacing:.6px;color:#8b949e;text-transform:uppercase;pointer-events:none;
}
#radial-menu.active .radial-petal:hover{background:rgba(31,111,235,.9);border-color:#388bfd;}
.radial-petal:hover .rp-lbl{color:#fff;}
#radial-menu.active .radial-petal.red:hover   {background:rgba(248,81,73,.9);border-color:#f85149;}
#radial-menu.active .radial-petal.green:hover {background:rgba(63,185,80,.9);border-color:#3fb950;}
#radial-menu.active .radial-petal.amber:hover {background:rgba(210,153,34,.9);border-color:#d29922;}
#radial-menu.active .radial-petal.purple:hover{background:rgba(210,168,255,.9);border-color:#d2a8ff;}

/* ================================================================
   TACTICAL OBJECT RADIAL (Delete / Move) — same Qt6/macOS constraints
   ================================================================ */
#tobj-radial{
  display:none;position:absolute;z-index:2001;
  width:300px;height:300px;
  transform:translate(-50%,-50%);
  pointer-events:none;
}
#tobj-radial.active{display:block;}
#tobj-hub{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:54px;height:54px;border-radius:50%;
  background:rgba(10,13,18,.96);border:2px solid #30363d;
  display:flex;align-items:center;justify-content:center;
  pointer-events:all;cursor:pointer;z-index:5;
  box-shadow:0 2px 12px rgba(0,0,0,.7);
}
#tobj-hub:hover{border-color:#f85149;}
#tobj-hub .hub-x{color:#6e7681;font-size:20px;line-height:1;}
#tobj-hub:hover .hub-x{color:#f85149;}
#tobj-radial.active .radial-petal{display:flex;}
/* Move-mode instruction banner */
#tobj-move-banner{
  display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);
  z-index:1600;background:rgba(13,17,23,.95);border:1px solid #388bfd;
  color:#79c0ff;font-family:'Courier New',monospace;font-size:11px;font-weight:700;
  padding:6px 14px;border-radius:3px;pointer-events:all;white-space:nowrap;
}
#tobj-move-cancel{
  background:none;border:none;color:#f85149;cursor:pointer;
  font-family:'Courier New',monospace;font-size:11px;font-weight:700;padding:0 0 0 8px;
}

/* ================================================================
   NAVIGATION HUD
   ================================================================ */
#nav-hud{
  display:none;position:absolute;bottom:20px;left:50%;margin-left:-185px;
  z-index:1800;width:370px;
  background:rgba(10,13,18,.97);border:1px solid #30363d;border-radius:4px;
  box-shadow:0 4px 20px rgba(0,0,0,.8);font-family:'Courier New',monospace;
  overflow:hidden;
}
#nav-hud.active{display:block;}
#nav-dir-row{
  display:flex;align-items:center;gap:10px;padding:10px 12px 8px;
  border-bottom:1px solid #21262d;
}
#nav-arrow-wrap{
  width:52px;height:52px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#161b22;border:1px solid #30363d;border-radius:50%;
}
#nav-bearing-info{flex:1;}
#nav-bearing-deg{font-size:22px;font-weight:700;color:#e6edf3;letter-spacing:1px;}
#nav-turn-hint{font-size:9px;font-weight:700;color:#79c0ff;letter-spacing:1px;margin-top:2px;min-height:13px;}
#nav-wp-badge{
  font-size:9px;font-weight:700;color:#0d1117;
  padding:3px 8px;border-radius:2px;letter-spacing:1px;align-self:flex-start;
}
#nav-wp-row{padding:7px 12px;border-bottom:1px solid #21262d;}
#nav-wp-label{font-size:12px;font-weight:700;color:#e6edf3;letter-spacing:.3px;}
#nav-wp-stats{font-size:10px;color:#8b949e;margin-top:3px;}
#nav-progress-row{
  display:flex;align-items:center;gap:8px;
  padding:5px 12px;border-bottom:1px solid #21262d;
}
#nav-progress-bar{flex:1;height:4px;background:#21262d;border-radius:2px;overflow:hidden;}
#nav-progress-fill{height:100%;background:#3fb950;width:0%;border-radius:2px;}
#nav-progress-text{font-size:9px;color:#6e7681;white-space:nowrap;}
#nav-ctrl-row{display:flex;gap:5px;padding:7px 12px;}
#nav-ctrl-row button{
  flex:1;background:#21262d;border:1px solid #30363d;color:#c9d1d9;
  font-family:'Courier New',monospace;font-size:9px;font-weight:700;
  padding:5px 4px;border-radius:2px;cursor:pointer;letter-spacing:.3px;
}
#nav-ctrl-row button:hover{background:#30363d;color:#e6edf3;}
#nav-stop-btn{color:#f85149 !important;border-color:#f85149 !important;}
#nav-stop-btn:hover{background:rgba(248,81,73,.15) !important;}
#nav-home-btn:hover{background:rgba(63,185,80,.15) !important;color:#3fb950 !important;}

/* ================================================================
   SYMBOL PICKER OVERLAY
   ================================================================ */
/* backdrop background removed — same Qt6/macOS Metal compositor bug as the
   radial menu backdrop; a position:fixed full-screen element with any non-transparent
   background creates a new GPU compositing layer that blacks out the map canvas */
#sym-overlay{display:none;position:fixed;inset:0;z-index:3000;align-items:center;justify-content:center;}
#sym-overlay.active{display:flex;}
#sym-panel{background:#161b22;border:1px solid #30363d;border-radius:4px;width:820px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.8);}
#sym-header{background:#0d1117;padding:14px 18px 10px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:10px;}
#sym-header h2{color:#e6edf3;font-size:15px;font-weight:700;flex:1;letter-spacing:.5px;}
#sym-location{color:#6e7681;font-size:10px;font-family:'Courier New',monospace;}
#sym-close{background:none;border:none;color:#8b949e;font-size:20px;cursor:pointer;padding:0 4px;}
#sym-close:hover{color:#f85149;}
#sym-controls{padding:10px 18px;border-bottom:1px solid #21262d;}
.sym-ctrl-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.sym-ctrl-label{color:#8b949e;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;min-width:90px;}
.aff-btn,.ech-btn{padding:5px 12px;border:1px solid #30363d;border-radius:2px;background:#21262d;color:#8b949e;font-size:10px;cursor:pointer;font-family:'Courier New',monospace;font-weight:600;letter-spacing:.5px;}
.aff-btn:hover,.ech-btn:hover{background:#30363d;color:#c9d1d9;}
.aff-btn.active{background:#1c2d3f;border-color:#1f6feb;color:#79c0ff;}
.aff-btn.active.hostile{background:#3d1c1c;border-color:#f85149;color:#f85149;}
.aff-btn.active.neutral{background:#2d2d1c;border-color:#d29922;color:#d29922;}
.aff-btn.active.unknown{background:#2a2a2a;border-color:#8b949e;color:#c9d1d9;}
.aff-btn.active.assumed{background:#1c2d3f;border-color:#79c0ff;color:#79c0ff;}
.ech-btn.active{background:#1c2d3f;border-color:#1f6feb;color:#79c0ff;}
#sym-body{overflow-y:auto;padding:14px 18px;flex:1;}
#sym-body::-webkit-scrollbar{width:6px;}#sym-body::-webkit-scrollbar-track{background:#0d1117;}#sym-body::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px;}
.sym-category{margin-bottom:18px;}
.sym-cat-title{font-size:10px;font-weight:700;color:#8b949e;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #21262d;}
.sym-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.sym-card{border:1px solid #30363d;border-radius:3px;background:#0d1117;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
.sym-card:hover{background:#1c2d3f;border-color:#1f6feb;}
.sym-card.selected{background:#1c2d3f;border-color:#1f6feb;box-shadow:0 0 0 1px #1f6feb;}
.sym-card svg,.sym-card canvas{width:44px;height:44px;display:block;}
.sym-name{font-size:9px;color:#8b949e;text-align:center;line-height:1.2;letter-spacing:.3px;}
.sym-card:hover .sym-name{color:#c9d1d9;}
.sym-card.selected .sym-name{color:#79c0ff;}
#sym-footer{padding:12px 18px;border-top:1px solid #30363d;display:flex;align-items:center;gap:10px;}
#sym-designation{flex:1;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:8px 12px;font-family:'Courier New',monospace;font-size:11px;border-radius:2px;}
#sym-designation:focus{outline:none;border-color:#388bfd;}
#sym-designation::placeholder{color:#484f58;}
#sym-cancel{padding:8px 20px;background:#21262d;border:1px solid #30363d;color:#c9d1d9;cursor:pointer;border-radius:2px;font-family:'Courier New',monospace;}
#sym-cancel:hover{background:#30363d;}
#sym-place{padding:8px 22px;background:#1f6feb;border:1px solid #388bfd;color:#fff;cursor:pointer;border-radius:2px;font-family:'Courier New',monospace;font-weight:700;letter-spacing:.5px;}
#sym-place:hover{background:#388bfd;}
#sym-place:disabled{opacity:.4;cursor:default;}

/* ================================================================
   MEASUREMENT TOOLKIT
   ================================================================ */
#meas-panel{
  display:none;position:absolute;top:54px;right:10px;z-index:900;
  background:rgba(13,17,23,.95);border:1px solid #388bfd;border-radius:3px;
  min-width:240px;box-shadow:0 4px 16px rgba(0,0,0,.7);
  font-family:'Courier New',monospace;font-size:10px;color:#c9d1d9;overflow:hidden;
}
#meas-panel.active{display:block;}
#meas-header{background:#161b22;padding:6px 12px;border-bottom:1px solid #21262d;
  display:flex;align-items:center;gap:8px;}
#meas-header span{color:#388bfd;font-size:9px;font-weight:700;letter-spacing:1.5px;flex:1;}
#meas-body{padding:8px 12px;}
.meas-row{display:grid;grid-template-columns:80px 1fr;gap:4px;padding:2px 0;line-height:1.5;}
.meas-k{color:#6e7681;font-size:9px;font-weight:700;letter-spacing:1px;align-self:center;}
.meas-v{color:#e6edf3;font-size:11px;font-weight:700;}
.meas-v.az{color:#d29922;}
.meas-v.dist{color:#3fb950;}
.meas-v.mgrs{color:#8b949e;font-size:9px;}
#meas-sep{height:1px;background:#21262d;margin:6px 0;}
#meas-footer{padding:6px 12px;border-top:1px solid #21262d;display:flex;gap:6px;}
.meas-foot-btn{flex:1;background:#21262d;border:1px solid #30363d;color:#8b949e;
  font-family:'Courier New',monospace;font-size:9px;cursor:pointer;padding:4px;border-radius:2px;}
.meas-foot-btn:hover{background:#30363d;color:#c9d1d9;}
.meas-foot-btn.primary{background:#1c2d3f;border-color:#1f6feb;color:#79c0ff;}

/* Range circle panel */
#range-panel{
  display:none;position:absolute;top:54px;right:10px;z-index:900;
  background:rgba(13,17,23,.95);border:1px solid #3fb950;border-radius:3px;
  min-width:260px;box-shadow:0 4px 16px rgba(0,0,0,.7);
  font-family:'Courier New',monospace;font-size:10px;color:#c9d1d9;overflow:hidden;
}
#range-panel.active{display:block;}
#range-header{background:#161b22;padding:6px 12px;border-bottom:1px solid #21262d;
  display:flex;align-items:center;gap:8px;}
#range-header span{color:#3fb950;font-size:9px;font-weight:700;letter-spacing:1.5px;flex:1;}
#range-center-label{color:#6e7681;font-size:9px;padding:6px 12px 4px;}
#range-presets{display:flex;flex-wrap:wrap;gap:4px;padding:4px 12px 8px;}
.rng-btn{background:#21262d;border:1px solid #30363d;color:#8b949e;
  font-family:'Courier New',monospace;font-size:9px;cursor:pointer;padding:4px 8px;border-radius:2px;}
.rng-btn:hover{background:#1a3020;border-color:#3fb950;color:#3fb950;}
#range-custom-row{display:flex;gap:6px;padding:0 12px 8px;align-items:center;}
#range-input{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;
  font-family:'Courier New',monospace;font-size:10px;padding:4px 8px;border-radius:2px;
  width:100px;}
#range-input:focus{outline:none;border-color:#3fb950;}
.range-unit{color:#6e7681;font-size:9px;}
#range-footer{padding:6px 12px;border-top:1px solid #21262d;display:flex;gap:6px;}

/* Measure label tooltips on map */
.meas-label{
  background:rgba(0,0,0,.8) !important;border:1px solid #388bfd !important;
  color:#79c0ff !important;font-family:'Courier New',monospace !important;
  font-size:9px !important;font-weight:700 !important;
  padding:1px 6px !important;border-radius:2px !important;white-space:nowrap !important;
  box-shadow:none !important;
}
.meas-label::before{display:none !important;}
.range-label{
  background:rgba(0,0,0,.8) !important;border:1px solid #3fb950 !important;
  color:#3fb950 !important;font-family:'Courier New',monospace !important;
  font-size:9px !important;font-weight:700 !important;
  padding:1px 6px !important;border-radius:2px !important;box-shadow:none !important;
}
.range-label::before{display:none !important;}

/* ================================================================
   WEATHER PANEL
   ================================================================ */
/* Weather panel */
#weather-panel{
  display:none;position:absolute;bottom:48px;left:10px;z-index:900;
  background:rgba(13,17,23,.94);border:1px solid #30363d;
  border-radius:2px;min-width:220px;overflow:hidden;
  box-shadow:0 4px 16px rgba(0,0,0,.6);
  font-family:'Courier New',monospace;
}
#weather-panel.active{display:block;}
#wx-header{
  background:#161b22;padding:6px 12px 5px;
  border-bottom:1px solid #30363d;
  display:flex;align-items:center;justify-content:space-between;
}
#wx-header span{color:#8b949e;font-size:9px;font-weight:700;letter-spacing:1.5px;}
#wx-close{background:none;border:none;color:#484f58;cursor:pointer;font-size:13px;padding:0 2px;}
#wx-close:hover{color:#f85149;}
#wx-body{padding:10px 12px;}
.wx-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;color:#c9d1d9;font-size:11px;}
.wx-icon{font-size:14px;width:20px;text-align:center;}
.wx-val{font-weight:700;color:#e6edf3;}
.wx-lbl{color:#6e7681;font-size:9px;}
#wx-radar-label{color:#3fb950;font-size:9px;margin-top:6px;padding-top:6px;border-top:1px solid #21262d;}
#wx-location{color:#484f58;font-size:9px;margin-top:2px;}

/* Free-draw text input overlay */
#fd-text-overlay{
  display:none;position:absolute;z-index:2100;
  background:rgba(13,17,23,.97);border:1px solid #388bfd;border-radius:3px;
  padding:6px 8px;gap:6px;align-items:center;flex-direction:row;
}
#fd-text-overlay.active{display:flex;}
#fd-text-input{
  background:#0d1117;border:1px solid #30363d;color:#c9d1d9;
  font-family:'Courier New',monospace;font-size:11px;padding:4px 8px;
  border-radius:2px;width:160px;outline:none;
}
#fd-text-input:focus{border-color:#388bfd;}
.fd-btn{
  background:#21262d;border:1px solid #30363d;color:#8b949e;
  font-family:'Courier New',monospace;font-size:10px;cursor:pointer;
  padding:4px 10px;border-radius:2px;
}
.fd-btn.primary{background:#1f6feb;border-color:#388bfd;color:#fff;}
.fd-btn:hover{background:#30363d;color:#c9d1d9;}
.fd-btn.primary:hover{background:#388bfd;}

/* ================================================================
   NORTH WIDGET + GPS HUD (top-left overlay)
   ================================================================ */
#north-widget{
  position:absolute;top:10px;left:10px;z-index:1000;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  pointer-events:none;
}
#north-rose{width:52px;height:52px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.7));}
#own-gps-hud{
  background:rgba(13,17,23,.88);border:1px solid #30363d;border-radius:2px;
  padding:5px 8px;font-family:'Courier New',monospace;font-size:9px;
  color:#6e7681;text-align:center;min-width:130px;line-height:1.6;
}
#own-gps-hud.has-fix{border-color:#3fb950;}
#own-gps-label{font-size:8px;font-weight:700;letter-spacing:1.5px;color:#484f58;text-transform:uppercase;}
#own-gps-acc{color:#3fb950;font-weight:700;}
#own-gps-mgrs{color:#e6edf3;font-weight:700;letter-spacing:0.5px;font-size:10px;}
#own-gps-ll{color:#484f58;font-size:8px;}

/* Pulsing GPS dot (own position marker) */
.my-pos-wrap{position:relative;width:20px;height:20px;}
.my-pos-ring{
  position:absolute;top:50%;left:50%;
  width:20px;height:20px;margin:-10px 0 0 -10px;
  border-radius:50%;background:rgba(56,139,253,.28);
  animation:gps-pulse 2s ease-out infinite;
}
.my-pos-dot{
  position:absolute;top:50%;left:50%;
  width:10px;height:10px;margin:-5px 0 0 -5px;
  border-radius:50%;background:#388bfd;
  border:2px solid #fff;box-shadow:0 0 6px rgba(56,139,253,.9);
}
@keyframes gps-pulse{
  0%  {transform:scale(0.5);opacity:1;}
  100%{transform:scale(2.8);opacity:0;}
}
</style>
</head>
<body>
<div id="map"><div id="_mk"></div></div>

<!-- North arrow + GPS HUD (top-left) -->
<div id="north-widget">
  <svg id="north-rose" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">

<script>
'use strict';

// ================================================================
// GUARD
// ================================================================
if (typeof L === 'undefined') {
  document.getElementById('map').innerHTML =
    '<div style="color:#f85149;font-family:monospace;padding:40px;font-size:14px">⚠ Map libraries missing — run setup_libs</div>';
  throw new Error('Leaflet not loaded');
}

// ================================================================
// STATE
// ================================================================
const tracks={}, trails={}, graphics={}, cotTracks={}, fireMissions={}, alertMarkers={}, kmlLayers={}, cbrnZones={};
const _routeLayers={};   // route_id → {line, markers:[], labels:[]}
let bridge=null, drawMode='pointer', drawHandler=null, measurePoints=[], measureLine=null;
let radialLatLng=null, pickerLat=null, pickerLon=null, selectedFunc=null, selectedDim='G';
let pickerAff='F', pickerEch='--', pickerEchCode='--';

// ================================================================
// MAP
// ================================================================
const map = L.map('map',{center:[50.85,4.35],zoom:11,zoomControl:false,attributionControl:false,
    preferCanvas:true});  // GPU canvas renderer (safe now — map served via HTTP)
L.control.zoom({position:'bottomright'}).addTo(map);
L.control.scale({position:'bottomleft',imperial:false}).addTo(map);

// Base layers
const TILES={
  OSM:      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}),
  DARK:     L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:'abcd'}),
  SATELLITE:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}),
  TOPO:     L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17}),
};
let activeBase='OSM';
TILES.OSM.addTo(map);

// MBTiles overlay layers — keyed by mbt_id, sit ABOVE base tiles (zIndex 5)
// but below vector overlays so markers / graphics remain readable.
const mbtileLayers = {}; // mbt_id → {layer, name, visible}

// Weather overlay layers
const WEATHER_LAYERS={};
let weatherOwmKey='';

// Tactical overlay layer groups
const LAYERS={
  operators:L.layerGroup().addTo(map), operTrails:L.layerGroup().addTo(map),
  cotTracks:L.layerGroup().addTo(map), enemies:L.layerGroup().addTo(map),
  tactObjs:L.layerGroup().addTo(map),  fireMissions:L.layerGroup().addTo(map),
  alerts:L.layerGroup().addTo(map),    graphics:L.layerGroup().addTo(map),
  kml:L.layerGroup().addTo(map),       cbrn:L.layerGroup().addTo(map),
  weather:L.layerGroup().addTo(map),   freedraw:L.layerGroup().addTo(map),
  routes:L.layerGroup().addTo(map),    vehicles:L.layerGroup().addTo(map),
};
const vehicleMarkers={};

// ================================================================
// 15-CHAR SIDC HELPERS (milsymbol v1.x / APP-6B legacy)
// ================================================================
// buildSIDC(ident, dim, func6, echCode2) → 15 chars
function buildSIDC(ident,dim,func6,echCode){
  return `S${ident}${dim}P${func6}${echCode}---`;
}

// Affiliation identity char
const AFF_CHAR={F:'F',H:'H',N:'N',U:'U',A:'A'};

function sidcFromCotType(cotType){
  const p=(cotType||'').split('-');
  const a={f:'F',h:'H',u:'U',n:'N',j:'U',k:'U'}[p[1]]||'U';
  const d={G:'G',A:'A',S:'S',U:'U',F:'G'}[p[2]]||'G';
  let func='U-----';
  const s=p.slice(3);
  if(s[0]==='U'&&s[1]==='C'){
    const leaf={I:'UCI---',A:'UCA---',F:'UCF---',R:'UCR---'}[s[2]]||'UC----';
    func=leaf;
  }
  return buildSIDC(a,d,func,'--');
}

// ================================================================
// SYMBOL CATEGORIES (for picker)
// ================================================================
const SYM_CATEGORIES=[
  {name:'GROUND — COMBAT',icon:'⚔',dim:'G',items:[
    {name:'Infantry',      func:'UCI---'},
    {name:'Airborne',      func:'UCIA--'},
    {name:'Air Assault',   func:'UCIZ--'},
    {name:'Light Inf',     func:'UCIL--'},
    {name:'Armor / Tank',  func:'UCA---'},
    {name:'Mechanized',    func:'UCIM--'},
    {name:'Armored Cav',   func:'UCRVA-'},
    {name:'Anti-Armor',    func:'UCAA--'},
    {name:'Recon / Scout', func:'UCR---'},
    {name:'Engineer',      func:'UCE---'},
    {name:'Sniper',        func:'UCIS--'},
    {name:'Special Forces',func:'UCFS--'},
    {name:'Aviation (AH)', func:'UCVF--'},
  ]},
  {name:'FIRE SUPPORT',icon:'🔥',dim:'G',items:[
    {name:'Artillery SP',   func:'UCFHE-'},
    {name:'Artillery Towed',func:'UCFHA-'},
    {name:'Mortar',         func:'UCFM--'},
    {name:'MLRS / Rocket',  func:'UCFR--'},
    {name:'Air Defense',    func:'UCD---'},
    {name:'AD (SHORAD)',    func:'UCDMH-'},
    {name:'AD (Gun)',       func:'UCDG--'},
  ]},
  {name:'C2 / SUPPORT',icon:'◉',dim:'G',items:[
    {name:'HQ / Cmd Post', func:'UH----'},
    {name:'Medical',       func:'USM---'},
    {name:'Supply / Log',  func:'USS---'},
    {name:'Transport',     func:'UST---'},
    {name:'Maintenance',   func:'USX---'},
    {name:'Signal',        func:'UUS---'},
    {name:'Intelligence',  func:'UUMA--'},
    {name:'CBRN / NBC',    func:'UUAC--'},
    {name:'MP / Police',   func:'UUL---'},
    {name:'Vehicle',       func:'UCV---'},
  ]},
  {name:'AIR',icon:'✈',dim:'A',items:[
    {name:'Fighter',       func:'MFF---'},
    {name:'Bomber',        func:'MFB---'},
    {name:'Attack Fixed',  func:'MFA---'},
    {name:'Attack Helo',   func:'MFHA--'},
    {name:'Utility Helo',  func:'MFHU--'},
    {name:'UAV / Drone',   func:'MFQ---'},
    {name:'Transport',     func:'MFT---'},
  ]},
];

// ================================================================
// SYMBOL PICKER
// ================================================================
function openSymbolPicker(lat,lon,defaultAff){
  pickerLat=lat; pickerLon=lon;
  pickerAff=(defaultAff==='HOSTILE'||defaultAff==='H')?'H':(defaultAff==='NEUTRAL'||defaultAff==='N')?'N':(defaultAff==='UNKNOWN'||defaultAff==='U')?'U':'F';
  selectedFunc=null; selectedDim='G';
  document.getElementById('sym-location').textContent=latLonToMGRS(lat,lon);
  document.getElementById('sym-designation').value='';
  document.getElementById('sym-place').disabled=true;
  // Sync affiliation buttons
  document.querySelectorAll('.aff-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.aff===pickerAff);
  });
  document.querySelectorAll('.ech-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.ech==='--');
    if(b.dataset.ech==='--'){pickerEch='--';pickerEchCode='--';}
  });
  buildSymbolGrid();
  document.getElementById('sym-overlay').classList.add('active');
}

function closeSymbolPicker(){
  document.getElementById('sym-overlay').classList.remove('active');
}

// Close on click outside the panel (no backdrop — same pattern as radial menu)
document.getElementById('sym-overlay').addEventListener('mousedown', function(e){
  if (!document.getElementById('sym-panel').contains(e.target)) closeSymbolPicker();
});

function buildSymbolGrid(){
  const body=document.getElementById('sym-body');
  body.innerHTML='';
  SYM_CATEGORIES.forEach(cat=>{
    const sec=document.createElement('div');
    sec.className='sym-category';
    sec.innerHTML=`<div class="sym-cat-title">${cat.icon} ${cat.name}</div>`;
    const grid=document.createElement('div');
    grid.className='sym-grid';
    cat.items.forEach(item=>{
      const sidc=buildSIDC(pickerAff,cat.dim,item.func,pickerEchCode||'--');
      const card=document.createElement('div');
      card.className='sym-card';
      card.dataset.func=item.func;
      card.dataset.dim=cat.dim;
      card.title=item.name;
      // render milsymbol SVG
      let svgHtml='';
      if(typeof ms!=='undefined'){
        try{
          const sym=new ms.Symbol(sidc,{size:32});
          svgHtml=sym.asSVG();
        }catch(_){svgHtml='<div style="width:44px;height:44px;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;color:#484f58;font-size:9px">?</div>';}
      }
      card.innerHTML=`${svgHtml}<span class="sym-name">${item.name}</span>`;
      card.addEventListener('click',()=>selectSymbolCard(card,item.func,cat.dim));
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    body.appendChild(sec);
  });
}

function selectSymbolCard(card,func,dim){
  document.querySelectorAll('.sym-card').forEach(c=>c.classList.remove('selected'));
  card.classList.add('selected');
  selectedFunc=func; selectedDim=dim;
  document.getElementById('sym-place').disabled=false;
}

function placeSelectedSymbol(){
  if(!selectedFunc||pickerLat==null) return;
  const sidc=buildSIDC(pickerAff,selectedDim,selectedFunc,pickerEchCode||'--');
  const desig=document.getElementById('sym-designation').value.trim();
  if(bridge) bridge.onSymbolSelected(sidc,desig,pickerLat,pickerLon);
  closeSymbolPicker();
}

// Affiliation buttons
document.querySelectorAll('.aff-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    pickerAff=btn.dataset.aff;
    document.querySelectorAll('.aff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedFunc=null;
    document.getElementById('sym-place').disabled=true;
    buildSymbolGrid();
  });
});
document.querySelectorAll('.ech-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    pickerEch=btn.dataset.ech; pickerEchCode=btn.dataset.echcode;
    document.querySelectorAll('.ech-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    buildSymbolGrid();  // re-render with new echelon
  });
});

// ================================================================
// TRACK (OPERATOR)
// ================================================================
function updateTrack(t){
  const layer=t.affiliation==='HOSTILE'?LAYERS.enemies:LAYERS.operators;
  const icon=buildMilIcon(t.sidc,t.callsign,t.unit,t.heading,t.position_source==='ATAK'?'ATAK':'');
  const popup=buildTrackPopup(t);
  if(tracks[t.id]){tracks[t.id].marker.setLatLng([t.lat,t.lon]).setIcon(icon).setPopupContent(popup);}
  else{const m=L.marker([t.lat,t.lon],{icon,zIndexOffset:1000}).bindPopup(popup,{maxWidth:260}).on('click',()=>{if(bridge)bridge.onTrackClicked(String(t.id));}).addTo(layer);tracks[t.id]={marker:m,layer};}
  addTrailSeg(LAYERS.operTrails,trails,t.id,t.lat,t.lon,t.online===false?'#6e7681':t.affiliation==='HOSTILE'?'#f85149':'#3fb950');
}
function removeTrack(id){if(tracks[id]){tracks[id].layer.removeLayer(tracks[id].marker);delete tracks[id];}if(trails[id]){LAYERS.operTrails.removeLayer(trails[id]);delete trails[id];}}

// ================================================================
// COT TRACKS
// ================================================================
function updateCotTrack(t){
  const sidc=sidcFromCotType(t.cot_type);
  const icon=buildMilIcon(sidc,t.callsign||t.cot_uid,t.team,t.course);
  const pop=`<div style="font-family:monospace;color:#c9d1d9;padding:10px 14px;font-size:11px">
    <div style="font-weight:bold;color:#79c0ff;border-bottom:1px solid #30363d;padding-bottom:5px;margin-bottom:6px">CoT: ${esc(t.callsign||t.cot_uid)}</div>
    <div>TYPE ${esc(t.cot_type||'—')}</div><div>MGRS ${latLonToMGRS(t.latitude,t.longitude)}</div>
    ${t.speed?`<div>SPD ${Math.round(t.speed)} kt</div>`:''}${t.course?`<div>HDG ${Math.round(t.course)}°</div>`:''}
  </div>`;
  if(cotTracks[t.cot_uid]){cotTracks[t.cot_uid].setLatLng([t.latitude,t.longitude]).setIcon(icon).setPopupContent(pop);}
  else{cotTracks[t.cot_uid]=L.marker([t.latitude,t.longitude],{icon}).bindPopup(pop,{maxWidth:250}).addTo(LAYERS.cotTracks);}
}
function removeCotTrack(uid){if(cotTracks[uid]){LAYERS.cotTracks.removeLayer(cotTracks[uid]);delete cotTracks[uid];}}

// ================================================================
// VEHICLES — position follows the assigned operator (derived server-side)
// ================================================================
const OPS_STATUS_COLOR={OPS:'#3fb950',INOPS:'#d29922',KIA:'#f85149',MIA:'#ff9e64'};
function vehicleSidc(v){
  if(v.symbol_code&&v.symbol_code.length>=10)return v.symbol_code;
  const aff={FRIENDLY:'F',ENEMY:'H',UNKNOWN:'U',NEUTRAL:'N'}[v.affiliation]||'F';
  return `S${aff}GPEVC--------`;   // ground equipment / vehicle
}
function updateVehicle(v){
  // No fix yet (unassigned or assignee offline without position) → drop it.
  if(v.latitude==null||v.longitude==null){removeVehicle(v.id);return;}
  const st=(v.ops_status||'OPS').toUpperCase();
  const icon=buildMilIcon(vehicleSidc(v),`🚙 ${v.callsign||''}`,v.vehicle_type||'',null);
  const pop=`<div style="font-family:monospace;color:#c9d1d9;padding:10px 14px;font-size:11px">
    <div style="font-weight:bold;color:#79c0ff;border-bottom:1px solid #30363d;padding-bottom:5px;margin-bottom:6px">🚙 ${esc(v.callsign||'')}</div>
    <div>TYPE ${esc(v.vehicle_type||'vehicle')}</div>
    <div>STATUS <span style="color:${OPS_STATUS_COLOR[st]||'#c9d1d9'}">${esc(st)}</span></div>
    <div>MGRS ${latLonToMGRS(v.latitude,v.longitude)}</div>
    <div>${v.operator_id?('OP #'+v.operator_id):(v.team_id?('TEAM #'+v.team_id):'unassigned')}</div>
  </div>`;
  const op=(st==='OPS')?1:0.5;
  if(vehicleMarkers[v.id]){vehicleMarkers[v.id].setLatLng([v.latitude,v.longitude]).setIcon(icon).setPopupContent(pop).setOpacity(op);}
  else{vehicleMarkers[v.id]=L.marker([v.latitude,v.longitude],{icon,opacity:op}).bindPopup(pop,{maxWidth:250}).addTo(LAYERS.vehicles);}
}
function removeVehicle(id){if(vehicleMarkers[id]){LAYERS.vehicles.removeLayer(vehicleMarkers[id]);delete vehicleMarkers[id];}}

// ================================================================
// TACTICAL OBJECTS
// ================================================================
// Types that use APP-6B unit symbols (milsymbol frames)
const UNIT_SIDC={
  ENEMY:'SHGPUCI---D----', HOSTILE:'SHGPUCI---D----',
  FRIENDLY:'SFGPUCI---D----', UNKNOWN:'SUGPUU----D----',
  VEHICLE:'SHGPUCA---D----', ARTILLERY:'SHGPUCF---D----',
  OBJECTIVE:'SFGPUH----F----', ZONE:'SNGPUU----E----', ROUTE:'SFGPUCI---E----',
};
// Control/named positions — render as pin icons, NOT unit symbols
const PIN_TYPES=new Set(['POI','MARKER','WAYPOINT']);

function _pinIcon(notes, aff){
  const n=(notes||'').toUpperCase();
  // Colour by content
  let c='#c9d1d9';
  if(n.includes('DZ ')||n.includes('DZ FALCON')||n.includes('DZ EAGLE')) c='#3fb950';
  else if(n.includes('AA ')||n.includes('ASSEMBLY')) c='#79c0ff';
  else if(n.includes('RP ')||n.includes('RELEASE')) c='#d29922';
  else if(n.includes('MEDEVAC')||n.includes('CCP')) c='#ff9e64';
  else if(aff==='HOSTILE'||aff==='ENEMY') c='#f85149';
  // DZ/LZ → diamond  | waypoint → circle
  const isDZ=n.includes('DZ ')||n.includes('LZ ');
  const svg=isDZ
    ?`<svg width="22" height="22" viewBox="0 0 22 22"><polygon points="11,1 21,11 11,21 1,11" fill="${c}" fill-opacity=".9" stroke="#0d1117" stroke-width="1.5"/></svg>`
    :`<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="${c}" fill-opacity=".9" stroke="#0d1117" stroke-width="1.5"/></svg>`;
  return L.divIcon({html:svg,className:'mil-icon',iconSize:[22,22],iconAnchor:[11,11],popupAnchor:[0,-13]});
}

function addTacticalObject(obj){
  const type=obj.type||'UNKNOWN';
  const aff=obj.affiliation||'UNKNOWN';
  const layer=aff==='ENEMY'||aff==='HOSTILE'?LAYERS.enemies:LAYERS.tactObjs;
  let geom=obj.geometry;
  if(typeof geom==='string'&&geom){try{geom=JSON.parse(geom);}catch(_){geom=null;}}
  let lyr;

  // Free-draw annotations from web/any client
  if(type==='FREEDRAW_LINE'||type==='FREEDRAW_TEXT'){
    try {
      const notes = typeof obj.notes==='string' ? JSON.parse(obj.notes||'{}') : (obj.notes||{});
      const color = notes.color||'#ef4444';
      if(type==='FREEDRAW_LINE' && geom && geom.coords && geom.coords.length>=2){
        const lyr=L.polyline(geom.coords.map(c=>[c[0],c[1]]),{
          color,weight:notes.thick||2,opacity:.92,lineCap:'round',lineJoin:'round',interactive:false
        }).addTo(LAYERS.freedraw);
        if(graphics[obj.id]) LAYERS.freedraw.removeLayer(graphics[obj.id]);
        graphics[obj.id]=lyr;
      } else if(type==='FREEDRAW_TEXT' && geom && geom.coords && geom.coords[0]){
        const [lat,lon]=geom.coords[0];
        const sh='1px 1px 3px #000,-1px -1px 3px #000';
        const lyr=L.marker([lat,lon],{interactive:false,icon:L.divIcon({
          className:'',
          html:`<div style="color:${color};font-family:'Courier New',monospace;font-size:13px;font-weight:700;white-space:nowrap;text-shadow:${sh};pointer-events:none">${esc(notes.text||'')}</div>`,
          iconSize:[0,0],iconAnchor:[0,8]
        })}).addTo(LAYERS.freedraw);
        if(graphics[obj.id]) LAYERS.freedraw.removeLayer(graphics[obj.id]);
        graphics[obj.id]=lyr;
      }
    } catch(e){}
    return;
  }

  // Tactical graphic types (line or polygon geometry) → proper APP-6 renderer
  const isLinePoly = geom && (geom.type==='line'||geom.type==='polygon') && geom.coords && geom.coords.length>=2;
  if(TG[type] && isLinePoly){
    const pts = geom.coords.map(c=>L.latLng(c[0],c[1]));
    lyr = buildTacticalGraphic(type, pts, obj.notes||'', aff);
    lyr.addTo(LAYERS.graphics);
    if(graphics[obj.id]) LAYERS.graphics.removeLayer(graphics[obj.id]);
    graphics[obj.id]=lyr;
    return;
  }

  if(geom&&geom.type==='line'&&geom.coords){lyr=L.polyline(geom.coords.map(c=>[c[0],c[1]]),{color:aff==='HOSTILE'?'#f85149':'#3fb950',weight:2}).addTo(layer);}
  else if(geom&&geom.type==='polygon'&&geom.coords){lyr=L.polygon(geom.coords.map(c=>[c[0],c[1]]),{color:'#d29922',fillOpacity:.1}).addTo(layer);}
  else{
    const lat=obj.latitude||(geom&&geom.coords?.[0]?.[0]);
    const lon=obj.longitude||(geom&&geom.coords?.[0]?.[1]);
    if(!lat||!lon) return;
    let icon;
    // If an explicit MIL-STD symbol_code is present (from the symbol picker),
    // ALWAYS render the APP-6B military frame — even for MARKER/POI types.
    if(obj.symbol_code && obj.symbol_code.length>=10){
      icon=buildMilIcon(obj.symbol_code,'','',obj.rotation);
    } else if(PIN_TYPES.has(type)){
      // Bare named positions / waypoints with no symbol → clean coloured pin
      icon=_pinIcon(obj.notes, aff);
    } else {
      // Military units / vehicles / objectives → APP-6B milsymbol frame
      const sidc=UNIT_SIDC[type]||'SUGPUU----D----';
      icon=buildMilIcon(sidc,'','',obj.rotation);
    }
    lyr=L.marker([lat,lon],{icon}).bindPopup(buildObjPopup(obj),{maxWidth:260}).addTo(layer);
    const _capObjId=obj.id;
    lyr.on('contextmenu',function(e){L.DomEvent.stop(e);openTobjRadial(e.containerPoint,_capObjId);});
  }
  if(graphics[obj.id]) layer.removeLayer(graphics[obj.id]);
  graphics[obj.id]=lyr;
}
function removeTacticalObject(id){if(graphics[id]){LAYERS.enemies.removeLayer(graphics[id]);LAYERS.tactObjs.removeLayer(graphics[id]);LAYERS.graphics.removeLayer(graphics[id]);delete graphics[id];}}
function buildObjPopup(obj){const c=obj.affiliation==='HOSTILE'?'#f85149':'#d29922';return `<div style="font-family:monospace;color:#c9d1d9;padding:10px 14px;font-size:11px;min-width:190px"><div style="font-weight:bold;color:${c};border-bottom:1px solid #30363d;padding-bottom:5px;margin-bottom:6px">${esc(obj.type)} ${obj.echelon?'['+esc(obj.echelon)+']':''}</div>${obj.notes?`<div>${esc(obj.notes)}</div>`:''}${obj.latitude?`<div>MGRS ${latLonToMGRS(obj.latitude,obj.longitude)}</div>`:''}<div style="color:#6e7681;font-size:9px;margin-top:5px">${esc(obj.timestamp||'')}</div></div>`;}

  // MEDEVAC / EVAC → 🚁 medevac arrow at the casualty grid

  let n=0;const iv=setInterval(()=>{circle.setStyle({fillOpacity:n%2===0?.05:.35});if(++n>16){clearInterval(iv);circle.setStyle({fillOpacity:.2});}},450);

function addKmlLayer(kml){
  if(kmlLayers[kml.id]){LAYERS.kml.removeLayer(kmlLayers[kml.id]);delete kmlLayers[kml.id];}
  if(!kml.visible||!kml.features?.length) return;
  const grp=L.layerGroup();
  kml.features.forEach(f=>{
    const g=f.geometry||{},nm=(f.properties||{}).name||'',desc=(f.properties||{}).description||'',c=(f.style||{}).color||'#79c0ff',pop=`<div style="font-family:monospace;color:#c9d1d9;padding:8px 12px;font-size:11px"><b>${esc(nm)}</b>${desc?`<br>${esc(desc)}`:''}</div>`;
    if(g.type==='Point') L.circleMarker([g.coordinates[1],g.coordinates[0]],{radius:5,color:c,fillColor:c,fillOpacity:.8}).bindPopup(pop).addTo(grp);
    else if(g.type==='LineString') L.polyline(g.coordinates.map(c=>[c[1],c[0]]),{color:c,weight:2}).bindPopup(pop).addTo(grp);
    else if(g.type==='MultiLineString') g.coordinates.forEach(l=>L.polyline(l.map(c=>[c[1],c[0]]),{color:c,weight:2}).bindPopup(pop).addTo(grp));
    else if(g.type==='Polygon') L.polygon(g.coordinates[0].map(c=>[c[1],c[0]]),{color:c,fillColor:c,fillOpacity:.1,weight:2}).bindPopup(pop).addTo(grp);
  });
  grp.addTo(LAYERS.kml); kmlLayers[kml.id]=grp;
}
function removeKmlLayer(id){if(kmlLayers[id]){LAYERS.kml.removeLayer(kmlLayers[id]);delete kmlLayers[id];}}

function addCbrnZone(report){
  const p=report.payload||{};
  const lat=parseFloat(p.latitude||p.lat||0),lon=parseFloat(p.longitude||p.lon||0);
  if(!lat||!lon) return;
  if(cbrnZones[report.id]){LAYERS.cbrn.removeLayer(cbrnZones[report.id]);delete cbrnZones[report.id];}
  const grp=L.layerGroup();
  const z1r=parseFloat(p.zone1_radius_km||p.radius_km||1)*1000;
  L.circle([lat,lon],{radius:z1r,color:'#ff0000',fillColor:'#ff0000',fillOpacity:.15,weight:2,dashArray:'6,4'}).bindTooltip(`CBRN ZONE I — ${p.agent||'?'}`,{className:'graphic-label'}).addTo(grp);
  const z2d=parseFloat(p.zone2_direction||p.wind_direction||0),z2dist=parseFloat(p.zone2_distance_km||p.downwind_km||5)*1000;
  if(z2dist>0){L.polygon(buildSector([lat,lon],z2d,45,z2dist),{color:'#ff8800',fillColor:'#ff8800',fillOpacity:.1,weight:1.5,dashArray:'8,4'}).bindTooltip('CBRN ZONE II',{className:'graphic-label'}).addTo(grp);}
  L.circleMarker([lat,lon],{radius:6,color:'#ff0000',fillColor:'#ff4400',fillOpacity:.9}).bindPopup(`<div style="font-family:monospace;color:#c9d1d9;padding:10px 14px;font-size:11px"><b style="color:#f85149">☢ CBRN ${esc(report.type)}</b><br>Agent: ${esc(p.agent||'—')}<br>MGRS: ${latLonToMGRS(lat,lon)}</div>`).addTo(grp);
  grp.addTo(LAYERS.cbrn); cbrnZones[report.id]=grp;
}
function buildSector(ctr,brg,half,r){const pts=[ctr];for(let a=brg-half;a<=brg+half;a+=5)pts.push(destPoint(ctr[0],ctr[1],a,r));pts.push(ctr);return pts;}
function destPoint(lat,lon,b,d){const R=6371000,br=b*Math.PI/180,dr=d/R,φ1=lat*Math.PI/180,λ1=lon*Math.PI/180,φ2=Math.asin(Math.sin(φ1)*Math.cos(dr)+Math.cos(φ1)*Math.sin(dr)*Math.cos(br)),λ2=λ1+Math.atan2(Math.sin(br)*Math.sin(dr)*Math.cos(φ1),Math.cos(dr)-Math.sin(φ1)*Math.sin(φ2));return[φ2*180/Math.PI,λ2*180/Math.PI];}

// ── Native click-based tactical-graphic drawing ───────────────────────────
// (Leaflet.draw 1.0.4 is incompatible with Leaflet 1.9 — we draw natively.)
const POLY_DRAW_TYPES = new Set([
  'NFA','FFA','OBJECTIVE','OBJ_AREA','ENGAGEMENT_AREA','NAI','TAI',
  'OBJ_F','OBJ_H','AMB_F','AMB_H','ASSEMBLY_AREA','ZONE'
]);

let _drawType   = null;     // active graphic type
let _drawAff    = 'F';
let _drawIsPoly = false;
let _drawPts    = [];       // clicked LatLngs
let _drawTemp   = [];       // temporary marker/preview layers
let _drawPreview= null;     // live preview line/poly

function setDrawGraphic(type, aff){
  cancelDraw();                       // clear any prior draw session
  if(type==='pointer'||type==='none'){drawMode='pointer';return;}
  if(type==='measure'){startMeasure('distance');return;}

  _drawType   = type;
  _drawAff    = aff || 'F';
  _drawIsPoly = POLY_DRAW_TYPES.has(type);
  _drawPts    = [];
  drawMode    = 'draw';
  map.doubleClickZoom.disable();
  map.getContainer().style.cursor = 'crosshair';

  // Show instruction banner
  _setDrawBanner((_drawIsPoly?'AREA':'LINE')+' — '+type+
    ' · click to add points · double-click / right-click to finish · ESC cancels');

  map.on('click',     _drawClick);
  map.on('mousemove', _drawMove);
  map.on('dblclick',  _drawFinish);
  map.on('contextmenu', _drawFinishCtx);
}
function setDrawMode(mode){ setDrawGraphic(mode,'F'); }

function _drawStyle(){
  return GFX_STYLE[_drawType] || {color:_drawAff==='H'?'#f85149':'#00aaff',weight:2,fill:false};
}

function _drawClick(e){
  // prevent the pointer-mode map click handler
  _drawPts.push(e.latlng);
  const s=_drawStyle();
  const dot=L.circleMarker(e.latlng,{radius:4,color:s.color,fillColor:s.color,fillOpacity:1,weight:1}).addTo(map);
  _drawTemp.push(dot);
  _renderPreview(e.latlng);
}

function _drawMove(e){
  if(_drawPts.length===0) return;
  _renderPreview(e.latlng);
}

function _renderPreview(cursorLL){
  const s=_drawStyle();
  const pts=cursorLL?[..._drawPts,cursorLL]:[..._drawPts];
  if(_drawPreview){map.removeLayer(_drawPreview);_drawPreview=null;}
  if(pts.length<2 && !_drawIsPoly) {
    if(pts.length<1) return;
  }
  if(_drawIsPoly && pts.length>=2){
    _drawPreview=L.polygon(pts,{color:s.color,weight:s.weight,dashArray:s.dashArray,
      fill:true,fillColor:s.color,fillOpacity:(s.fillOpacity||.08)}).addTo(map);
  } else if(pts.length>=2){
    _drawPreview=L.polyline(pts,{color:s.color,weight:s.weight,dashArray:s.dashArray}).addTo(map);
  }
}

function _drawFinishCtx(e){
  if(e&&e.originalEvent){e.originalEvent.preventDefault();e.originalEvent.stopPropagation();}
  _drawFinish();
}

function _drawFinish(){
  const type=_drawType, isPoly=_drawIsPoly, pts=[..._drawPts];
  const minPts=isPoly?3:2;
  if(pts.length<minPts){ cancelDraw(); return; }

  // Build the proper APP-6 tactical graphic
  const _affName=_drawAff==='H'?'HOSTILE':_drawAff==='N'?'NEUTRAL':_drawAff==='U'?'UNKNOWN':'FRIENDLY';
  const grp=buildTacticalGraphic(type, pts, '', _affName);
  grp.addTo(LAYERS.graphics);
  const lid='draw_'+Date.now();
  graphics['gfx_'+lid]=grp;

  // Backend format: {type:'line'|'polygon', coords:[[lat,lon],...]}
  const coords = pts.map(p=>[p.lat, p.lng]);
  const geom = isPoly ? {type:'polygon', coords:coords}
                      : {type:'line',    coords:coords};
  const affName = _drawAff==='H' ? 'HOSTILE' : _drawAff==='N' ? 'NEUTRAL' : _drawAff==='U' ? 'UNKNOWN' : 'FRIENDLY';
  if(bridge) bridge.onGraphicDrawn(type, JSON.stringify(geom), affName);

  cancelDraw();
}

function cancelDraw(){
  map.off('click',     _drawClick);
  map.off('mousemove', _drawMove);
  map.off('dblclick',  _drawFinish);
  map.off('contextmenu', _drawFinishCtx);
  _drawTemp.forEach(l=>map.removeLayer(l)); _drawTemp=[];
  if(_drawPreview){map.removeLayer(_drawPreview);_drawPreview=null;}
  _drawPts=[]; _drawType=null; drawMode='pointer';
  map.doubleClickZoom.enable();
  map.getContainer().style.cursor='';
  _setDrawBanner('');
  // Also stop free draw if active
  if(_fdTool !== 'none') _fdStopAll();
}

function _setDrawBanner(txt){
  let b=document.getElementById('draw-banner');
  if(!txt){ if(b) b.style.display='none'; return; }
  if(!b){
    b=document.createElement('div'); b.id='draw-banner';
    b.style.cssText='position:absolute;top:8px;left:50%;transform:translateX(-50%);'+
      'z-index:1500;background:rgba(13,17,23,.95);border:1px solid #388bfd;'+
      'color:#79c0ff;font-family:Courier New,monospace;font-size:11px;font-weight:700;'+
      'padding:6px 14px;border-radius:3px;pointer-events:none;white-space:nowrap;';
    document.getElementById('map').appendChild(b);
  }
  b.textContent=txt; b.style.display='block';
}

// ESC cancels move mode, tactical drawing, and free draw
document.addEventListener('keydown',function(e){
  if(e.key !== 'Escape') return;
  if(typeof _tobjMoveId!=='undefined'&&_tobjMoveId!==null){_cancelTobjMove();return;}
  if(drawMode==='routedraw')         { cancelRouteDrawing(); return; }
  if(_drawType)          { cancelDraw(); return; }
  if(_fdTool !== 'none') { _fdStopAll(); drawMode='pointer'; }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
const _ROUTE_WP_COLORS = {
  START:'#3fb950', END:'#f85149', IP:'#ff9e64', RV:'#d2a8ff',
  CP:'#79c0ff', RP:'#d29922', HOLD:'#8b949e', WP:null,
};

function _haversineM(a, b) {
  const R=6371000, dlat=(b.lat-a.lat)*Math.PI/180, dlon=(b.lon-a.lon)*Math.PI/180;
  const la1=a.lat*Math.PI/180, la2=b.lat*Math.PI/180;
  const x=Math.sin(dlat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlon/2)**2;
  return 2*R*Math.asin(Math.sqrt(Math.max(0,x)));
}

function _fmtRouteDist(m) {
  if(m>=10000) return (m/1000).toFixed(1)+' km';
  if(m>=1000)  return (m/1000).toFixed(2)+' km';
  return Math.round(m)+' m';
}

function _fmtRouteEta(mins) {
  if(mins<1)  return '<1m';
  if(mins<60) return Math.round(mins)+'m';
  return Math.floor(mins/60)+'h '+Math.round(mins%60).toString().padStart(2,'0')+'m';
}

function _routeWpIcon(type, idx, routeColor) {
  const c = _ROUTE_WP_COLORS[type] || routeColor || '#79c0ff';
  const lbl = {START:'S',END:'E',IP:'IP',RV:'RV',CP:'CP',RP:'RP',HOLD:'H'}[type] || String(idx);
  const fs = lbl.length > 1 ? 7 : 10;
  const r = 11;
  const svg = `<svg width="${r*2}" height="${r*2}" viewBox="0 0 ${r*2} ${r*2}">
    <circle cx="${r}" cy="${r}" r="${r-1.5}" fill="${c}" fill-opacity=".92" stroke="#0d1117" stroke-width="1.5"/>
    <text x="${r}" y="${r}" text-anchor="middle" dominant-baseline="middle"
      font-family="Courier New,monospace" font-size="${fs}" font-weight="700" fill="#fff">${lbl}</text>
  </svg>`;
  return L.divIcon({
    html: svg, className:'mil-icon',
    iconSize:[r*2,r*2], iconAnchor:[r,r], popupAnchor:[0,-r-2]
  });
}

function _routeWpPopup(wp, routeName, idx, cumDist, etaMin) {
  const c = _ROUTE_WP_COLORS[wp.type||'WP'] || '#79c0ff';
  const typeLabel = wp.type || 'WP';
  const labelPart = wp.label ? ` — ${esc(wp.label)}` : '';
  return `<div style="font-family:'Courier New',monospace;color:#c9d1d9;padding:10px 14px;font-size:11px;min-width:190px">
    <div style="font-weight:700;color:${c};border-bottom:1px solid #30363d;padding-bottom:4px;margin-bottom:6px">
      ${typeLabel}${labelPart}
    </div>
    ${wp.notes ? `<div style="margin-bottom:4px">${esc(wp.notes)}</div>` : ''}
    <div style="color:#6e7681;font-size:9px">${latLonToMGRS(wp.lat,wp.lon)}</div>
    ${cumDist !== undefined ? `<div style="color:#3fb950;font-size:9px;margin-top:3px">📏 ${_fmtRouteDist(cumDist)} from START</div>` : ''}
    ${etaMin  !== undefined ? `<div style="color:#d29922;font-size:9px">⏱ H+${_fmtRouteEta(etaMin)} @ route speed</div>` : ''}
    <div style="color:#484f58;font-size:8px;margin-top:2px">Route: ${esc(routeName||'')}</div>
  </div>`;
}

// ── Drawing mode ──────────────────────────────────────────────────────────────
let _routeDrawId    = null;
let _routeDrawColor = '#3fb950';
let _routeDrawPts   = [];
let _routeDrawMks   = [];
let _routeDrawLine  = null;

function startRouteDrawing(routeId, color) {
  cancelRouteDrawing();
  _routeDrawId    = routeId;
  _routeDrawColor = color || '#3fb950';
  _routeDrawPts   = [];
  drawMode = 'routedraw';
  map.doubleClickZoom.disable();
  map.getContainer().style.cursor = 'crosshair';
  _setDrawBanner('ROUTE DRAW  ·  click to add waypoints  ·  right-click / dbl-click to finish  ·  ESC cancels');
  map.on('click',       _rdClick);
  map.on('mousemove',   _rdMove);
  map.on('dblclick',    _rdFinish);
  map.on('contextmenu', _rdFinishCtx);
}

function cancelRouteDrawing() {
  if (!_routeDrawId && drawMode !== 'routedraw') return;
  map.off('click',       _rdClick);
  map.off('mousemove',   _rdMove);
  map.off('dblclick',    _rdFinish);
  map.off('contextmenu', _rdFinishCtx);
  _routeDrawMks.forEach(l => map.removeLayer(l));
  _routeDrawMks = [];
  if (_routeDrawLine) { map.removeLayer(_routeDrawLine); _routeDrawLine = null; }
  const id = _routeDrawId;
  _routeDrawPts  = [];
  _routeDrawId   = null;
  drawMode = 'pointer';
  map.doubleClickZoom.enable();
  map.getContainer().style.cursor = '';
  _setDrawBanner('');
  if (id && bridge) bridge.onRouteDrawCancelled(id);
}

function _rdClick(e) {
  const n = _routeDrawPts.length + 1;
  _routeDrawPts.push({lat:e.latlng.lat, lon:e.latlng.lng});
  const type = n === 1 ? 'START' : 'WP';
  const mk = L.marker(e.latlng, {
    icon: _routeWpIcon(type, n, _routeDrawColor),
    zIndexOffset: 800, interactive: false
  }).addTo(map);
  _routeDrawMks.push(mk);
  _rdUpdatePreview(e.latlng);
}

function _rdMove(e) {
  if (_routeDrawPts.length === 0) return;
  _rdUpdatePreview(e.latlng);
}

function _rdUpdatePreview(cursorLL) {
  const pts = [..._routeDrawPts.map(p=>[p.lat,p.lon]),[cursorLL.lat,cursorLL.lng]];
  if (_routeDrawLine) { map.removeLayer(_routeDrawLine); _routeDrawLine = null; }
  if (pts.length >= 2)
    _routeDrawLine = L.polyline(pts, {
      color:_routeDrawColor, weight:2.5, dashArray:'8,5', opacity:.8
    }).addTo(map);
}

function _rdFinishCtx(e) {
  e.originalEvent.preventDefault();
  e.originalEvent.stopPropagation();
  _rdFinish();
}

function _rdFinish() {
  if (_routeDrawPts.length < 2) { cancelRouteDrawing(); return; }
  const wps = _routeDrawPts.map((p,i) => ({
    lat:p.lat, lon:p.lon,
    type: i === 0 ? 'START' : i === _routeDrawPts.length-1 ? 'END' : 'WP',
    label:'', notes:''
  }));
  const id = _routeDrawId;
  // Clean up draw state (without emitting cancel)
  map.off('click',       _rdClick);
  map.off('mousemove',   _rdMove);
  map.off('dblclick',    _rdFinish);
  map.off('contextmenu', _rdFinishCtx);
  _routeDrawMks.forEach(l => map.removeLayer(l));
  _routeDrawMks = [];
  if (_routeDrawLine) { map.removeLayer(_routeDrawLine); _routeDrawLine = null; }
  _routeDrawPts = [];
  _routeDrawId  = null;
  drawMode = 'pointer';
  map.doubleClickZoom.enable();
  map.getContainer().style.cursor = '';
  _setDrawBanner('');
  if (bridge) bridge.onRouteDrawn(id, JSON.stringify(wps));
}

// ── Route render / remove ─────────────────────────────────────────────────────

function addRoute(route) {
  removeRoute(route.id);
  if (route.visible === false) return;
  const color = route.color || '#3fb950';
  const wps   = route.waypoints || [];
  if (wps.length < 1) return;

  const grp = {line:null, markers:[], labels:[]};
  const speed = route.speed_kmh || 30;

  // Cumulative distances
  const cumDists = [0];
  for (let i = 1; i < wps.length; i++)
    cumDists.push(cumDists[i-1] + _haversineM(wps[i-1], wps[i]));

  // Route line
  if (wps.length >= 2) {
    grp.line = L.polyline(wps.map(w=>[w.lat,w.lon]), {
      color, weight:3, dashArray:'10,6', opacity:.9, lineCap:'round', lineJoin:'round'
    }).addTo(LAYERS.routes);
  }

  // Waypoint markers
  wps.forEach((wp, i) => {
    const etaMin = cumDists[i] / 1000 / speed * 60;
    const mk = L.marker([wp.lat, wp.lon], {
      icon: _routeWpIcon(wp.type||'WP', i+1, color), zIndexOffset: 700
    })
    .bindPopup(_routeWpPopup(wp, route.name, i+1, cumDists[i], etaMin), {maxWidth:250})
    .addTo(LAYERS.routes);
    grp.markers.push(mk);
  });

  // Leg labels (mid-point: segment distance + cumulative ETA at end)
  for (let i = 1; i < wps.length; i++) {
    const seg    = _haversineM(wps[i-1], wps[i]);
    const etaEnd = cumDists[i] / 1000 / speed * 60;
    const midLat = (wps[i-1].lat + wps[i].lat) / 2;
    const midLon = (wps[i-1].lon + wps[i].lon) / 2;
    const lbl = L.marker([midLat, midLon], {
      interactive: false,
      icon: L.divIcon({
        className: '',
        html: `<div style="background:rgba(0,0,0,.78);border:1px solid ${color};color:${color};font-family:'Courier New',monospace;font-size:8px;font-weight:700;padding:1px 5px;border-radius:2px;white-space:nowrap;transform:translate(-50%,-100%)">${_fmtRouteDist(seg)} · H+${_fmtRouteEta(etaEnd)}</div>`,
        iconSize:[0,0]
      })
    }).addTo(LAYERS.routes);
    grp.labels.push(lbl);
  }

  // Route name label at first waypoint
  const nameLbl = L.marker([wps[0].lat, wps[0].lon], {
    interactive: false,
    icon: L.divIcon({
      className: '',
      html: `<div style="background:rgba(0,0,0,.84);border:1px solid ${color};color:${color};font-family:'Courier New',monospace;font-size:9px;font-weight:700;padding:1px 7px;border-radius:2px;white-space:nowrap;transform:translate(-50%,18px);letter-spacing:.5px">${esc(route.name||'Route')}</div>`,
      iconSize:[0,0]
    })
  }).addTo(LAYERS.routes);
  grp.labels.push(nameLbl);

  _routeLayers[route.id] = grp;
}

function removeRoute(id) {
  const g = _routeLayers[id];
  if (!g) return;
  if (g.line) LAYERS.routes.removeLayer(g.line);
  g.markers.forEach(m => LAYERS.routes.removeLayer(m));
  g.labels.forEach(l => LAYERS.routes.removeLayer(l));
  delete _routeLayers[id];
}

function setRouteVisible(id, visible) {
  const g = _routeLayers[id];
  if (!g) return;
  const op = visible ? 1 : 0;
  if (g.line) g.line.setStyle({opacity: op * 0.9});
  g.markers.forEach(m => m.setOpacity(op));
  g.labels.forEach(l => l.setOpacity(op));
}

function centerOnRoute(id) {
  const g = _routeLayers[id];
  if (!g || !g.line) return;
  const lls = g.line.getLatLngs();
  if (lls.length) map.fitBounds(L.latLngBounds(lls).pad(0.15));
}

// ================================================================
// NAVIGATION
// Follows a route with GPS tracking. All state is JS-only; Python is
// notified of waypoint-reached and route-complete events via bridge.
// No CSS transitions — see compositor-constraint note at top of file.
// ================================================================

let _navState    = 'idle';   // 'idle' | 'navigating' | 'paused'
let _navRoute    = null;     // full route dict currently being navigated
let _navWpIdx    = 0;        // index of next target waypoint
let _navWatchId  = null;     // navigator.geolocation watchPosition ID
let _navLastLat  = null;
let _navLastLon  = null;
let _navPosLyr   = null;     // blue GPS dot
let _navLineLyr  = null;     // solid highlight of route line

const _NAV_ARRIVAL_M = 50;   // metres within which a WP is considered reached

// WP type → badge background colour
const _NAV_WP_BG = {
  START:'#3fb950', END:'#f85149', IP:'#ff9e64', RV:'#d2a8ff',
  CP:'#79c0ff',   RP:'#d29922',  HOLD:'#8b949e', WP:'#e6edf3'
};

function startNavigation(route) {
  stopNavigation();
  if (!route || !route.waypoints || route.waypoints.length < 1) return;
  _navRoute = route;
  _navWpIdx = 0;
  _navState = 'navigating';

  // Solid route highlight (rendered above the dashed route layer)
  const pts = route.waypoints.map(w => [w.lat, w.lon]);
  if (pts.length >= 2) {
    _navLineLyr = L.polyline(pts, {
      color: route.color || '#79c0ff', weight: 5, opacity: 0.85,
      lineCap: 'round', lineJoin: 'round'
    }).addTo(map);
    map.fitBounds(_navLineLyr.getBounds(), {padding:[60,60]});
  }

  _navUpdateHud();
  document.getElementById('nav-hud').classList.add('active');
  document.getElementById('nav-pause-btn').textContent = '⏸ PAUSE';

  if (navigator.geolocation) {
    _navWatchId = navigator.geolocation.watchPosition(
      _navOnGps,
      function(e){ console.warn('[NAV] GPS error:', e.message); },
      {enableHighAccuracy:true, maximumAge:2000, timeout:15000}
    );
  }
}

function stopNavigation() {
  if (_navWatchId !== null) {
    navigator.geolocation.clearWatch(_navWatchId);
    _navWatchId = null;
  }
  if (_navPosLyr)  { map.removeLayer(_navPosLyr);  _navPosLyr  = null; }
  if (_navLineLyr) { map.removeLayer(_navLineLyr); _navLineLyr = null; }
  _navState   = 'idle';
  _navRoute   = null;
  _navWpIdx   = 0;
  _navLastLat = null;
  _navLastLon = null;
  document.getElementById('nav-hud').classList.remove('active');
  if (bridge) bridge.onNavStopped();
}

function pauseNavigation() {
  if (_navState !== 'navigating') return;
  _navState = 'paused';
  document.getElementById('nav-pause-btn').textContent = '▶ RESUME';
}

function resumeNavigation() {
  if (_navState !== 'paused') return;
  _navState = 'navigating';
  document.getElementById('nav-pause-btn').textContent = '⏸ PAUSE';
}

function _navTogglePause() {
  if (_navState === 'paused')     resumeNavigation();
  else if (_navState === 'navigating') pauseNavigation();
}

function _navGoHome() {
  if (!_navRoute) return;
  _navWpIdx = 0;
  _navUpdateHud(_navLastLat, _navLastLon, null, null);
  // Pan to first waypoint so user can see where home is
  const wp0 = _navRoute.waypoints[0];
  if (wp0 && _navLastLat === null) map.panTo([wp0.lat, wp0.lon]);
}

function _navOnGps(pos) {
  const lat = pos.coords.latitude;
  const lon = pos.coords.longitude;
  const hdg = pos.coords.heading;    // degrees true north; null when stationary
  const spd = pos.coords.speed;      // m/s; null if unavailable
  _navLastLat = lat;
  _navLastLon = lon;

  // Update / create GPS position dot
  if (!_navPosLyr) {
    _navPosLyr = L.circleMarker([lat, lon], {
      radius:9, color:'#fff', weight:2, fillColor:'#388bfd', fillOpacity:1
    }).addTo(map);
  } else {
    _navPosLyr.setLatLng([lat, lon]);
  }

  if (_navState !== 'navigating' || !_navRoute) return;

  const wps = _navRoute.waypoints;
  if (_navWpIdx < wps.length) {
    const wp = wps[_navWpIdx];
    const d  = _haversineM({lat, lon}, {lat:wp.lat, lon:wp.lon});
    if (d < _NAV_ARRIVAL_M && _navWpIdx < wps.length - 1) {
      const arrived = _navWpIdx;
      _navWpIdx++;
      if (bridge) bridge.onNavWaypointReached(_navRoute.id, arrived);
    }
  }
  if (_navWpIdx >= wps.length) {
    _navCompleteRoute();
    return;
  }

  map.panTo([lat, lon]);
  _navUpdateHud(lat, lon, hdg, spd);
}

function _navBearing(fromLat, fromLon, toLat, toLon) {
  const dlon = (toLon - fromLon) * Math.PI / 180;
  const la1  = fromLat * Math.PI / 180;
  const la2  = toLat   * Math.PI / 180;
  const y = Math.sin(dlon) * Math.cos(la2);
  const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dlon);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

function _navUpdateHud(lat, lon, hdg, spd) {
  if (!_navRoute) return;
  const wps = _navRoute.waypoints;
  if (_navWpIdx >= wps.length) return;
  const wp = wps[_navWpIdx];

  // ── Direction arrow + bearing text ─────────────────────────────────
  let bearing = null;
  let turnHint = '';
  if (lat !== null && lat !== undefined) {
    bearing = _navBearing(lat, lon, wp.lat, wp.lon);
    if (hdg !== null && hdg !== undefined) {
      let rel = ((bearing - hdg) + 360) % 360;
      if (rel > 180) rel -= 360;           // −180..+180 (negative = left)
      if (Math.abs(rel) < 12) turnHint = '↑ STRAIGHT AHEAD';
      else if (rel > 0)       turnHint = `↱ TURN RIGHT ${rel.toFixed(0)}°`;
      else                    turnHint = `↰ TURN LEFT ${Math.abs(rel).toFixed(0)}°`;
    } else {
      turnHint = `BRG ${bearing.toFixed(0)}° (T)`;
    }
  }

  const svg = document.getElementById('nav-arrow-svg');
  if (svg) svg.style.transform = bearing !== null ? `rotate(${bearing.toFixed(0)}deg)` : 'rotate(0deg)';

  document.getElementById('nav-bearing-deg').textContent =
    bearing !== null ? `${bearing.toFixed(0)}°` : '---°';
  document.getElementById('nav-turn-hint').textContent = turnHint;

  // ── WP badge ────────────────────────────────────────────────────────
  const wpType = wp.type || 'WP';
  const badge  = document.getElementById('nav-wp-badge');
  badge.textContent  = wpType;
  badge.style.background = _NAV_WP_BG[wpType] || '#e6edf3';
  badge.style.color  = '#0d1117';

  // ── WP label & stats ────────────────────────────────────────────────
  document.getElementById('nav-wp-label').textContent =
    wp.label || wp.type || `Waypoint ${_navWpIdx + 1}`;

  let statsText = '';
  if (lat !== null && lat !== undefined) {
    const distToWp = _haversineM({lat, lon}, {lat:wp.lat, lon:wp.lon});
    let remDist = distToWp;
    for (let i = _navWpIdx; i < wps.length - 1; i++)
      remDist += _haversineM({lat:wps[i].lat,lon:wps[i].lon},{lat:wps[i+1].lat,lon:wps[i+1].lon});
    const spdMs = (spd && spd > 0.5) ? spd : (_navRoute.speed_kmh || 30) / 3.6;
    const etaTot = remDist / spdMs;
    statsText = `${_fmtRouteDist(distToWp)} to ${wpType}  ·  ${_fmtRouteDist(remDist)} left  ·  ETA ${_fmtRouteEta(etaTot / 60)}`;
  } else {
    let remDist = 0;
    for (let i = _navWpIdx; i < wps.length - 1; i++)
      remDist += _haversineM({lat:wps[i].lat,lon:wps[i].lon},{lat:wps[i+1].lat,lon:wps[i+1].lon});
    statsText = `${_fmtRouteDist(remDist)} remaining  ·  acquiring GPS…`;
  }
  document.getElementById('nav-wp-stats').textContent = statsText;

  // ── Progress bar ────────────────────────────────────────────────────
  let totalDist = 0, coveredDist = 0;
  for (let i = 0; i < wps.length - 1; i++) {
    const leg = _haversineM({lat:wps[i].lat,lon:wps[i].lon},{lat:wps[i+1].lat,lon:wps[i+1].lon});
    totalDist += leg;
    if (i < _navWpIdx) coveredDist += leg;
  }
  const pct = totalDist > 0 ? (coveredDist / totalDist * 100) : 0;
  document.getElementById('nav-progress-fill').style.width = `${Math.min(100, pct).toFixed(1)}%`;
  document.getElementById('nav-progress-text').textContent =
    `WP ${_navWpIdx + 1} / ${wps.length}`;
}

function _navCompleteRoute() {
  const id = _navRoute ? _navRoute.id : '';
  document.getElementById('nav-wp-label').textContent   = '✓ ROUTE COMPLETE';
  document.getElementById('nav-wp-stats').textContent   = 'Destination reached';
  document.getElementById('nav-progress-fill').style.width = '100%';
  document.getElementById('nav-progress-text').textContent = 'DONE';
  document.getElementById('nav-bearing-deg').textContent  = '---°';
  document.getElementById('nav-turn-hint').textContent    = '';
  const badge = document.getElementById('nav-wp-badge');
  badge.textContent = 'END'; badge.style.background = '#f85149';
  const svg = document.getElementById('nav-arrow-svg');
  if (svg) { svg.querySelector('polygon').setAttribute('fill','#3fb950'); svg.style.transform='rotate(0deg)'; }
  _navState = 'idle';
  if (bridge) bridge.onNavCompleted(id);
}

// ================================================================
// APP-6 / MIL-STD-2525C TACTICAL GRAPHICS RENDERER
// Renders proper control-measure geometry (arrows, scallops, hatching,
// FSCM bracket labels, echelon boundaries) — milsymbol does NOT do these.
// ================================================================

// ── Canonical tactical-graphic type spec ─────────────────────────────────
// affByAff:true → colour from AFFILIATION (blue/red/yellow);
// otherwise a fixed standard colour is used (FSCMs, FLOT/FLET).
const TG = {
  // Offensive manoeuvre
  ATK_AXIS:      {kind:'mainattack', w:4,   affByAff:true},  // line + solid filled arrowhead
  AXIS:          {kind:'arrow',      w:3.5, affByAff:true},  // line + open V arrowhead
  COUNTERATTACK: {kind:'arrow',      w:3,   dash:'12,5', affByAff:true}, // dashed + open V
  BYPASS:        {kind:'arrow',      w:3,                affByAff:true},
  WITHDRAW:      {kind:'arrow',      w:3,   dash:'5,5',  affByAff:true},
  // Defensive
  DEF_AREA:      {kind:'defense',    w:3,   affByAff:true},  // line + perpendicular ticks
  BLOCK:         {kind:'block',      w:3,   affByAff:true},  // line + T-bar at end
  AMBUSH:        {kind:'ambush',     w:3,   affByAff:true},  // horseshoe arc
  // Areas / zones
  OBJ_AREA:      {kind:'area',       w:2,   tag:'OBJ',  affByAff:true},
  OBJECTIVE:     {kind:'area',       w:2,   tag:'OBJ',  affByAff:true},
  BOUNDARY:      {kind:'boundary',   w:2,   affByAff:true},
  PHASE_LINE:    {kind:'linelabel',  w:3,   tag:'PL',   affByAff:true},
  ROUTE:         {kind:'linelabel',  w:2,   tag:'RTE',  dash:'10,5', affByAff:true},
  // Forward lines — fixed standard colours
  FLOT:          {kind:'scallop',   color:'#00cc55', w:2.5, label:'FLOT'},
  FLET:          {kind:'scallop',   color:'#f85149', w:2.5, label:'FLET'},
  // Fire-support coordination measures — fixed colours
  FSCL:          {kind:'fscm',      color:'#ff8800', w:3,   tag:'FSCL'},
  CFL:           {kind:'fscm',      color:'#ff4400', w:2.5, tag:'CFL'},
  NFL:           {kind:'fscm',      color:'#ff0000', w:2.5, tag:'NFL'},
  NFA:           {kind:'hatch',     color:'#ff0000', w:2,   tag:'NFA'},
  FFA:           {kind:'area',      color:'#00cc00', w:2,   tag:'FFA'},
  ENGAGEMENT_AREA:{kind:'area',     color:'#ff3300', w:2,   tag:'EA'},
  ASSEMBLY_AREA: {kind:'area',      color:'#44aaff', w:2,   tag:'AA'},
  ZONE:          {kind:'area',      color:'#d29922', w:2,   tag:''},
  // Intel
  NAI:           {kind:'areadash',  color:'#aa44ff', w:2,   tag:'NAI'},
  TAI:           {kind:'areadash',  color:'#ff44aa', w:2,   tag:'TAI'},
};

// affiliation → colour per APP-6 colour standard
function _affColor(aff){
  const a=(aff||'FRIENDLY').toUpperCase();
  return a==='HOSTILE'||a==='ENEMY' ? '#f85149'
       : a==='NEUTRAL'             ? '#3fb950'
       : a==='UNKNOWN'             ? '#d29922' : '#00aaff';
}

// ── geometry helpers ──────────────────────────────────────────────────────
function _distLL(a,b){
  const R=6371000,dLat=(b.lat-a.lat)*Math.PI/180,dLon=(b.lng-a.lng)*Math.PI/180;
  const la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function _polyLen(pts){let d=0;for(let i=1;i<pts.length;i++)d+=_distLL(pts[i-1],pts[i]);return d;}

// Point + bearing at distance d along a polyline
function _ptAtDist(pts,d){
  let acc=0;
  for(let i=0;i<pts.length-1;i++){
    const s=_distLL(pts[i],pts[i+1]);
    if(acc+s>=d){
      const t=(d-acc)/s;
      return {
        pt:  L.latLng(pts[i].lat+t*(pts[i+1].lat-pts[i].lat),
                      pts[i].lng+t*(pts[i+1].lng-pts[i].lng)),
        brg: _bearing(pts[i],pts[i+1])
      };
    }
    acc+=s;
  }
  const n=pts.length-1;
  return {pt:pts[n], brg:_bearing(pts[Math.max(0,n-1)],pts[n])};
}

// Boxed text label as a divIcon marker
function _tgLabel(latlng,text,color){
  return L.marker(latlng,{interactive:false,icon:L.divIcon({
    className:'',
    html:`<div style="background:rgba(0,0,0,.82);border:1px solid ${color};color:${color};
          font-family:'Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:1px;
          padding:1px 6px;border-radius:2px;white-space:nowrap;transform:translate(-50%,-50%)">${text}</div>`,
    iconSize:[0,0]
  })});
}

// Scalloped line — semicircle bumps toward the RIGHT of travel (toward enemy for FLOT)
function _scallopPts(pts,radiusM){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    const segLen=_distLL(a,b);
    const n=Math.max(1,Math.round(segLen/(radiusM*2)));
    const brg=_bearing(a,b);
    for(let k=0;k<n;k++){
      const t0=k/n,t1=(k+1)/n;
      const s=[a.lat+(b.lat-a.lat)*t0, a.lng+(b.lng-a.lng)*t0];
      const e=[a.lat+(b.lat-a.lat)*t1, a.lng+(b.lng-a.lng)*t1];
      out.push(s);
      const midLat=(s[0]+e[0])/2, midLng=(s[1]+e[1])/2;
      // bump to the right (+90° = enemy side)
      const c=destPoint(midLat,midLng,brg+90,radiusM);
      for(let a2=0;a2<=180;a2+=20){
        const ang=brg+90+(180-a2);
        const p=destPoint(c[0],c[1],ang,radiusM);
        out.push([p[0],p[1]]);
      }
    }
  }
  out.push([pts[pts.length-1].lat,pts[pts.length-1].lng]);
  return out;
}

// ── Main renderer ─────────────────────────────────────────────────────────
// Build a tactical graphic from a list of L.LatLng. Returns L.layerGroup.
function buildTacticalGraphic(type,pts,label,aff){
  const spec = TG[type] || {kind:'line', color:'#e6edf3', w:2};
  const grp  = L.layerGroup();
  const C    = spec.affByAff ? _affColor(aff) : (spec.color||_affColor(aff));
  const W    = spec.w || 2;
  const len  = _polyLen(pts);
  // Arrow head ground-size: 15 % of line length, clamped to [200 m, 3 000 m]
  const head = Math.min(Math.max(len*0.15, 200), 3000);
  const isArea = ['area','areadash','hatch'].includes(spec.kind);

  // ── ATK_AXIS: line + large solid filled arrowhead ────────────────────
  // Shaft stops at the arrowhead base so the line doesn't poke through the tip.
  if(spec.kind==='mainattack'){
    if(pts.length<2){L.polyline(pts,{color:C,weight:W}).addTo(grp);return grp;}
    const tip=pts[pts.length-1], prev=pts[pts.length-2];
    const brg=_bearing(prev,tip);
    const ha=28, haR=ha*Math.PI/180;
    const bL=destPoint(tip.lat,tip.lng,(brg+180+ha+360)%360, head);
    const bR=destPoint(tip.lat,tip.lng,(brg+180-ha+360)%360, head);
    const base=destPoint(tip.lat,tip.lng,(brg+180)%360, head*Math.cos(haR));
    const shaft=[...pts.slice(0,pts.length-1), L.latLng(base[0],base[1])];
    L.polyline(shaft,{color:C,weight:W,lineCap:'round',lineJoin:'round'}).addTo(grp);
    L.polygon([[bL[0],bL[1]],[tip.lat,tip.lng],[bR[0],bR[1]]],
      {color:C,weight:1,fillColor:C,fillOpacity:1}).addTo(grp);
  }

  // ── Arrow: line + open V arrowhead (AXIS, COUNTERATTACK, BYPASS, WITHDRAW)
  else if(spec.kind==='arrow'){
    if(pts.length<2){L.polyline(pts,{color:C,weight:W}).addTo(grp);return grp;}
    const tip=pts[pts.length-1], prev=pts[pts.length-2];
    const brg=_bearing(prev,tip);
    const bL=destPoint(tip.lat,tip.lng,(brg+148+360)%360, head*0.85);
    const bR=destPoint(tip.lat,tip.lng,(brg-148+360)%360, head*0.85);
    L.polyline(pts,{color:C,weight:W,dashArray:spec.dash,lineCap:'round',lineJoin:'round'}).addTo(grp);
    L.polyline([[bL[0],bL[1]],[tip.lat,tip.lng],[bR[0],bR[1]]],
      {color:C,weight:W,lineJoin:'round'}).addTo(grp);
  }

  // ── Defense line — line + perpendicular ticks on right (enemy side) ──
  else if(spec.kind==='defense'){
    L.polyline(pts,{color:C,weight:W,lineCap:'round'}).addTo(grp);
    const nTicks = Math.max(4, Math.min(20, Math.round(len/400)));
    const spacing = len / (nTicks+1);
    const tLen    = spacing * 0.55;
    for(let k=1;k<=nTicks;k++){
      const {pt,brg} = _ptAtDist(pts, k*spacing);
      const e = destPoint(pt.lat,pt.lng,(brg+90+360)%360, tLen);
      L.polyline([[pt.lat,pt.lng],[e[0],e[1]]],{color:C,weight:W-1||1}).addTo(grp);
    }
  }

  // ── Scallop (FLOT / FLET) ────────────────────────────────────────────
  else if(spec.kind==='scallop'){
    L.polyline(_scallopPts(pts,head*0.35),{color:C,weight:W}).addTo(grp);
    if(spec.label){
      grp.addLayer(_tgLabel(pts[0],spec.label,C));
      grp.addLayer(_tgLabel(pts[pts.length-1],spec.label,C));
    }
  }

  // ── FSCM / Phase-line type (labelled at both ends) ───────────────────
  else if(spec.kind==='linelabel'||spec.kind==='fscm'){
    L.polyline(pts,{color:C,weight:W,dashArray:spec.dash}).addTo(grp);
    const name=(label||'').replace(/_/g,' ');
    const txt=spec.tag+(name&&name!==type?' '+name:'');
    grp.addLayer(_tgLabel(pts[0],txt,C));
    grp.addLayer(_tgLabel(pts[pts.length-1],txt,C));
  }

  // ── Boundary line ────────────────────────────────────────────────────
  else if(spec.kind==='boundary'){
    L.polyline(pts,{color:C,weight:W,dashArray:'6,4'}).addTo(grp);
    // X marks at start, mid, end
    [pts[0], pts[Math.floor(pts.length/2)], pts[pts.length-1]].forEach(p=>{
      grp.addLayer(_tgLabel(p,'✕',C));
    });
    if(label) grp.addLayer(_tgLabel(pts[0],label,C));
  }

  // ── Block (T-bar at end) ─────────────────────────────────────────────
  else if(spec.kind==='block'){
    L.polyline(pts,{color:C,weight:W}).addTo(grp);
    if(pts.length>=2){
      const b=_bearing(pts[pts.length-2],pts[pts.length-1]);
      const t=pts[pts.length-1];
      const a1=destPoint(t.lat,t.lng,(b+90+360)%360,head*0.55);
      const a2=destPoint(t.lat,t.lng,(b-90+360)%360,head*0.55);
      L.polyline([[a1[0],a1[1]],[a2[0],a2[1]]],{color:C,weight:W+1}).addTo(grp);
    }
  }

  // ── Ambush — horseshoe arc opening toward the kill zone ──────────────
  // The path endpoint IS the ambush position; the arc opens perpendicular
  // to the approach so the "jaws" face the direction enemies travel through.
  else if(spec.kind==='ambush'){
    L.polyline(pts,{color:C,weight:W}).addTo(grp);
    if(pts.length>=2){
      const tip=pts[pts.length-1];
      const b=_bearing(pts[pts.length-2],tip);
      // Arc: semicircle perpendicular to shaft, opening to the right
      const arcPts=[];
      for(let a=-90;a<=90;a+=15){
        const p=destPoint(tip.lat,tip.lng,(b+a+360)%360, head*0.8);
        arcPts.push([p[0],p[1]]);
      }
      L.polyline(arcPts,{color:C,weight:W}).addTo(grp);
    }
  }

  // ── Area types (polygon, hatched, dashed) ────────────────────────────
  else if(isArea){
    const dash    = spec.kind==='areadash' ? '7,5' : null;
    const fillOp  = spec.kind==='hatch'   ? 0     : 0.07;
    L.polygon(pts,{color:C,weight:W,dashArray:dash,fill:true,fillColor:C,fillOpacity:fillOp}).addTo(grp);
    if(spec.kind==='hatch') _addHatch(grp,pts,C);
    const c=_centroid(pts);
    const name=(label||'').replace(/_/g,' ');
    const txt=(spec.tag||'')+(name&&name!==type?' '+name:'');
    if(txt.trim()) grp.addLayer(_tgLabel(L.latLng(c[0],c[1]),txt,C));
  }

  // ── Fallback: plain line ─────────────────────────────────────────────
  else {
    L.polyline(pts,{color:C,weight:W,dashArray:spec.dash}).addTo(grp);
    if(label) grp.addLayer(_tgLabel(pts[Math.floor(pts.length/2)],label.replace(/_/g,' '),C));
  }
  return grp;
}

function _centroid(pts){
  let lat=0,lng=0;pts.forEach(p=>{lat+=p.lat;lng+=p.lng;});
  return [lat/pts.length, lng/pts.length];
}

// diagonal hatch fill for NFA
function _addHatch(grp, pts, color){
  let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
  pts.forEach(p=>{minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);
                   minLng=Math.min(minLng,p.lng);maxLng=Math.max(maxLng,p.lng);});
  const step=(maxLat-minLat)/8 || 0.001;
  for(let off=-(maxLng-minLng); off<(maxLng-minLng); off+=step*1.4){
    const l=L.polyline([[minLat,minLng+off],[maxLat,minLng+off+(maxLng-minLng)]],
      {color:color,weight:1,opacity:.5});
    // clip visually by bounding (simple — full diagonal lines across bbox)
    l.addTo(grp);
  }
}

function addGraphic(g){
  if(!g||!g.geojson) return;
  let geo=typeof g.geojson==='string'?JSON.parse(g.geojson):g.geojson;
  if(geo.type==='Feature'){addGraphic({...g,geojson:geo.geometry});return;}
  if(geo.type==='FeatureCollection'){geo.features.forEach(f=>addGraphic({...g,id:g.id+'_'+Math.random(),geojson:f}));return;}

  // Normalise geometry → array of L.latLng + isArea flag
  let pts=null, isArea=false;
  if(geo.type==='line'||geo.type==='LineString'){
    const cc = geo.coords || (geo.coordinates ? geo.coordinates.map(c=>[c[1],c[0]]) : null);
    if(cc) pts=cc.map(c=>L.latLng(c[0],c[1]));
  } else if(geo.type==='polygon'||geo.type==='Polygon'){
    isArea=true;
    let ring = geo.coords || (geo.coordinates ? geo.coordinates[0].map(c=>[c[1],c[0]]) : null);
    if(ring) pts=ring.map(c=>L.latLng(c[0],c[1]));
  } else if(geo.type==='Point'){
    const c=geo.coordinates; const lyr=L.circleMarker([c[1],c[0]],{radius:7,color:'#e6edf3',fillColor:'#e6edf3',fillOpacity:.7}).addTo(LAYERS.graphics);
    if(graphics['gfx_'+g.id]) LAYERS.graphics.removeLayer(graphics['gfx_'+g.id]);
    graphics['gfx_'+g.id]=lyr; return;
  }
  if(!pts||pts.length<2) return;

  const grp=buildTacticalGraphic(g.type, pts, g.label, g.affiliation);
  grp.addTo(LAYERS.graphics);
  if(graphics['gfx_'+g.id]) LAYERS.graphics.removeLayer(graphics['gfx_'+g.id]);
  graphics['gfx_'+g.id]=grp;
}
function removeGraphic(id){if(graphics['gfx_'+id]){LAYERS.graphics.removeLayer(graphics['gfx_'+id]);delete graphics['gfx_'+id];}}
