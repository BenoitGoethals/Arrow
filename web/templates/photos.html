{% extends "base.html" %}
{% block title %}Photos — Arrow{% endblock %}

{% block head %}
<style>
.ph-shell  { padding: 1.25rem; max-width: 1400px; margin: 0 auto; }
.ph-head   { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1rem; }
.ph-head h1 { margin: 0; color: #6ee7b7; font-size: 1.15rem; }
.ph-head small { color: #64748b; }
.ph-grid   { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.6rem; }
.ph-card   {
    background: #161b25; border: 1px solid #2a3142; border-radius: 6px;
    overflow: hidden; transition: border-color .15s; position: relative;
}
.ph-card:hover { border-color: #6ee7b7; }
.ph-card img {
    width: 100%; height: 140px; object-fit: cover; display: block;
    background: #0d1117; cursor: pointer;
}
.ph-meta   { padding: 0.45rem 0.55rem; font-size: 0.72rem; color: #94a3b8; }
.ph-meta .ts { color: #cbd5e1; font-family: monospace; }
.ph-meta .ref a { color: #6ee7b7; text-decoration: none; }
.ph-meta .ref a:hover { text-decoration: underline; }
.ph-actions { display: flex; gap: 0.3rem; padding: 0 0.55rem 0.55rem; }
.ph-btn {
    flex: 1; background: #1f2937; color: #cbd5e1; border: 1px solid #2a3142;
    border-radius: 4px; padding: 0.25rem 0.4rem; font: inherit; font-size: 0.72rem;
    cursor: pointer; text-align: center; text-decoration: none;
}
.ph-btn:hover { border-color: #6ee7b7; color: #6ee7b7; }
.ph-btn-del:hover { border-color: #ef4444; color: #ef4444; }
.ph-empty { color: #475569; padding: 3rem; text-align: center; grid-column: 1 / -1; }

/* Lightbox */
.ph-light-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.92);
    z-index: 9000; align-items: center; justify-content: center;
}
.ph-light-bg.open { display: flex; }
.ph-light-img { max-width: 95vw; max-height: 92vh; border-radius: 4px; }
.ph-light-close {
    position: absolute; top: 1rem; right: 1rem; background: #1f2937; color: #cbd5e1;
    border: 1px solid #475569; border-radius: 4px; padding: 0.4rem 0.8rem;
    font: inherit; cursor: pointer;
}
</style>
{% endblock %}

{% block content %}
<div class="ph-shell">
    <div class="ph-head">
        <h1>📷 Photos</h1>
        <small id="ph-count">—</small>
    </div>
    <div id="ph-grid" class="ph-grid">
        <div class="ph-empty">Loading…</div>
    </div>
</div>

<div class="ph-light-bg" id="ph-light" onclick="if(event.target===this)phClose()">
    <button class="ph-light-close" onclick="phClose()">✕ Close</button>
    <img class="ph-light-img" id="ph-light-img" alt="Full size"/>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    const token = localStorage.getItem('arrow_token');
    if (!token) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
    const headers = { Authorization: 'Bearer ' + token };
    const api = (p) => fetch(window.ARROW_BACKEND_URL + p, { headers });

    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function load() {
        const r = await api('/photos');
        const list = r.ok ? await r.json() : [];
        document.getElementById('ph-count').textContent =
            `${list.length} photo${list.length === 1 ? '' : 's'}`;
        const grid = document.getElementById('ph-grid');
        if (list.length === 0) {
            grid.innerHTML = '<div class="ph-empty">No photos yet — operators can attach photos to messages, reports, objectives or enemy markers.</div>';
            return;
        }
        grid.innerHTML = list.map(p => {
            const ts = p.timestamp ? new Date(p.timestamp).toLocaleString() : '—';
            const refs = [];
            if (p.message_id)         refs.push(`<a href="/messaging/?open=msg:${p.message_id}">💬 msg #${p.message_id}</a>`);
            if (p.tactical_object_id) refs.push(`<a href="/map/">📍 obj #${p.tactical_object_id}</a>`);
            if (p.report_id)          refs.push(`<a href="/reports/?id=${p.report_id}">📋 report #${p.report_id}</a>`);
            return `
            <div class="ph-card">
                <img data-pid="${p.id}" alt="photo" onclick="phOpen(${p.id})">
                <div class="ph-meta">
                    <div class="ts">${esc(ts)}</div>
                    <div>${esc(p.original_name || p.filename)}</div>
                    <div class="ref">${refs.join(' · ') || '<span style="color:#475569">orphan</span>'}</div>
                </div>
                <div class="ph-actions">
                    <button class="ph-btn" onclick="phOpen(${p.id})">View</button>
                    <a class="ph-btn" href="#" onclick="phSave(event, ${p.id}, '${esc(p.original_name || p.filename)}')">Save</a>
                    <button class="ph-btn ph-btn-del" onclick="phDelete(${p.id}, this)">Delete</button>
                </div>
            </div>`;
        }).join('');

        // Auth-load thumbnails
        grid.querySelectorAll('img[data-pid]').forEach(async (img) => {
            const id = img.dataset.pid;
            try {
                const r2 = await api(`/photos/${id}`);
                if (!r2.ok) return;
                const blob = await r2.blob();
                img.src = URL.createObjectURL(blob);
            } catch (_) {}
        });
    }

    let _phUrl = null;
    window.phOpen = async function(id) {
        const r = await api(`/photos/${id}`);
        if (!r.ok) { alert('Failed to open photo: ' + r.status); return; }
        const blob = await r.blob();
        if (_phUrl) URL.revokeObjectURL(_phUrl);
        _phUrl = URL.createObjectURL(blob);
        document.getElementById('ph-light-img').src = _phUrl;
        document.getElementById('ph-light').classList.add('open');
    };

    window.phClose = function() {
        document.getElementById('ph-light').classList.remove('open');
        if (_phUrl) { URL.revokeObjectURL(_phUrl); _phUrl = null; }
    };

    window.phSave = async function(ev, id, fname) {
        ev.preventDefault();
        const r = await api(`/photos/${id}`);
        if (!r.ok) { alert('Save failed: ' + r.status); return; }
        const blob = await r.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fname || `arrow-photo-${id}.jpg`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    };

    window.phDelete = async function(id, btn) {
        if (!confirm('Delete this photo? This cannot be undone.')) return;
        btn.disabled = true;
        const r = await fetch(window.ARROW_BACKEND_URL + `/photos/${id}`, {
            method: 'DELETE', headers,
        });
        if (r.ok) {
            btn.closest('.ph-card').remove();
            const remaining = document.querySelectorAll('.ph-card').length;
            document.getElementById('ph-count').textContent =
                `${remaining} photo${remaining === 1 ? '' : 's'}`;
        } else {
            const msg = r.status === 403 ? 'You can only delete your own photos.' : `Delete failed (${r.status}).`;
            alert(msg);
            btn.disabled = false;
        }
    };

    document.addEventListener('keydown', e => { if (e.key === 'Escape') phClose(); });
    load();
})();
</script>
{% endblock %}
