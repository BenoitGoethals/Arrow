{% extends "base.html" %}
{% block title %}Messaging — Arrow{% endblock %}
{% block head %}
<style>
    .chat-shell { display: grid; grid-template-columns: 280px 1fr; gap: 0; height: calc(100vh - 60px); }
    .recipients { background: #161b25; border-right: 1px solid #2a3142; overflow-y: auto; padding: 0.5rem; }
    .recipients h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: #94a3b8; margin: 0.5rem 0.25rem; }
    .recipients .item { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.6rem; border-radius: 6px; cursor: pointer; user-select: none; }
    .recipients .item:hover { background: #1f2937; }
    .recipients .item.active { background: #1e3a2f; outline: 1px solid #34d399; }
    .recipients .item .meta { color: #94a3b8; font-size: 0.75rem; margin-left: auto; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .dot.offline { background: #475569; }
    .badge { font-size: 0.65rem; padding: 1px 5px; border-radius: 3px; background: #2a3142; color: #cbd5e1; }
    .badge.adm { background: #7c2d12; color: #fed7aa; }
    .badge.bc { background: #1e40af; color: #bfdbfe; }

    .chat-pane { display: grid; grid-template-rows: auto 1fr auto; }
    .chat-header { padding: 0.6rem 1rem; background: #161b25; border-bottom: 1px solid #2a3142; font-weight: 600; }
    .chat-header .sub { color: #94a3b8; font-weight: 400; font-size: 0.85rem; margin-left: 0.5rem; }
    .chat-log { overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .bubble { max-width: 70%; padding: 0.5rem 0.75rem; border-radius: 12px; line-height: 1.35; word-wrap: break-word; }
    .bubble .from { font-size: 0.7rem; color: #94a3b8; margin-bottom: 2px; }
    .row.mine { align-self: flex-end; }
    .row.mine .bubble { background: #065f46; color: #ecfdf5; }
    .row.other { align-self: flex-start; }
    .row.other .bubble.broadcast { background: #1e3a8a; color: #dbeafe; }
    .row.other .bubble.group { background: #5b21b6; color: #ede9fe; }
    .row.other .bubble.direct { background: #1f2937; color: #e6e6e6; }

    .composer { display: flex; gap: 0.5rem; padding: 0.6rem; background: #161b25; border-top: 1px solid #2a3142; align-items: flex-end; }
    .composer textarea { flex: 1; background: #0e1217; color: #e6e6e6; border: 1px solid #2a3142; border-radius: 6px; padding: 0.5rem; font: inherit; resize: none; min-height: 38px; max-height: 140px; }
    .composer button { background: #34d399; color: #0e1217; border: 0; border-radius: 6px; padding: 0 1.1rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .composer button:disabled { background: #2a3142; color: #6b7280; cursor: not-allowed; }
    .composer .photo-btn { background: #1f2937; color: #94a3b8; padding: 0 0.7rem; font-size: 1.1rem; }
    .composer .photo-btn:hover { background: #2a3142; color: #e2e8f0; }
    .photo-preview { position: relative; display: inline-flex; margin: 0.4rem 0.6rem 0; }
    .photo-preview img { max-height: 90px; max-width: 160px; border-radius: 6px; object-fit: cover; }
    .photo-preview .rm { position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff; border: 0; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 0.7rem; line-height: 20px; text-align: center; padding: 0; }
    .bubble img.msg-photo { max-width: 100%; max-height: 240px; border-radius: 6px; display: block; margin-top: 4px; cursor: pointer; }
    .bubble video.msg-video { max-width: 100%; max-height: 280px; border-radius: 6px; display: block; margin-top: 4px; }
    .photo-uploading { font-size: 0.75rem; color: #94a3b8; padding: 0.2rem 0; }
    .photo-preview video { max-height: 90px; max-width: 160px; border-radius: 6px; }
    main { padding: 0; }
</style>
{% endblock %}
{% block content %}
<div class="chat-shell">
    <aside class="recipients">
        <h3>Channels</h3>
        <div id="ch-broadcast" class="item active" data-recipient="broadcast">
            <span>📢 Broadcast (everyone)</span>
        </div>
        <h3 style="display:flex;align-items:center">Chat Rooms
            <button id="new-room-btn" title="New chat room"
                    style="margin-left:auto;background:#1f2937;color:#34d399;border:1px solid #2a3142;
                           border-radius:5px;cursor:pointer;font-size:0.85rem;line-height:1;padding:2px 7px">＋</button>
        </h3>
        <div id="rooms-list"><small style="color:#94a3b8">none</small></div>
        <h3>Direct</h3>
        <div id="operators-list">Loading…</div>
    </aside>
    <section class="chat-pane">
        <header class="chat-header">
            <span id="chat-title">📢 Broadcast (everyone)</span>
            <span class="sub" id="chat-sub"></span>
        </header>
        <div id="chat-log" class="chat-log"></div>
        <div id="photo-preview-wrap"></div>
        <div class="composer">
            <button class="photo-btn" id="composer-photo" title="Attach photo or video">📎</button>
            <input type="file" id="photo-file-input" accept="image/*,video/*" style="display:none">
            <textarea id="composer-input" placeholder="Type a message…" rows="1"></textarea>
            <button id="composer-send">Send</button>
        </div>
    </section>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
    const token = localStorage.getItem('arrow_token');
    if (!token) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
    const role = localStorage.getItem('arrow_role') || 'OPERATOR';
    const headers = { Authorization: `Bearer ${token}` };
    const api = (p, opts = {}) => fetch(window.ARROW_BACKEND_URL + p, { ...opts, headers: { ...headers, ...(opts.headers || {}) } });

    const canManage = (role === 'ADMIN' || role === 'BATTLE_CAPTAIN');

    const state = {
        me: null,
        operators: [],
        rooms: [],
        messages: [],
        recipient: { kind: 'broadcast' }, // {kind:'broadcast'} | {kind:'room',room:{...}} | {kind:'direct',op:{...}}
    };

    function recipientKey(r) {
        if (r.kind === 'broadcast') return 'broadcast';
        if (r.kind === 'room') return 'room:' + r.room.id;
        return 'direct:' + r.op.id;
    }
    function recipientTitle(r) {
        if (r.kind === 'broadcast') return '📢 Broadcast (everyone)';
        if (r.kind === 'room') return '# ' + r.room.name + '  (' + (r.room.member_ids?.length || 0) + ' members)';
        return '→ ' + r.op.callsign + '  (' + r.op.rank + ' · ' + r.op.role + ')';
    }

    function badgesFor(op) {
        if (op.role === 'ADMIN') return '<span class="badge adm">ADM</span>';
        if (op.role === 'BATTLE_CAPTAIN') return '<span class="badge bc">BC</span>';
        return '';
    }

    function setRecipientFromTag(tag) {
        if (tag === 'broadcast') state.recipient = { kind: 'broadcast' };
        else if (tag.startsWith('room:')) {
            const id = parseInt(tag.slice(5), 10);
            const room = state.rooms.find(r => r.id === id);
            if (room) state.recipient = { kind: 'room', room };
        } else if (tag.startsWith('direct:')) {
            const id = parseInt(tag.slice(7), 10);
            const op = state.operators.find(o => o.id === id);
            if (op) state.recipient = { kind: 'direct', op };
        }
    }

    function renderRecipients() {
        // Chat rooms
        const rl = document.getElementById('rooms-list');
        rl.innerHTML = state.rooms.length ? state.rooms.map(r => `
            <div class="item" data-recipient="room:${r.id}">
                <span># ${escapeHtml(r.name)}</span>
                <span class="meta">${r.member_ids?.length || 0}
                    <button class="room-cog" data-room="${r.id}" title="Manage members"
                        style="background:none;border:0;color:#94a3b8;cursor:pointer;font-size:0.9rem;padding:0 2px">⚙</button>
                </span>
            </div>`).join('') : '<small style="color:#94a3b8">none</small>';

        // Direct operators
        const list = document.getElementById('operators-list');
        list.innerHTML = state.operators.length ? state.operators
            .filter(o => state.me ? o.id !== state.me.id : true)
            .map(o => `<div class="item" data-recipient="direct:${o.id}">
                <span class="dot ${o.status === 'ONLINE' ? 'online' : 'offline'}"></span>
                <span>${escapeHtml(o.callsign)}</span>
                <span class="meta">${o.rank} ${badgesFor(o)}</span>
            </div>`).join('') : '<small style="color:#94a3b8">no operators</small>';

        // Highlight + wire clicks
        document.querySelectorAll('.recipients .item').forEach(el => {
            el.classList.toggle('active', el.dataset.recipient === recipientKey(state.recipient));
            el.addEventListener('click', (ev) => {
                if (ev.target.classList.contains('room-cog')) return;  // handled below
                setRecipientFromTag(el.dataset.recipient);
                document.querySelectorAll('.recipients .item').forEach(e =>
                    e.classList.toggle('active', e.dataset.recipient === recipientKey(state.recipient)));
                document.getElementById('chat-title').textContent = recipientTitle(state.recipient);
                renderMessages();
            });
        });
        document.querySelectorAll('.room-cog').forEach(btn => {
            btn.addEventListener('click', (ev) => {
                ev.stopPropagation();
                openRoomManager(parseInt(btn.dataset.room, 10));
            });
        });
    }

    function visibleInChannel(m) {
        const r = state.recipient;
        const meId = state.me?.id;
        if (r.kind === 'broadcast') return m.message_type === 'BROADCAST';
        if (r.kind === 'room') return m.message_type === 'ROOM' && m.chatroom_id === r.room.id;
        // direct: between me and the chosen operator
        return m.message_type === 'DIRECT'
            && ((m.sender_id === meId && m.receiver_id === r.op.id)
              || (m.sender_id === r.op.id && m.receiver_id === meId));
    }

    function renderMessages() {
        const log = document.getElementById('chat-log');
        const meId = state.me?.id;
        const filtered = state.messages.filter(visibleInChannel)
            .slice().sort((a, b) => a.id - b.id);
        const opMap = new Map(state.operators.map(o => [o.id, o]));
        const nameFor = (id) => opMap.get(id)?.callsign || `#${id}`;

        log.innerHTML = filtered.map(m => {
            const mine = m.sender_id === meId;
            const cls = m.message_type === 'BROADCAST' ? 'broadcast'
                : m.message_type === 'ROOM' ? 'group' : 'direct';
            const roomName = m.chatroom_id ? (state.rooms.find(r => r.id === m.chatroom_id)?.name || '') : '';
            const sender = m.sender_callsign || nameFor(m.sender_id);
            let mediaHtml = '';
            if (m.photo_id) {
                const src = `${window.ARROW_BACKEND_URL}/photos/${m.photo_id}`;
                if (m.photo_mime_type && m.photo_mime_type.startsWith('video/')) {
                    mediaHtml = `<video class="msg-video" src="${src}" controls></video>`;
                } else {
                    mediaHtml = `<img class="msg-photo" src="${src}" alt="photo" onclick="window.open(this.src)">`;
                }
            }
            const photoHtml = mediaHtml;
            return `<div class="row ${mine ? 'mine' : 'other'}">
                <div class="bubble ${cls}">
                    <div class="from">${escapeHtml(sender)} · ${m.message_type}${roomName ? ' / # ' + escapeHtml(roomName) : ''}
                        <button class="msg-fwd" onclick="msgForward(${m.id})"
                                title="Forward this message"
                                style="background:none;border:0;color:#94a3b8;cursor:pointer;
                                       font-size:0.78rem;padding:0 2px;margin-left:6px">↪</button>
                    </div>
                    ${m.content ? escapeHtml(m.content) : ''}
                    ${photoHtml}
                </div>
            </div>`;
        }).join('') || '<small style="color:#94a3b8;align-self:center">no messages in this channel yet</small>';
        log.scrollTop = log.scrollHeight;
    }

    function escapeHtml(s) {
        return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    async function refresh() {
        const [meR, opsR, msgsR, roomsR] = await Promise.all([
            api('/auth/me'), api('/operators'), api('/messages'), api('/chatrooms'),
        ]);
        if (meR.ok) state.me = await meR.json();
        if (opsR.ok) state.operators = await opsR.json();
        if (msgsR.ok) state.messages = await msgsR.json();
        if (roomsR.ok) state.rooms = await roomsR.json();
        // Keep the selected room object fresh (membership may have changed).
        if (state.recipient.kind === 'room') {
            const updated = state.rooms.find(r => r.id === state.recipient.room.id);
            if (updated) state.recipient.room = updated;
            else state.recipient = { kind: 'broadcast' };
        }
        renderRecipients();
        renderMessages();
    }

    // ── Chat room create + member management ───────────────────────────────────
    async function createRoom() {
        const name = prompt('New chat room name:');
        if (!name || !name.trim()) return;
        const res = await api('/chatrooms', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name.trim(), member_ids: [] }),
        });
        if (!res.ok) { alert('Create failed: ' + res.status); return; }
        const room = await res.json();
        await refresh();
        setRecipientFromTag('room:' + room.id);
        document.getElementById('chat-title').textContent = recipientTitle(state.recipient);
        renderRecipients(); renderMessages();
    }

    window.openRoomManager = async function(roomId) {
        const room = state.rooms.find(r => r.id === roomId);
        if (!room) return;
        const memberSet = new Set(room.member_ids || []);
        document.getElementById('room-mgr-modal')?.remove();
        const rows = state.operators.map(o => `
            <label style="display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0.4rem;border-radius:5px;cursor:pointer">
                <input type="checkbox" data-op="${o.id}" ${memberSet.has(o.id) ? 'checked' : ''}>
                <span>${escapeHtml(o.callsign)}</span>
                <span style="color:#64748b;font-size:0.75rem;margin-left:auto">${escapeHtml(o.role)}</span>
            </label>`).join('');
        const modal = document.createElement('div');
        modal.id = 'room-mgr-modal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9000;display:flex;align-items:center;justify-content:center';
        modal.innerHTML = `
          <div style="background:#161b25;border:1px solid #2a3142;border-radius:10px;width:420px;max-width:95vw;padding:1.2rem">
            <div style="font-weight:700;color:#34d399;margin-bottom:0.2rem"># ${escapeHtml(room.name)}</div>
            <div style="color:#64748b;font-size:0.74rem;margin-bottom:0.7rem">Tick operators to add, untick to remove.</div>
            <div style="max-height:46vh;overflow-y:auto;border:1px solid #2a3142;border-radius:6px;padding:0.3rem">${rows}</div>
            <div style="display:flex;gap:0.5rem;justify-content:space-between;margin-top:0.9rem">
              <button id="room-del" style="background:#3a1212;color:#fca5a5;border:1px solid #7f1d1d;border-radius:6px;padding:0.4rem 0.9rem;cursor:pointer">Delete room</button>
              <div style="display:flex;gap:0.5rem">
                <button onclick="document.getElementById('room-mgr-modal').remove()" style="background:#1f2937;color:#94a3b8;border:1px solid #2a3142;border-radius:6px;padding:0.4rem 1rem;cursor:pointer">Close</button>
                <button id="room-save" style="background:#34d399;color:#0d1117;border:0;border-radius:6px;padding:0.4rem 1.2rem;font-weight:600;cursor:pointer">Save</button>
              </div>
            </div>
            <div id="room-mgr-err" style="color:#ef4444;font-size:0.8rem;margin-top:0.4rem"></div>
          </div>`;
        document.body.appendChild(modal);
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });

        document.getElementById('room-save').addEventListener('click', async () => {
            const boxes = [...modal.querySelectorAll('input[data-op]')];
            const err = document.getElementById('room-mgr-err');
            for (const b of boxes) {
                const opId = parseInt(b.dataset.op, 10);
                const was = memberSet.has(opId);
                if (b.checked && !was) {
                    const r = await api(`/chatrooms/${roomId}/members`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ operator_id: opId }) });
                    if (!r.ok) { err.textContent = 'Add failed (' + r.status + ')'; return; }
                } else if (!b.checked && was) {
                    const r = await api(`/chatrooms/${roomId}/members/${opId}`, { method: 'DELETE' });
                    if (!r.ok) { err.textContent = 'Remove failed (' + r.status + ')'; return; }
                }
            }
            modal.remove();
            await refresh();
        });
        document.getElementById('room-del').addEventListener('click', async () => {
            if (!confirm('Delete room "' + room.name + '"?')) return;
            const r = await api(`/chatrooms/${roomId}`, { method: 'DELETE' });
            if (r.ok || r.status === 204) { modal.remove(); if (state.recipient.kind === 'room' && state.recipient.room.id === roomId) state.recipient = { kind: 'broadcast' }; await refresh(); }
            else document.getElementById('room-mgr-err').textContent = 'Delete failed (' + r.status + ')';
        });
    };

    document.getElementById('new-room-btn').addEventListener('click', createRoom);

    // ── Photo attachment ──────────────────────────────────────────────────────
    let pendingPhotoId = null;

    document.getElementById('composer-photo').addEventListener('click', () => {
        document.getElementById('photo-file-input').click();
    });

    document.getElementById('photo-file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const wrap = document.getElementById('photo-preview-wrap');
        const isVideo = file.type.startsWith('video/');
        wrap.innerHTML = `<div class="photo-uploading">Uploading ${isVideo ? 'video' : 'photo'}…</div>`;

        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch(window.ARROW_BACKEND_URL + '/photos', {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: fd,
        });
        if (!res.ok) { wrap.innerHTML = ''; alert('Upload failed'); return; }
        const data = await res.json();
        pendingPhotoId = data.id;

        const localUrl = URL.createObjectURL(file);
        const previewEl = isVideo
            ? `<video src="${localUrl}" muted style="max-height:90px;max-width:160px;border-radius:6px"></video>`
            : `<img src="${localUrl}" alt="preview" style="max-height:90px;max-width:160px;border-radius:6px;object-fit:cover">`;
        wrap.innerHTML = `<div class="photo-preview">
            ${previewEl}
            <button class="rm" id="photo-remove" title="Remove">✕</button>
        </div>`;
        document.getElementById('photo-remove').addEventListener('click', () => {
            pendingPhotoId = null;
            wrap.innerHTML = '';
            e.target.value = '';
            URL.revokeObjectURL(localUrl);
        });
    });

    async function send() {
        const ta = document.getElementById('composer-input');
        const content = ta.value.trim();
        if (!content && !pendingPhotoId) return;

        const r = state.recipient;
        const body = (r.kind === 'broadcast') ? { content, message_type: 'BROADCAST' }
            : (r.kind === 'room') ? { content, message_type: 'ROOM', chatroom_id: r.room.id }
            : { content, message_type: 'DIRECT', receiver_id: r.op.id };
        if (pendingPhotoId) body.photo_id = pendingPhotoId;

        const res = await api('/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        if (!res.ok) { alert('Send failed: ' + res.status); return; }
        ta.value = ''; ta.style.height = 'auto';
        pendingPhotoId = null;
        document.getElementById('photo-preview-wrap').innerHTML = '';
        document.getElementById('photo-file-input').value = '';
        await refresh();
    }

    document.getElementById('composer-send').addEventListener('click', send);
    document.getElementById('composer-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    document.getElementById('composer-input').addEventListener('input', (e) => {
        e.target.style.height = 'auto';
        e.target.style.height = Math.min(140, e.target.scrollHeight) + 'px';
    });

    // Apply ?open= deep-link from notification click (runs after first refresh populates operators).
    function applyOpenParam() {
        const open = new URLSearchParams(location.search).get('open');
        if (!open) return;
        setRecipientFromTag(open);
        document.getElementById('chat-title').textContent = recipientTitle(state.recipient);
        renderRecipients();
        renderMessages();
        // Clean URL without reload so refreshing doesn't keep re-applying it
        history.replaceState(null, '', location.pathname);
    }

    // ── Forward a message to another recipient ───────────────────────────
    window.msgForward = function(msgId) {
        const m = state.messages.find(x => x.id === msgId);
        if (!m) return;

        // Build a recipient picker over the same options the composer has.
        document.getElementById('msg-fwd-modal')?.remove();
        const opts = state.operators
            .filter(o => o.id !== state.me?.id)
            .sort((a, b) => a.callsign.localeCompare(b.callsign))
            .map(o => `<option value="direct:${o.id}">→ ${escapeHtml(o.callsign)}  (${escapeHtml(o.role)})</option>`)
            .join('');
        const modal = document.createElement('div');
        modal.id = 'msg-fwd-modal';
        modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.65);' +
                              'z-index:9000;display:flex;align-items:center;justify-content:center';
        modal.innerHTML = `
        <div style="background:#161b25;border:1px solid #2a3142;border-radius:10px;
                    width:480px;max-width:95vw;padding:1.2rem">
            <div style="font-weight:700;color:#34d399;margin-bottom:0.4rem">↪ Forward message</div>
            <div style="background:#0d1117;border:1px solid #2a3142;border-radius:6px;
                        padding:0.5rem 0.7rem;margin-bottom:0.85rem;font-size:0.84rem;color:#cbd5e1">
                <div style="color:#64748b;font-size:0.72rem">From ${escapeHtml(state.operators.find(o=>o.id===m.sender_id)?.callsign || '#'+m.sender_id)}</div>
                ${m.content ? escapeHtml(m.content) : '<i style="color:#475569">(photo only)</i>'}
                ${m.photo_id ? '<div style="color:#94a3b8;font-size:0.72rem;margin-top:3px">📷 with photo</div>' : ''}
            </div>
            <label style="font-size:0.78rem;color:#94a3b8">Forward to</label>
            <select id="fwd-to" style="width:100%;background:#0d1117;color:#e2e8f0;border:1px solid #2a3142;
                                       border-radius:6px;padding:0.4rem 0.6rem;font:inherit;font-size:0.85rem;
                                       margin-bottom:0.6rem">
                <option value="">— select recipient —</option>
                <option value="broadcast">📢 Broadcast (everyone)</option>
                ${state.rooms.map(r => `<option value="room:${r.id}"># ${escapeHtml(r.name)}</option>`).join('')}
                <option disabled>──────────</option>
                ${opts}
            </select>
            <label style="font-size:0.78rem;color:#94a3b8">Add a note (optional)</label>
            <textarea id="fwd-note" placeholder="Forwarded via Arrow"
                style="width:100%;background:#0d1117;color:#e2e8f0;border:1px solid #2a3142;
                       border-radius:6px;padding:0.4rem 0.6rem;font:inherit;font-size:0.85rem;
                       resize:vertical;min-height:48px;box-sizing:border-box"></textarea>
            <div style="display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.85rem">
                <button onclick="document.getElementById('msg-fwd-modal').remove()"
                        style="background:#1f2937;color:#94a3b8;border:1px solid #2a3142;
                               border-radius:6px;padding:0.4rem 1rem;font:inherit;cursor:pointer">Cancel</button>
                <button id="fwd-go" onclick="msgForwardSubmit(${msgId})"
                        style="background:#34d399;color:#0d1117;border:0;border-radius:6px;
                               padding:0.4rem 1.2rem;font:inherit;font-weight:600;cursor:pointer">↪ Forward</button>
            </div>
            <div id="fwd-err" style="color:#ef4444;font-size:0.8rem;margin-top:0.4rem"></div>
        </div>`;
        document.body.appendChild(modal);
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    };

    window.msgForwardSubmit = async function(msgId) {
        const m  = state.messages.find(x => x.id === msgId);
        const to = document.getElementById('fwd-to').value;
        const note = document.getElementById('fwd-note').value.trim();
        const err  = document.getElementById('fwd-err');
        err.textContent = '';
        if (!to) { err.textContent = 'Select a recipient first.'; return; }

        // Compose a forwarded body — preserve the original sender + content
        const origFrom = state.operators.find(o => o.id === m.sender_id)?.callsign || `#${m.sender_id}`;
        const headLine = `↪ Forwarded from ${origFrom}`;
        const body = [
            note,
            note ? '— — —' : '',
            headLine,
            m.content || '',
        ].filter(Boolean).join('\n');

        const payload = { content: body, photo_id: m.photo_id ?? null };
        if (to === 'broadcast') {
            payload.message_type = 'BROADCAST';
        } else if (to.startsWith('room:')) {
            payload.message_type = 'ROOM';
            payload.chatroom_id  = parseInt(to.slice(5), 10);
        } else if (to.startsWith('direct:')) {
            payload.message_type = 'DIRECT';
            payload.receiver_id  = parseInt(to.slice(7), 10);
        } else {
            err.textContent = 'Invalid recipient.';
            return;
        }

        const r = await fetch(window.ARROW_BACKEND_URL + '/messages', {
            method:  'POST',
            headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
            body:    JSON.stringify(payload),
        });
        if (r.ok) {
            document.getElementById('msg-fwd-modal').remove();
            refresh();
        } else {
            err.textContent = `Failed (${r.status}): ${(await r.text()).slice(0, 80)}`;
        }
    };

    // WebSocket: pick up new messages as they arrive.
    function connectWS() {
        const wsUrl = window.ARROW_WS_URL.replace(/^http/, 'ws') + '/ws?token=' + encodeURIComponent(token);
        const ws = new WebSocket(wsUrl);
        ws.onmessage = (ev) => {
            const evt = JSON.parse(ev.data);
            if (evt.channel === 'chat') refresh();
        };
        ws.onclose = () => setTimeout(connectWS, 3000);
    }

    refresh().then(applyOpenParam);
    setInterval(refresh, 5000);
    connectWS();
})();
</script>
{% endblock %}
