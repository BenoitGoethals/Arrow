{% extends "base.html" %}
{% block title %}Signed out — Arrow{% endblock %}
{% block content %}
<section class="auth">
    <h1>Signed out</h1>
    <p><a href="{{ url_for('login') }}">Sign in again</a></p>
</section>
{% endblock %}
{% block scripts %}
<script>
    // Clear all client-side session state, then send the user straight to the
    // home/login page — "Sign out" should land you back at the front door
    // automatically rather than parking on a static "Signed out" notice.
    localStorage.removeItem('arrow_token');
    localStorage.removeItem('arrow_role');
    try { sessionStorage.removeItem('arrow_mission'); } catch (_) {}
    window.location.replace("{{ url_for('login') }}");
</script>
{% endblock %}
