{% extends "base.html" %}
{% block title %}Signed out — Arrow{% endblock %}
{% block content %}
<section class="auth">
    <h1>Signed out</h1>
    <p><a href="{{ url_for('login') }}">Sign in again</a></p>
</section>
{% endblock %}
{% block scripts %}
<script>
    localStorage.removeItem('arrow_token');
    localStorage.removeItem('arrow_role');
</script>
{% endblock %}
