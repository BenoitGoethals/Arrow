{% extends "base.html" %}
{% block title %}Admin — Arrow{% endblock %}
{% block head %}
<style>
/* ── Layout ──────────────────────────────────────────────────────────────── */
.adm-shell  { display: grid; grid-template-columns: 220px 1fr; height: calc(100vh - 60px); }
.adm-nav    { background: #0d1117; border-right: 1px solid #2a3142; padding: 1rem 0.5rem; display: flex; flex-direction: column; gap: 2px; }
.adm-nav h4 { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.15em; color: #475569; margin: 0.75rem 0.5rem 0.2rem; }
.nav-btn    { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.7rem; border-radius: 6px; cursor: pointer; border: 0; background: none; color: #94a3b8; width: 100%; text-align: left; font: inherit; font-size: 0.85rem; }
.nav-btn:hover  { background: #1a2233; color: #e2e8f0; }
.nav-btn.active { background: #1e3a2f; color: #34d399; font-weight: 600; }
.nav-btn .ico   { font-size: 1rem; width: 20px; text-align: center; }
.adm-main   { overflow-y: auto; padding: 1.5rem 2rem; }

/* ── Stats cards ─────────────────────────────────────────────────────────── */
.stat-grid  { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.stat-card  { background: #161b25; border: 1px solid #2a3142; border-radius: 8px; padding: 1rem; }
.stat-card .val  { font-size: 2rem; font-weight: 700; color: #34d399; }
.stat-card .lbl  { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
.stat-card.warn  .val { color: #f59e0b; }
.stat-card.danger .val { color: #ef4444; }

/* ── Tables ──────────────────────────────────────────────────────────────── */
.adm-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
.adm-table th { text-align: left; color: #64748b; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.5rem 0.75rem; border-bottom: 1px solid #2a3142; white-space: nowrap; }
.adm-table td { padding: 0.55rem 0.75rem; border-bottom: 1px solid #1e2736; vertical-align: middle; }
.adm-table tr:hover td { background: #1a1f29; }
.dot-online  { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 5px #22c55e; }
.dot-offline { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #475569; }

/* ── Badges ──────────────────────────────────────────────────────────────── */
.badge { display: inline-block; font-size: 0.68rem; font-weight: 700; padding: 1px 6px; border-radius: 3px; }
.badge-adm  { background: #7c2d12; color: #fed7aa; }
.badge-bc   { background: #1e40af; color: #bfdbfe; }
.badge-op   { background: #1e293b; color: #94a3b8; }
.badge-ok   { background: #166534; color: #86efac; }
.badge-warn { background: #78350f; color: #fde68a; }
.badge-err  { background: #7f1d1d; color: #fca5a5; }

/* ── Section headers ─────────────────────────────────────────────────────── */
.sec-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.sec-header h2 { margin: 0; font-size: 1.1rem; }

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn        { padding: 0.4rem 0.9rem; border: 0; border-radius: 6px; font: inherit; font-size: 0.82rem; cursor: pointer; }
.btn-primary { background: #34d399; color: #0d1117; font-weight: 600; }
.btn-primary:hover { background: #6ee7b7; }
.btn-danger  { background: #ef4444; color: #fff; }
.btn-danger:hover { background: #f87171; }
.btn-ghost   { background: #1f2937; color: #94a3b8; border: 1px solid #2a3142; }
.btn-ghost:hover { border-color: #475569; color: #e2e8f0; }
.btn-sm      { padding: 0.2rem 0.55rem; font-size: 0.78rem; }

/* ── Modal ───────────────────────────────────────────────────────────────── */
.modal-bg   { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal      { background: #161b25; border: 1px solid #2a3142; border-radius: 10px; padding: 1.5rem; width: 440px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal h3   { margin: 0 0 1rem; font-size: 1rem; }
.field      { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.9rem; }
.field label { font-size: 0.78rem; color: #94a3b8; }
.field input, .field select { background: #0d1117; color: #e2e8f0; border: 1px solid #2a3142; border-radius: 5px; padding: 0.45rem 0.6rem; font: inherit; font-size: 0.88rem; }
.field input:focus, .field select:focus { outline: none; border-color: #34d399; }
.field .hint { font-size: 0.72rem; color: #475569; }
.modal-footer { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.2rem; }
.form-error { color: #ef4444; font-size: 0.8rem; margin-top: 0.4rem; }

/* ── Hierarchy tree ──────────────────────────────────────────────────────── */
.htree details { margin-left: 1rem; }
.htree summary { cursor: pointer; padding: 0.3rem 0; display: flex; align-items: center; gap: 0.5rem; }
.htree summary::marker { color: #34d399; }
.htree .h-item { display: flex; align-items: center; gap: 0.5rem; }
.htree .h-name { flex: 1; font-size: 0.88rem; }
.htree .h-meta { font-size: 0.72rem; color: #475569; }

/* ── Config ──────────────────────────────────────────────────────────────── */
.cfg-section { background: #161b25; border: 1px solid #2a3142; border-radius: 8px; margin-bottom: 1rem; }
.cfg-section h3 { margin: 0; padding: 0.75rem 1rem; border-bottom: 1px solid #2a3142; font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.1em; color: #64748b; }
.cfg-row { display: grid; grid-template-columns: 180px 1fr; gap: 0; border-bottom: 1px solid #1e2736; }
.cfg-row:last-child { border-bottom: 0; }
.cfg-key { padding: 0.55rem 1rem; font-size: 0.8rem; color: #64748b; font-family: monospace; border-right: 1px solid #1e2736; }
.cfg-val { padding: 0.55rem 1rem; font-size: 0.88rem; font-family: monospace; color: #e2e8f0; }
.cfg-val.warn { color: #f59e0b; }

main { padding: 0; }
</style>
{% endblock %}

{% block content %}
<div class="adm-shell">

  <!-- ── Sidebar nav ─────────────────────────────────────────────────── -->
  <nav class="adm-nav">
    <h4>Overview</h4>
    <button class="nav-btn active" onclick="show('overview',this)"><span class="ico">📊</span> Dashboard</button>

    <h4>Users</h4>
    <button class="nav-btn" onclick="show('operators',this)"><span class="ico">👥</span> Operators</button>

    <h4>Organisation</h4>
    <button class="nav-btn" onclick="show('hierarchy',this)"><span class="ico">🏛</span> Hierarchy</button>

    <h4>System</h4>
    <button class="nav-btn" onclick="show('config',this)"><span class="ico">⚙</span> Configuration</button>
    <button class="nav-btn" onclick="show('octopus',this)"><span class="ico">⏺</span> Octopus</button>
    <button class="nav-btn" onclick="show('alerts',this)"><span class="ico">🚨</span> Alerts</button>
    <button class="nav-btn" onclick="show('snapshots',this)"><span class="ico">🗺</span> Map snapshots</button>
    <button class="nav-btn" onclick="show('visibility',this)"><span class="ico">👁</span> Map visibility</button>
    <button class="nav-btn" onclick="show('maps',this)" data-role-any><span class="ico">🗂</span> Base maps</button>
  </nav>

  <!-- ── Main area ───────────────────────────────────────────────────── -->
  <div class="adm-main" id="adm-main"></div>
</div>

<!-- ── Modals ──────────────────────────────────────────────────────────── -->

<!-- Create operator -->
<div class="modal-bg" id="modal-create-op">
  <div class="modal">
    <h3>➕ New Operator</h3>
    <div class="field"><label>Callsign *</label><input id="new-callsign" placeholder="e.g. BRAVO-42"/></div>
    <div class="field"><label>Password *</label><input id="new-password" type="password" placeholder="min 8 chars"/></div>
    <div class="field"><label>Rank</label>
      <select id="new-rank">
        {% for r in ['OR-1','OR-2','OR-3','OR-4','OR-5','OR-6','OF-1','OF-2','OF-3'] %}
        <option>{{ r }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>Role</label>
      <select id="new-role">
        <option value="OPERATOR">OPERATOR</option>
        <option value="BATTLE_CAPTAIN">BATTLE_CAPTAIN</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div class="field">
      <label>Team <span style="color:#ef4444">*</span></label>
      <select id="new-team"><option value="">— select a team —</option></select>
      <span class="hint">Every operator must belong to a team.</span>
    </div>
    <div id="create-op-err" class="form-error"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-create-op')">Cancel</button>
      <button class="btn btn-primary" onclick="createOperator()">Create</button>
    </div>
  </div>
</div>

<!-- Edit operator -->
<div class="modal-bg" id="modal-edit-op">
  <div class="modal">
    <h3>✏️ Edit Operator: <span id="edit-callsign-label"></span></h3>
    <input type="hidden" id="edit-op-id"/>
    <div class="field"><label>Rank</label>
      <select id="edit-rank">
        {% for r in ['OR-1','OR-2','OR-3','OR-4','OR-5','OR-6','OF-1','OF-2','OF-3'] %}
        <option>{{ r }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>Role</label>
      <select id="edit-role">
        <option value="OPERATOR">OPERATOR</option>
        <option value="BATTLE_CAPTAIN">BATTLE_CAPTAIN</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div class="field"><label>Status</label>
      <select id="edit-status">
        <option value="ONLINE">ONLINE</option>
        <option value="OFFLINE">OFFLINE</option>
      </select>
    </div>
    <div class="field"><label>Team</label><select id="edit-team"><option value="">— unassigned —</option></select></div>
    <hr style="border-color:#2a3142;margin:1rem 0">
    <div class="field"><label>New password <span style="color:#475569">(leave blank = no change)</span></label>
      <input id="edit-password" type="password" placeholder="new password…"/>
    </div>
    <div id="edit-op-err" class="form-error"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-edit-op')">Cancel</button>
      <button class="btn btn-primary" onclick="saveOperator()">Save</button>
    </div>
  </div>
</div>

<!-- Add hierarchy node -->
<div class="modal-bg" id="modal-add-node">
  <div class="modal">
    <h3 id="add-node-title">Add…</h3>
    <div class="field"><label>Name *</label><input id="add-node-name" placeholder="Name"/></div>
    <div class="field" id="add-node-parent-field" style="display:none">
      <label id="add-node-parent-label">Parent</label>
      <select id="add-node-parent"></select>
    </div>
    <div id="add-node-err" class="form-error"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-add-node')">Cancel</button>
      <button class="btn btn-primary" onclick="saveNode()">Add</button>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
(function () {
    const token = localStorage.getItem('arrow_token');
    if (!token) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
    const role = localStorage.getItem('arrow_role') || '';
    const isAdmin = role === 'ADMIN';
    const isBC    = role === 'BATTLE_CAPTAIN';
    if (!isAdmin && !isBC) {
        document.getElementById('adm-main').innerHTML =
            '<p style="color:#ef4444;padding:2rem">Access denied — ADMIN or BATTLE_CAPTAIN role required.</p>';
        return;
    }
    // Battle Captains only have permission to manage base maps — hide every
    // nav button except those marked `data-role-any`, and start them on the
    // maps tab instead of the dashboard overview.
    if (!isAdmin) {
        document.querySelectorAll('.adm-nav .nav-btn').forEach(btn => {
            if (!btn.hasAttribute('data-role-any')) btn.style.display = 'none';
        });
        document.querySelectorAll('.adm-nav h4').forEach(h => h.style.display = 'none');
    }
    const hdr  = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
    const api  = (p, o = {}) => fetch(window.ARROW_BACKEND_URL + p, { ...o, headers: { ...hdr, ...(o.headers||{}) } });

    // ── Global data cache ──────────────────────────────────────────────────
    let operators = [], teams = [], sections = [], platoons = [], companies = [], alertsList = [];

    async function loadAll() {
        // BCs can't hit the operators/hierarchy endpoints; skip them so the
        // Maps tab still loads cleanly without unauthorised noise.
        if (!isAdmin) return;
        [operators, teams, sections, platoons, companies] = await Promise.all([
            api('/operators').then(r => r.ok ? r.json() : []),
            api('/teams').then(r => r.ok ? r.json() : []),
            api('/sections').then(r => r.ok ? r.json() : []),
            api('/platoons').then(r => r.ok ? r.json() : []),
            api('/companies').then(r => r.ok ? r.json() : []),
        ]);
    }

    // ── Section router ─────────────────────────────────────────────────────
    window.show = function(section, btn) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadAll().then(() => render(section));
    };

    function render(section) {
        const main = document.getElementById('adm-main');
        switch (section) {
            case 'overview':  main.innerHTML = ''; renderOverview(main); break;
            case 'operators': main.innerHTML = ''; renderOperators(main); break;
            case 'hierarchy': main.innerHTML = ''; renderHierarchy(main); break;
            case 'config':    main.innerHTML = ''; renderConfig(main); break;
            case 'alerts':    main.innerHTML = ''; renderAlerts(main); break;
            case 'snapshots': main.innerHTML = ''; renderSnapshots(main); break;
            case 'visibility':main.innerHTML = ''; renderVisibility(main); break;
            case 'maps':      main.innerHTML = ''; renderMaps(main); break;
            case 'octopus':   main.innerHTML = ''; renderOctopus(main); break;
        }
    }

    // Battle Captains land directly on the Maps tab since other tabs are hidden.
    if (!isAdmin) {
        // Defer to the next tick so DOM is ready.
        setTimeout(() => {
            const btn = document.querySelector('[onclick*="show(\'maps\'"]');
            if (btn) show('maps', btn);
        }, 0);
    }

    // ── Overview ───────────────────────────────────────────────────────────
    async function renderOverview(el) {
        const stats = await api('/admin/stats').then(r => r.ok ? r.json() : null);
        if (!stats) { el.innerHTML = '<p style="color:#ef4444">Could not load stats.</p>'; return; }
        const roles = stats.operators.by_role || {};
        el.innerHTML = `
        <h2 style="margin-top:0">Dashboard</h2>
        <div class="stat-grid">
            <div class="stat-card"><div class="val">${stats.operators.total}</div><div class="lbl">Total operators</div></div>
            <div class="stat-card"><div class="val">${stats.operators.online}</div><div class="lbl">Online now</div></div>
            <div class="stat-card ${stats.operators.unassigned ? 'warn' : ''}">
                <div class="val">${stats.operators.unassigned || 0}</div><div class="lbl">Unassigned</div></div>
            <div class="stat-card ${stats.alerts.active ? 'danger' : ''}">
                <div class="val">${stats.alerts.active}</div><div class="lbl">Active alerts</div></div>
            <div class="stat-card"><div class="val">${stats.reports.total}</div><div class="lbl">Reports</div></div>
            <div class="stat-card"><div class="val">${stats.tactical_objects.total}</div><div class="lbl">Tactical objects</div></div>
            <div class="stat-card"><div class="val">${stats.messages.total}</div><div class="lbl">Messages</div></div>
        </div>
        <h3>Operators by role</h3>
        <div class="stat-grid">
            ${Object.entries(roles).map(([r,c]) => `<div class="stat-card"><div class="val">${c}</div><div class="lbl">${r}</div></div>`).join('')}
        </div>`;
    }

    // ── Operators ──────────────────────────────────────────────────────────
    function renderOperators(el) {
        const teamMap    = Object.fromEntries(teams.map(t => [t.id, t.name]));
        const unassigned = operators.filter(o => !o.team_id);
        const warnBanner = unassigned.length
            ? `<div style="background:#78350f22;border:1px solid #d97706;border-radius:6px;padding:0.65rem 1rem;margin-bottom:1rem;color:#fde68a;font-size:0.83rem">
                ⚠️  <strong>${unassigned.length} operator${unassigned.length>1?'s':''} unassigned</strong>:
                ${unassigned.map(o => `<span style="font-family:monospace">${esc(o.callsign)}</span>`).join(', ')}
                — edit each operator and assign a team.
               </div>` : '';
        el.innerHTML = `
        <div class="sec-header">
            <h2>Operators (${operators.length})</h2>
            <button class="btn btn-primary" onclick="openCreateOp()">➕ New operator</button>
        </div>
        ${warnBanner}
        <table class="adm-table">
            <thead><tr>
                <th></th><th>Callsign</th><th>Rank</th><th>Role</th>
                <th>Team</th><th>Status</th><th>Last seen</th><th>Actions</th>
            </tr></thead>
            <tbody>
            ${operators.map(op => {
                const badge = op.role === 'ADMIN' ? 'badge-adm' : op.role === 'BATTLE_CAPTAIN' ? 'badge-bc' : 'badge-op';
                const dot   = op.online ? '<span class="dot-online"></span>' : '<span class="dot-offline"></span>';
                const team  = op.team_id ? teamMap[op.team_id] || `#${op.team_id}` : '—';
                const ts    = (op.last_seen || '').slice(0, 16).replace('T', ' ');
                return `<tr>
                    <td>${dot}</td>
                    <td style="font-weight:600">${esc(op.callsign)}</td>
                    <td><code style="font-size:0.78rem">${esc(op.rank)}</code></td>
                    <td><span class="badge ${badge}">${op.role}</span></td>
                    <td style="color:#94a3b8">${esc(team)}</td>
                    <td><span class="badge ${op.online?'badge-ok':'badge-warn'}">${op.online?'ONLINE':'OFFLINE'}</span></td>
                    <td style="color:#64748b;font-size:0.78rem">${ts}</td>
                    <td>
                        <button class="btn btn-ghost btn-sm" onclick='openEditOp(${JSON.stringify(op)})'>Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteOp(${op.id}, '${esc(op.callsign)}')">Del</button>
                    </td>
                </tr>`;
            }).join('')}
            </tbody>
        </table>`;
    }

    window.openCreateOp = function() {
        document.getElementById('new-callsign').value = '';
        document.getElementById('new-password').value = '';
        document.getElementById('new-rank').value = 'OR-3';
        document.getElementById('new-role').value = 'OPERATOR';
        document.getElementById('create-op-err').textContent = '';
        populateTeamSelect('new-team', null);
        openModal('modal-create-op');
    };

    window.createOperator = async function() {
        const callsign = document.getElementById('new-callsign').value.trim();
        const password = document.getElementById('new-password').value;
        const rank     = document.getElementById('new-rank').value;
        const role     = document.getElementById('new-role').value;
        const team_val = document.getElementById('new-team').value;
        const errEl    = document.getElementById('create-op-err');
        if (!callsign || !password) { errEl.textContent = 'Callsign and password are required.'; return; }
        if (!team_val) { errEl.textContent = 'Please assign the operator to a team.'; return; }
        const team_id = parseInt(team_val);
        // Admin-only endpoint — creates operators with any role
        const r = await api('/auth/register/admin', { method:'POST',
            body: JSON.stringify({ callsign, password, rank, role, team_id }) });
        if (!r.ok) { errEl.textContent = `Error ${r.status}: ${await r.text()}`; return; }
        closeModal('modal-create-op');
        await loadAll(); render('operators');
    };

    window.openEditOp = function(op) {
        document.getElementById('edit-op-id').value = op.id;
        document.getElementById('edit-callsign-label').textContent = op.callsign;
        document.getElementById('edit-rank').value   = op.rank;
        document.getElementById('edit-role').value   = op.role;
        document.getElementById('edit-status').value = op.status;
        document.getElementById('edit-password').value = '';
        document.getElementById('edit-op-err').textContent = '';
        populateTeamSelect('edit-team', op.team_id);
        openModal('modal-edit-op');
    };

    window.saveOperator = async function() {
        const id  = document.getElementById('edit-op-id').value;
        const pwd = document.getElementById('edit-password').value;
        const errEl = document.getElementById('edit-op-err');
        const body = {
            rank:    document.getElementById('edit-rank').value,
            role:    document.getElementById('edit-role').value,
            status:  document.getElementById('edit-status').value,
            team_id: document.getElementById('edit-team').value
                     ? parseInt(document.getElementById('edit-team').value) : null,
        };
        const r = await api(`/operators/${id}`, { method:'PATCH', body: JSON.stringify(body) });
        if (!r.ok) { errEl.textContent = `Save failed: ${r.status}`; return; }
        if (pwd) {
            const rp = await api(`/operators/${id}/set-password`,
                { method:'POST', body: JSON.stringify({ password: pwd }) });
            if (!rp.ok) { errEl.textContent = `Password update failed: ${rp.status}`; return; }
        }
        closeModal('modal-edit-op');
        await loadAll(); render('operators');
    };

    window.deleteOp = async function(id, callsign) {
        if (!confirm(`Delete operator "${callsign}"? This cannot be undone.`)) return;
        await api(`/operators/${id}`, { method:'DELETE' });
        await loadAll(); render('operators');
    };

    // ── Hierarchy ──────────────────────────────────────────────────────────
    function renderHierarchy(el) {
        const secMap = Object.fromEntries(sections.map(s => [s.id, s]));
        const pltMap = Object.fromEntries(platoons.map(p => [p.id, p]));

        const teamsBySection  = groupBy(teams,    t => t.section_id);
        const sectionsByPlt   = groupBy(sections, s => s.platoon_id);
        const platoonsByCo    = groupBy(platoons, p => p.company_id);
        const teamOpCount     = Object.fromEntries(teams.map(t => [t.id, operators.filter(o => o.team_id === t.id).length]));

        const treeHtml = companies.length === 0
            ? '<p style="color:#475569">No companies yet.</p>'
            : companies.map(co => `
              <details>
                <summary>
                  <span class="h-item">
                    <strong>${esc(co.name)}</strong>
                    <span class="h-meta">${(platoonsByCo[co.id]||[]).length} platoons</span>
                    <button class="btn btn-ghost btn-sm" onclick="addNode('platoon',${co.id},'${esc(co.name)}')">+ Platoon</button>
                    <button class="btn btn-danger btn-sm" onclick="delNode('companies',${co.id},'${esc(co.name)}')">×</button>
                  </span>
                </summary>
                ${(platoonsByCo[co.id]||[]).map(plt => `
                  <details>
                    <summary>
                      <span class="h-item">

    window.saveApkConfig = async function() {
        const body = {
            kind:     document.getElementById('apk-kind').value,
            host:     document.getElementById('apk-host').value.trim(),
            share:    document.getElementById('apk-share').value.trim(),
            path:     document.getElementById('apk-path').value.trim(),
            filename: document.getElementById('apk-filename').value.trim() || 'arrow.apk',
            username: document.getElementById('apk-username').value.trim(),
            password: document.getElementById('apk-password').value,
        };
        const errEl = document.getElementById('apk-err');
        errEl.textContent = '';
        if (!body.path) { errEl.textContent = 'Path is required.'; return; }
        if (body.kind === 'LOCAL' && /^(nfs|smb|cifs):\/\//i.test(body.path)) {
            errEl.textContent = 'LOCAL mode needs a mounted filesystem path (e.g. /mnt/apks), not a URI. Mount the NFS/SMB share on the server first, then enter the local mount point here.';
            return;
        }
        if (body.kind === 'SMB' && (!body.host || !body.share)) {
            errEl.textContent = 'SMB host and share are required.'; return;
        }
        const r = await api('/admin/apk-config', {
            method: 'PUT', body: JSON.stringify(body),
        });
        if (!r.ok) { errEl.textContent = `Save failed: ${r.status} ${await r.text()}`; return; }
        await loadApkConfig();
    };

        if (c.messages)         parts.push(`${c.messages} msg`);
        if (c.reports)          parts.push(`${c.reports} rpt`);
        if (c.alerts)           parts.push(`${c.alerts} alt`);
        if (c.fire_missions)    parts.push(`${c.fire_missions} FM`);
        if (c.cot_tracks)       parts.push(`${c.cot_tracks} CoT`);
        if (c.kml_layers)       parts.push(`${c.kml_layers} KML`);
        if (c.overlays)         parts.push(`${c.overlays} ovl`);
        if (c.operators)        parts.push(`${c.operators} ops`);

            const out = await r.json();
            const c   = out.counts || {};
            const parts = [];
            if (c.tactical_objects) parts.push(`${c.tactical_objects} tactical`);
            if (c.messages)         parts.push(`${c.messages} messages`);

    // ── Map + notification visibility — per-category global filter ─────────
    // Two independent axes:
    //   * MAP    — what gets drawn on the map canvas
    //   * NOTIF  — what pops up as a toast card on the right of the screen
    // Each entry matches a field on the MapVisibility singleton on the server.
    // Toggling PUTs the change; every connected web/Android client respects it
    // live via the WS broadcast on the ``map-visibility`` channel.
    const MAP_CATEGORIES = [
        { key: 'tactical_objects', icon: '🎯', label: 'Tactical objects',
          desc: 'Enemies, POIs, objectives, tactical control graphics, ATK_AXIS, FLET, …' },
        { key: 'operators',        icon: '👥', label: 'Operators',
          desc: 'Friendly position markers (live tracking).' },
        { key: 'fire_missions',    icon: '💥', label: 'Fire missions',
          desc: 'CFF markers and impact splashes on the map.' },
        { key: 'alerts',           icon: '🚨', label: 'Alerts',
          desc: 'TIC / MEDICAL / EVAC / LOST_COMMS pulses and auto-zoom.' },
        { key: 'reports',          icon: '📋', label: 'Reports',
          desc: 'SPOT, CASEVAC, MEDEVAC, CAS, CBRN (also drives CBRN zones).' },
        { key: 'cot_tracks',       icon: '📡', label: 'CoT tracks',
          desc: 'Foreign-UID Cursor-on-Target tracks (simulator / ATAK peers).' },
        { key: 'kml_layers',       icon: '📂', label: 'KML layers',
          desc: 'Imported KML/KMZ overlay features (points / lines / polygons).' },
        { key: 'overlays',         icon: '📚', label: 'Saved overlays',
          desc: 'Named bundles of TacticalObject ids used as map filters.' },
    ];
    const NOTIF_CATEGORIES = [
        { key: 'notif_chat',          icon: '💬', label: 'Chat toasts',
          desc: 'BROADCAST / DIRECT / GROUP chat messages popping up on the right.' },
        { key: 'notif_fire_missions', icon: '🎯', label: 'Fire-mission toasts',
          desc: 'Red "FIRE MISSION" cards (call-for-fire alerts), inc. audio.' },
        { key: 'notif_alerts',        icon: '🚨', label: 'TIC / alert toasts',
          desc: 'TIC, MEDICAL, EVAC, LOST_COMMS, DRONE_SPOTTED toast cards + voice alarms.' },
        { key: 'notif_streams',       icon: '🎥', label: 'Stream toasts',
          desc: 'Live-stream notifications (operator goes live / ends stream).' },
        { key: 'sound_enabled',       icon: '🔊', label: 'Sound',
          desc: 'Audio alerts and voice for all events. Mute to silence everything.',
          onLabel: 'ON', offLabel: 'OFF' },
    ];
    const VIS_CATEGORIES = MAP_CATEGORIES;   // kept for backward-compat refs

    // ── Per-operator local prefs (no server PUT) ──────────────────────────
    // Each device stores its own visibility choices in localStorage. The
    // server endpoint is hit ONLY for first-time defaults — once the user
    // has touched a toggle the local copy is authoritative. Other browser
    // tabs on this device pick up the change via the ``storage`` event.
    const VIS_LS_KEY = 'arrow_visibility_prefs';
    function _allOnDefaults() {
        const d = {};
        [...MAP_CATEGORIES, ...NOTIF_CATEGORIES].forEach(c => d[c.key] = true);
        return d;
    }
    function _readVisPrefs() {
        try {
            const raw = localStorage.getItem(VIS_LS_KEY);
            if (!raw) return null;
            return JSON.parse(raw);
        } catch (_) { return null; }
    }
    function _writeVisPrefs(prefs) {
        localStorage.setItem(VIS_LS_KEY, JSON.stringify(prefs));
        // Manually fire a storage event for same-tab listeners (the standard
        // 'storage' event only fires on OTHER tabs of the same origin).
        try {
            window.dispatchEvent(new CustomEvent('arrow-visibility-changed',
                { detail: prefs }));
        } catch (_) {}
    }

    async function renderVisibility(el) {
        // Start with locally saved prefs; if none, seed from the server's
        // (admin-controlled) defaults so a brand-new install isn't all-off.
        let cur = _readVisPrefs();
        if (!cur) {
            const r = await api('/admin/map-visibility');
            cur = r.ok ? await r.json() : _allOnDefaults();
            // Trim to known keys + persist so the next visit is offline-OK.
            const trimmed = _allOnDefaults();
            for (const k of Object.keys(trimmed)) {
                if (k in cur) trimmed[k] = !!cur[k];
            }
            cur = trimmed;
            _writeVisPrefs(cur);
        }

        const card = (c, on, onTone='#1e3a2f', offTone='#7f1d1d') => {
            const safe = (s) => s.replace(/[<>&]/g, x => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[x]));
            return `
                <label style="display:flex; align-items:center; gap:0.6rem;
                              background:#161b25; border:1px solid ${on?onTone:'#2a3142'};
                              border-radius:6px; padding:0.7rem 0.9rem; cursor:pointer">
                    <input type="checkbox" id="vis-${c.key}" ${on?'checked':''}
                           onchange="visToggle('${c.key}', this.checked, this)"
                           style="width:18px; height:18px; cursor:pointer"/>
                    <div style="flex:1; min-width:0">
                        <div style="font-weight:600; color:#e2e8f0">
                            ${c.icon} ${safe(c.label)}
                            <span style="font-size:0.72rem; color:${on?'#34d399':'#ef4444'};
                                         font-weight:700; margin-left:0.4rem">
                                ${on ? (c.onLabel || 'VISIBLE') : (c.offLabel || 'HIDDEN')}
                            </span>
                        </div>
                        <div style="color:#94a3b8; font-size:0.78rem; margin-top:0.15rem">
                            ${safe(c.desc)}
                        </div>
                    </div>
                </label>`;
        };

        el.innerHTML = `
        <div class="sec-header">
            <h2>Map + notification visibility</h2>
            <div style="display:flex; gap:0.4rem">
                <button class="btn btn-ghost" onclick="visAll(true)">Show all</button>
                <button class="btn btn-ghost" onclick="visAll(false)">Hide all</button>
                <button class="btn btn-ghost" onclick="visResetDefaults()" title="Re-fetch admin defaults">↺ Defaults</button>
            </div>
        </div>
        <p style="color:#64748b;font-size:0.85rem;margin:0 0 0.8rem">
            <b>These are your personal device preferences</b> — every operator has
            their own settings, stored locally. Toggling a category here only
            affects what <i>you</i> see; other operators are not impacted. Two
            independent axes: <b>Map</b> controls what's drawn on the tactical map
            canvas; <b>Notifications</b> controls the toast cards (chat,
            fire-mission, alert, stream events).
        </p>

        <h3 style="color:#94a3b8;font-size:0.78rem;letter-spacing:0.15em;
                   text-transform:uppercase;margin:0.5rem 0 0.5rem">
            🗺  On the map
        </h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.6rem">
            ${MAP_CATEGORIES.map(c => card(c, cur[c.key])).join('')}
        </div>

        <h3 style="color:#94a3b8;font-size:0.78rem;letter-spacing:0.15em;
                   text-transform:uppercase;margin:1.2rem 0 0.5rem">
            🔔  Notification toasts
        </h3>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.6rem">
            ${NOTIF_CATEGORIES.map(c => card(c, cur[c.key])).join('')}
        </div>`;
    }

    window.visToggle = function(key, on, _cbox) {
        const cur = _readVisPrefs() || _allOnDefaults();
        cur[key] = !!on;
        _writeVisPrefs(cur);
        renderVisibility(document.getElementById('adm-main'));
    };

    window.visAll = function(on) {
        const cur = _allOnDefaults();
        for (const k of Object.keys(cur)) cur[k] = !!on;
        _writeVisPrefs(cur);
        renderVisibility(document.getElementById('adm-main'));
    };

    window.visResetDefaults = async function() {
        // Pull the admin-controlled server defaults again and overwrite local.
        const r = await api('/admin/map-visibility');
        if (!r.ok) { alert(`Could not fetch defaults (${r.status}).`); return; }
        const server = await r.json();
        const out = _allOnDefaults();
        for (const k of Object.keys(out)) if (k in server) out[k] = !!server[k];
        _writeVisPrefs(out);
        renderVisibility(document.getElementById('adm-main'));
    };

    // ── Base maps (MBTiles) ────────────────────────────────────────────────
    async function renderMaps(el) {
        const sources = await api('/map/sources').then(r => r.ok ? r.json() : []);
        const files = sources.filter(s => s.downloadable);   // exclude built-in OSM
        const rows = files.length
            ? files.map(s => `
                <tr>
                    <td style="font-family:monospace">${esc(s.title)}</td>
                    <td>${s.format.toUpperCase()}</td>
                    <td>z ${s.min_zoom}–${s.max_zoom}</td>
                    <td>${humanSize(s.size_bytes || 0)}</td>
                    <td style="text-align:right">
                        <button class="btn btn-ghost" onclick="deleteMap('${esc(s.name)}')">🗑 Delete</button>
                    </td>
                </tr>`).join('')
            : `<tr><td colspan="5" style="color:#475569;text-align:center;padding:1rem">
                   No MBTiles uploaded yet — drop a file below to add one.
               </td></tr>`;

        el.innerHTML = `
        <div class="sec-header">
            <h2>Base maps (${files.length})</h2>
        </div>
        <p style="color:#94a3b8;font-size:0.85rem;margin-top:-0.5rem">
            MBTiles archives served as base layers to the web Leaflet map and the Android client.
            Files are stored in <code>maps/</code> on the backend and read at request time —
            uploading or deleting takes effect immediately (no restart required).
        </p>
        <table class="adm-table" style="margin-bottom:1rem">
            <thead><tr>
                <th>Name</th><th>Format</th><th>Zoom</th><th>Size</th><th></th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>

        <div class="cfg-section">
            <h3>Upload MBTiles</h3>
            <div style="padding:0.75rem 1rem">
                <input type="file" id="map-upload-file" accept=".mbtiles"
                       style="display:block;margin-bottom:0.75rem;color:#cbd5e1"/>
                <div style="display:flex;align-items:center;gap:0.75rem">
                    <button class="btn btn-primary" id="map-upload-btn" onclick="uploadMap()">⬆ Upload</button>
                    <progress id="map-upload-progress" value="0" max="1"
                              style="flex:1;height:14px;display:none"></progress>
                    <span id="map-upload-status" style="color:#94a3b8;font-size:0.83rem"></span>
                </div>
            </div>
        </div>`;
    }

    window.deleteMap = async (name) => {
        if (!confirm(`Delete map "${name}"? This removes the .mbtiles file from disk.`)) return;
        const r = await api(`/map/sources/${encodeURIComponent(name)}`, { method: 'DELETE' });
        if (r.ok || r.status === 204) {
            renderMaps(document.getElementById('adm-main'));
        } else {
            alert(`Delete failed (${r.status}).`);
        }
    };

    // XHR (not fetch) so we can stream a 1+ GB upload with progress events.
    // fetch() doesn't yet expose upload progress reliably across browsers.
    window.uploadMap = () => {
        const input = document.getElementById('map-upload-file');
        const file  = input.files[0];
        if (!file) { alert('Pick a .mbtiles file first.'); return; }
        if (!file.name.toLowerCase().endsWith('.mbtiles')) {
            alert('File must end in .mbtiles');
            return;
        }
        const btn  = document.getElementById('map-upload-btn');
        const bar  = document.getElementById('map-upload-progress');
        const stat = document.getElementById('map-upload-status');
        const form = new FormData();
        form.append('file', file);

        const xhr = new XMLHttpRequest();
        xhr.open('POST', window.ARROW_BACKEND_URL + '/map/sources');
        xhr.setRequestHeader('Authorization', `Bearer ${token}`);
        xhr.upload.onprogress = e => {
            if (e.lengthComputable) {
                bar.value = e.loaded / e.total;
                stat.textContent = `${humanSize(e.loaded)} / ${humanSize(e.total)}`;
            }
        };
        xhr.onload = () => {
            btn.disabled = false;
            if (xhr.status >= 200 && xhr.status < 300) {
                stat.textContent = 'Validating…';
                bar.style.display = 'none';
                input.value = '';
                renderMaps(document.getElementById('adm-main'));
            } else {
                let msg = xhr.responseText;
                try { msg = JSON.parse(xhr.responseText).detail || msg; } catch (_) {}
                stat.textContent = `Upload failed (${xhr.status}): ${msg}`;
                stat.style.color = '#ef4444';
            }
        };
        xhr.onerror = () => {
            btn.disabled = false;
            stat.textContent = 'Network error during upload';
            stat.style.color = '#ef4444';
        };

        btn.disabled = true;
        bar.style.display = 'inline-block';
        bar.value = 0;
        stat.style.color = '#94a3b8';
        stat.textContent = `Uploading ${humanSize(file.size)}…`;
        xhr.send(form);
    };

    function humanSize(bytes) {
        if (!bytes) return '0 B';
        const u = ['B','KB','MB','GB','TB'];
        let i = 0, n = bytes;
        while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
        return `${n.toFixed(n < 10 ? 1 : 0)} ${u[i]}`;
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function populateTeamSelect(selectId, selected) {
        const sel = document.getElementById(selectId);
        sel.innerHTML = '<option value="">— unassigned —</option>' +
            teams.map(t => `<option value="${t.id}" ${t.id == selected ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
    }

    function groupBy(arr, fn) {
        return arr.reduce((acc, x) => { const k = fn(x); (acc[k] = acc[k]||[]).push(x); return acc; }, {});
    }

    function esc(s) {
        return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    window.openModal  = id => document.getElementById(id).classList.add('open');
    // ── Octopus server config ──────────────────────────────────────────────
    async function renderOctopus(el) {
        el.innerHTML = '<p style="color:#64748b">Loading…</p>';
        const r = await api('/admin/octopus');
        if (!r.ok) { el.innerHTML = '<p style="color:#ef4444">Failed to load Octopus config.</p>'; return; }
        const cfg = await r.json();

        el.innerHTML = `
        <div class="sec-header"><h2>⏺ Octopus Streaming Server</h2></div>
        <p style="color:#64748b;font-size:.85rem;margin:0 0 1.4rem">
            Configure the Octopus server URL and API key. Changes take effect immediately —
            no restart required. The API key is stored encrypted-at-rest in the database
            and is never returned in full after saving.
        </p>

        <div style="background:#0d1117;border:1px solid #2a3142;border-radius:8px;padding:1.4rem;max-width:540px">

            <div style="margin-bottom:1rem">
                <label style="display:block;font-size:.75rem;color:#94a3b8;margin-bottom:.35rem">
                    Server URL
                </label>
                <div style="display:flex;gap:.5rem">
                    <input id="oct-url-inp" type="url" value="${esc(cfg.url)}"
                           placeholder="http://192.168.0.240:8080"
                           style="flex:1;background:#161b25;border:1px solid #2a3142;border-radius:4px;
                                  padding:.45rem .6rem;color:#e2e8f0;font:inherit;font-size:.88rem"/>
                    <button onclick="octSaveUrl()"
                            style="background:#0ea5e9;color:#fff;border:0;border-radius:4px;
                                   padding:.4rem 1rem;font:inherit;cursor:pointer;white-space:nowrap">
                        Save URL
                    </button>
                </div>
                <div style="font-size:.72rem;color:#475569;margin-top:.3rem;display:flex;gap:.75rem;align-items:center">
                    Base URL only — do not include <code>/api/client/streams</code>
                    <span id="oct-url-status" style="font-size:.78rem"></span>
                </div>
            </div>

            <div style="margin-bottom:1.2rem">
                <label style="display:block;font-size:.75rem;color:#94a3b8;margin-bottom:.35rem">
                    API Key
                    <span id="oct-key-badge">${cfg.api_key_set
                        ? `<span style="color:#22c55e;margin-left:.5rem">● Set</span>
                           <span style="font-family:monospace;color:#64748b;margin-left:.5rem">${esc(cfg.api_key_preview)}</span>`
                        : '<span style="color:#ef4444;margin-left:.5rem">● Not set</span>'}</span>
                </label>
                <div style="display:flex;gap:.5rem">
                    <input id="oct-key-inp" type="password" placeholder="Enter new API key…"
                           autocomplete="new-password"
                           style="flex:1;background:#161b25;border:1px solid #2a3142;border-radius:4px;
                                  padding:.45rem .6rem;color:#e2e8f0;font:inherit;font-size:.88rem"/>
                    <button onclick="octSaveKey()"
                            style="background:#0ea5e9;color:#fff;border:0;border-radius:4px;
                                   padding:.4rem 1rem;font:inherit;cursor:pointer;white-space:nowrap">
                        Save Key
                    </button>
                </div>
                <div style="font-size:.72rem;color:#475569;margin-top:.3rem;display:flex;gap:.75rem;align-items:center">
                    Leave blank to keep the current key. The key is never shown in full after saving.
                    <span id="oct-key-status" style="font-size:.78rem"></span>
                </div>
            </div>

            <hr style="border:0;border-top:1px solid #2a3142;margin:.8rem 0 1rem"/>

            <div style="display:flex;align-items:center;gap:.75rem;flex-wrap:wrap">
                <button onclick="octTest()"
                        style="background:#7c3aed22;color:#a78bfa;border:1px solid #7c3aed44;
                               border-radius:4px;padding:.35rem .9rem;font:inherit;cursor:pointer">
                    ⚡ Test connection
                </button>
                <span id="oct-test-result" style="font-size:.82rem;color:#64748b"></span>
            </div>

            <div style="margin-top:1rem;font-size:.75rem;color:#475569">
                Source: <code>${esc(cfg.source)}</code>
                — DB values override config.xml without restart.
            </div>
        </div>`;

        function _octFeedback(id, ok, msg) {
            const el2 = document.getElementById(id);
            if (!el2) return;
            el2.textContent = msg;
            el2.style.color = ok ? '#22c55e' : '#ef4444';
            setTimeout(() => { el2.textContent = ''; }, 4000);
        }

        window.octSaveUrl = async function() {
            const url = document.getElementById('oct-url-inp').value.trim();
            if (!url) { _octFeedback('oct-url-status', false, 'URL cannot be empty.'); return; }
            const btn = document.querySelector('[onclick="octSaveUrl()"]');
            btn.disabled = true;
            const r2 = await api('/admin/octopus', {
                method: 'PUT',
                body: JSON.stringify({ url }),
            });
            btn.disabled = false;
            if (r2.ok) {
                const d = await r2.json();
                document.getElementById('oct-url-inp').value = d.url;
                _octFeedback('oct-url-status', true, '✓ Saved');
            } else {
                _octFeedback('oct-url-status', false, 'Save failed: ' + r2.status);
            }
        };

        window.octSaveKey = async function() {
            const key = document.getElementById('oct-key-inp').value.trim();
            if (!key) { _octFeedback('oct-key-status', false, 'Enter a key first.'); return; }
            const btn = document.querySelector('[onclick="octSaveKey()"]');
            btn.disabled = true;
            const r2 = await api('/admin/octopus', {
                method: 'PUT',
                body: JSON.stringify({ api_key: key }),
            });
            btn.disabled = false;
            if (r2.ok) {
                const d = await r2.json();
                document.getElementById('oct-key-inp').value = '';
                const badge = document.getElementById('oct-key-badge');
                if (badge) badge.innerHTML =
                    '<span style="color:#22c55e;margin-left:.5rem">● Set</span>' +
                    `<span style="font-family:monospace;color:#64748b;margin-left:.5rem">${esc(d.api_key_preview)}</span>`;
                _octFeedback('oct-key-status', true, '✓ Key saved');
            } else {
                _octFeedback('oct-key-status', false, 'Save failed: ' + r2.status);
            }
        };

        window.octTest = async function() {
            const res = document.getElementById('oct-test-result');
            res.style.color = '#64748b'; res.textContent = 'Testing…';
            const r2 = await api('/octopus/streams');
            if (r2.ok) {
                const list = await r2.json();
                res.style.color = '#22c55e';
                res.textContent = `Connected — ${list.length} stream${list.length !== 1 ? 's' : ''} available`;
            } else {
                res.style.color = '#ef4444';
                res.textContent = `Failed (HTTP ${r2.status})`;
            }
        };
    }

    window.closeModal = id => document.getElementById(id).classList.remove('open');

    // Click-outside to close modals
    document.querySelectorAll('.modal-bg').forEach(bg =>
        bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); }));

    // Boot
    loadAll().then(() => renderOverview(document.getElementById('adm-main')));
})();
</script>
{% endblock %}
