{% extends "base.html" %}
{% block title %}Personnel — Arrow{% endblock %}
{% block head %}
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
/* ── Layout ───────────────────────────────────────────────────────────────── */
main { padding: 0; }
.org-shell { display:grid; grid-template-columns:360px 1fr; height:calc(100vh - 60px); }
.org-panel { overflow-y:auto; border-right:1px solid #2a3142; display:flex; flex-direction:column; }
.org-panel:last-child { border-right:0; }
.panel-hdr { display:flex; align-items:center; gap:.5rem; padding:.85rem 1.1rem .6rem;
             border-bottom:1px solid #2a3142; flex-shrink:0; }
.panel-hdr h2 { margin:0; font-size:.95rem; flex:1; }
.panel-body  { flex:1; overflow-y:auto; padding:.8rem 1rem; }

/* ── Buttons ──────────────────────────────────────────────────────────────── */
.btn         { padding:.3rem .75rem; border:0; border-radius:5px; font:inherit; font-size:.8rem; cursor:pointer; }
.btn-primary { background:#34d399; color:#0d1117; font-weight:600; }
.btn-primary:hover { background:#6ee7b7; }
.btn-danger  { background:#ef4444; color:#fff; }
.btn-danger:hover  { background:#f87171; }
.btn-ghost   { background:#1f2937; color:#94a3b8; border:1px solid #2a3142; }
.btn-ghost:hover   { border-color:#475569; color:#e2e8f0; }
.btn-sm      { padding:.15rem .4rem; font-size:.75rem; }
.btn-icon    { background:none; border:0; cursor:pointer; color:#475569; font-size:.8rem;
               padding:.1rem .25rem; line-height:1; border-radius:3px; }
.btn-icon:hover { color:#94a3b8; background:#1f2937; }

/* ── Hierarchy tree ───────────────────────────────────────────────────────── */
.tree-node   { }
.h-children  { padding-left:1.1rem; }
.h-row       { display:flex; align-items:center; gap:.35rem; padding:.22rem .3rem;
               border-radius:4px; min-height:26px; }
.h-row:hover { background:#1a2233; }
.h-toggle    { color:#34d399; font-size:.65rem; width:14px; flex-shrink:0; cursor:pointer;
               font-family:monospace; }
.h-icon      { font-size:.78rem; flex-shrink:0; }
.h-name      { flex:1; font-size:.83rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:default; }
.h-name-input { flex:1; font-size:.83rem; background:#0d1117; color:#e2e8f0;
                border:1px solid #34d399; border-radius:3px; padding:0 .3rem; min-width:0; }
.h-meta      { font-size:.68rem; color:#475569; white-space:nowrap; flex-shrink:0; }
.h-acts      { display:none; gap:.1rem; align-items:center; flex-shrink:0; }
.h-row:hover .h-acts { display:flex; }

/* Team drop zone */
.team-node   { border-radius:5px; border:1px dashed transparent; transition:background .12s,border-color .12s; }
.team-node.dragover { background:#1e3a2f; border-color:#34d399; }

/* Operator chips inside teams */
.op-chips    { padding:.1rem 0 .15rem 1.5rem; display:flex; flex-direction:column; gap:1px; }
.op-chip     { display:flex; align-items:center; gap:.3rem; padding:.1rem .3rem; border-radius:3px;
               font-size:.76rem; color:#94a3b8; cursor:grab; user-select:none; }
.op-chip:hover { background:#1a2233; }
.op-chip.dragging { opacity:.35; }
.dot-on  { width:6px; height:6px; border-radius:50%; background:#22c55e; flex-shrink:0; }
.dot-off { width:6px; height:6px; border-radius:50%; background:#475569; flex-shrink:0; }

/* ── Operators table (right panel) ────────────────────────────────────────── */
.op-toolbar  { display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem; }
.op-search   { background:#0d1117; color:#e2e8f0; border:1px solid #2a3142;
               border-radius:5px; padding:.3rem .6rem; font:inherit; font-size:.82rem; flex:1; }
.op-search:focus { outline:none; border-color:#34d399; }
.warn-banner { background:#78350f22; border:1px solid #d97706; border-radius:6px;
               padding:.55rem .85rem; margin-bottom:.7rem; color:#fde68a; font-size:.8rem; }
.adm-table   { width:100%; border-collapse:collapse; font-size:.82rem; }
.adm-table th { text-align:left; color:#64748b; font-size:.7rem; text-transform:uppercase;
                letter-spacing:.08em; padding:.4rem .6rem; border-bottom:1px solid #2a3142;
                white-space:nowrap; }
.adm-table td { padding:.45rem .6rem; border-bottom:1px solid #1e2736; vertical-align:middle; }
.adm-table tr:hover td { background:#1a1f29; }
.adm-table tr.dragging td { opacity:.35; }
.drag-hdl    { color:#2a3142; font-size:.9rem; cursor:grab; }
.adm-table tr:hover .drag-hdl { color:#475569; }
.badge       { display:inline-block; font-size:.65rem; font-weight:700; padding:1px 5px;
               border-radius:3px; white-space:nowrap; }
.badge-adm   { background:#7c2d12; color:#fed7aa; }
.badge-bc    { background:#1e40af; color:#bfdbfe; }
.badge-op    { background:#1e293b; color:#94a3b8; }
.badge-ok    { background:#166534; color:#86efac; }
.badge-warn  { background:#78350f; color:#fde68a; }
.acts-cell   { white-space:nowrap; }

/* ── Modals ───────────────────────────────────────────────────────────────── */
.modal-bg    { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
               z-index:1000; align-items:center; justify-content:center; }
.modal-bg.open { display:flex; }
.modal       { background:#161b25; border:1px solid #2a3142; border-radius:10px;
               padding:1.4rem; width:460px; max-width:96vw; max-height:90vh; overflow-y:auto; }
.modal h3    { margin:0 0 1rem; font-size:.98rem; }
.field       { display:flex; flex-direction:column; gap:.22rem; margin-bottom:.8rem; }
.field label { font-size:.75rem; color:#94a3b8; }
.field input, .field select {
               background:#0d1117; color:#e2e8f0; border:1px solid #2a3142;
               border-radius:5px; padding:.38rem .55rem; font:inherit; font-size:.85rem; }
.field input:focus, .field select:focus { outline:none; border-color:#34d399; }
.field .hint { font-size:.7rem; color:#475569; }
.modal-footer { display:flex; gap:.5rem; justify-content:flex-end; margin-top:1rem; }
.form-error  { color:#ef4444; font-size:.77rem; margin-top:.3rem; }
.preview-tbl { width:100%; border-collapse:collapse; font-size:.76rem; margin-top:.6rem; }
.preview-tbl th { text-align:left; color:#64748b; padding:.25rem .4rem;
                  border-bottom:1px solid #2a3142; white-space:nowrap; }
.preview-tbl td { padding:.2rem .4rem; border-bottom:1px solid #1e2736; }
.import-ok   { background:#166534; color:#86efac; border-radius:5px; padding:.4rem .7rem;
               font-size:.8rem; margin-top:.5rem; }
.import-err  { background:#7f1d1d; color:#fca5a5; border-radius:5px; padding:.4rem .7rem;
               font-size:.8rem; margin-top:.5rem; }
</style>
{% endblock %}

{% block content %}
<div class="org-shell">

  <!-- ═══════════ LEFT — HIERARCHY TREE ══════════════════════════════════ -->
  <div class="org-panel">
    <div class="panel-hdr">
      <h2>🏛 Hierarchy</h2>
      <button class="btn btn-ghost btn-sm" onclick="openImportModal('hierarchy')" title="Import Excel">⬆</button>
      <button class="btn btn-ghost btn-sm" onclick="downloadTemplate('hierarchy')" title="Download template">⬇</button>
      <button class="btn btn-primary btn-sm" onclick="addNode('company',null,'')">+ Company</button>
    </div>
    <div class="panel-body" id="htree-root"></div>
  </div>

  <!-- ═══════════ RIGHT — OPERATORS ══════════════════════════════════════ -->
  <div class="org-panel">
    <div class="panel-hdr">
      <h2>👥 Operators</h2>
      <button class="btn btn-ghost btn-sm" onclick="openImportModal('operators')" title="Import Excel">⬆</button>
      <button class="btn btn-ghost btn-sm" onclick="downloadTemplate('operators')" title="Download template">⬇</button>
      <button class="btn btn-primary btn-sm" onclick="openCreateOp()">+ New</button>
    </div>
    <div class="panel-body">
      <div class="op-toolbar">
        <input class="op-search" id="op-search" placeholder="Search callsign / rank…" oninput="renderOps()"/>
      </div>
      <div id="ops-warn"></div>
      <table class="adm-table">
        <thead><tr>
          <th style="width:20px"></th>
          <th style="width:18px"></th>
          <th>Callsign</th>
          <th>Rank</th>
          <th>Role</th>
          <th>Team</th>
          <th>Status</th>
          <th>Last seen</th>
          <th></th>
        </tr></thead>
        <tbody id="ops-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- ── Create / Edit Operator ────────────────────────────────────────────── -->
<div class="modal-bg" id="modal-op">
  <div class="modal">
    <h3 id="modal-op-title">Operator</h3>
    <input type="hidden" id="op-id"/>
    <div class="field" id="field-callsign">
      <label>Callsign *</label>
      <input id="op-callsign" placeholder="e.g. BRAVO-42"/>
    </div>
    <div class="field">
      <label id="lbl-pwd">Password *</label>
      <input id="op-password" type="password" placeholder="min 8 chars"/>
      <span class="hint" id="hint-pwd"></span>
    </div>
    <div class="field">
      <label>Rank</label>
      <select id="op-rank">
        {% for r in ['OR-1','OR-2','OR-3','OR-4','OR-5','OR-6','OR-7','OR-8','OF-1','OF-2','OF-3','OF-4','OF-5'] %}
        <option>{{ r }}</option>{% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Role</label>
      <select id="op-role">
        <option value="OPERATOR">OPERATOR</option>
        <option value="BATTLE_CAPTAIN">BATTLE_CAPTAIN</option>
        <option value="ADMIN">ADMIN</option>
      </select>
    </div>
    <div class="field">
      <label>Team</label>
      <select id="op-team"><option value="">— unassigned —</option></select>
    </div>
    <div id="op-err" class="form-error"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-op')">Cancel</button>
      <button class="btn btn-primary" onclick="saveOp()">Save</button>
    </div>
  </div>
</div>

<!-- ── Add hierarchy node ────────────────────────────────────────────────── -->
<div class="modal-bg" id="modal-node">
  <div class="modal">
    <h3 id="modal-node-title">Add</h3>
    <div class="field"><label>Name *</label><input id="node-name" placeholder="Name"/></div>
    <div id="node-err" class="form-error"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-node')">Cancel</button>
      <button class="btn btn-primary" onclick="saveNode()">Add</button>
    </div>
  </div>
</div>

<!-- ── Import ────────────────────────────────────────────────────────────── -->
<div class="modal-bg" id="modal-import">
  <div class="modal" style="width:560px">
    <h3 id="import-title">Import</h3>
    <div class="field">
      <label>Excel / CSV file *</label>
      <input type="file" id="import-file" accept=".xlsx,.xls,.csv"
             style="color:#e2e8f0" onchange="previewImport()"/>
    </div>
    <div id="import-preview"></div>
    <div id="import-status"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('modal-import')">Cancel</button>
      <button class="btn btn-primary" id="import-btn" style="display:none" onclick="confirmImport()">Import</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const token = localStorage.getItem('arrow_token');
  if (!token) { location.href = '/login?next=' + encodeURIComponent(location.pathname); return; }
  const role = localStorage.getItem('arrow_role') || '';
  if (role !== 'ADMIN') {
    document.getElementById('htree-root').innerHTML =
      '<p style="color:#ef4444;padding:1rem">ADMIN role required.</p>';
    return;
  }

  const missionId = () => localStorage.getItem('arrow_mission_id') || '';
  function apiHdr() {
    const h = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
    const mid = missionId();
    if (mid) h['X-Mission-ID'] = mid;
    return h;
  }
  const api = (p, o = {}) =>
    fetch(window.ARROW_BACKEND_URL + p, { ...o, headers: { ...apiHdr(), ...(o.headers || {}) } });

  // ── State ──────────────────────────────────────────────────────────────────
  let companies = [], platoons = [], sections = [], teams = [], operators = [], missions = [];

  async function loadAll() {
    [companies, platoons, sections, teams, operators, missions] = await Promise.all([
      api('/companies').then(r => r.ok ? r.json() : []),
      api('/platoons').then(r  => r.ok ? r.json() : []),
      api('/sections').then(r  => r.ok ? r.json() : []),
      api('/teams').then(r     => r.ok ? r.json() : []),
      api('/operators').then(r => r.ok ? r.json() : []),
      api('/missions').then(r  => r.ok ? r.json() : []),
    ]);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function openModal(id)  { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  function groupBy(arr, fn) {
    const m = {};
    for (const x of arr) {
      const k = fn(x);
      if (k == null) continue;
      (m[k] = m[k] || []).push(x);
    }
    return m;
  }

  // ── Hierarchy tree ─────────────────────────────────────────────────────────
  function renderTree() {
    const root = document.getElementById('htree-root');
    if (!companies.length) {
      root.innerHTML = '<p style="color:#475569;font-size:.83rem">No companies yet — click <strong>+ Company</strong> to start.</p>';
      return;
    }

    const pltByCo  = groupBy(platoons, p => p.company_id);
    const secByPlt = groupBy(sections, s => s.platoon_id);
    const tmBySec  = groupBy(teams,    t => t.section_id);
    const opByTeam = groupBy(operators.filter(o => o.team_id), o => o.team_id);

    root.innerHTML = companies.map(co =>
      buildCoNode(co, pltByCo, secByPlt, tmBySec, opByTeam)
    ).join('');

    bindTreeDnD();
  }

  function toggler(id) {
    return `onclick="toggleChildren('${id}')"`;
  }

  window.toggleChildren = function(id) {
    const ch = document.getElementById(id);
    if (!ch) return;
    const btn = document.querySelector(`[data-toggle="${id}"]`);
    const hidden = ch.style.display === 'none';
    ch.style.display = hidden ? '' : 'none';
    if (btn) btn.textContent = hidden ? '▾' : '▶';
  };

  function buildCoNode(co, pltByCo, secByPlt, tmBySec, opByTeam) {
    const plts = pltByCo[co.id] || [];
    let opCount = 0;
    for (const p of plts)
      for (const s of secByPlt[p.id] || [])
        for (const t of tmBySec[s.id] || [])
          opCount += (opByTeam[t.id] || []).length;

    const childId = `co-ch-${co.id}`;
    return `
<div class="tree-node">
  <div class="h-row">
    <button class="h-toggle btn-icon" data-toggle="${childId}" ${toggler(childId)}>▾</button>
    <span class="h-icon">🏢</span>
    <span class="h-name" id="nm-co-${co.id}">${esc(co.name)}</span>
    <span class="h-meta">${opCount} ops</span>
    <span class="h-acts">
      <button class="btn-icon" onclick="addNode('platoon',${co.id},'${esc(co.name)}')">+plt</button>
      <button class="btn-icon" onclick="startRename('co',${co.id})">✏</button>
      <button class="btn-icon" style="color:#ef4444" onclick="delNode('companies',${co.id},'${esc(co.name)}')">×</button>
    </span>
  </div>
  <div class="h-children" id="${childId}">
    ${plts.map(p => buildPltNode(p, secByPlt, tmBySec, opByTeam)).join('')}
  </div>
</div>`;
  }

  function buildPltNode(plt, secByPlt, tmBySec, opByTeam) {
    const secs = secByPlt[plt.id] || [];
    const childId = `plt-ch-${plt.id}`;
    return `
<div class="tree-node">
  <div class="h-row">
    <button class="h-toggle btn-icon" data-toggle="${childId}" ${toggler(childId)}>▾</button>
    <span class="h-icon">📋</span>
    <span class="h-name" id="nm-plt-${plt.id}">${esc(plt.name)}</span>
    <span class="h-acts">
      <button class="btn-icon" onclick="addNode('section',${plt.id},'${esc(plt.name)}')">+sec</button>
      <button class="btn-icon" onclick="startRename('plt',${plt.id})">✏</button>
      <button class="btn-icon" style="color:#ef4444" onclick="delNode('platoons',${plt.id},'${esc(plt.name)}')">×</button>
    </span>
  </div>
  <div class="h-children" id="${childId}">
    ${secs.map(s => buildSecNode(s, tmBySec, opByTeam)).join('')}
  </div>
</div>`;
  }

  function buildSecNode(sec, tmBySec, opByTeam) {
    const tms = tmBySec[sec.id] || [];
    const childId = `sec-ch-${sec.id}`;
    return `
<div class="tree-node">
  <div class="h-row">
    <button class="h-toggle btn-icon" data-toggle="${childId}" ${toggler(childId)}>▾</button>
    <span class="h-icon">📁</span>
    <span class="h-name" id="nm-sec-${sec.id}">${esc(sec.name)}</span>
    <span class="h-acts">
      <button class="btn-icon" onclick="addNode('team',${sec.id},'${esc(sec.name)}')">+team</button>
      <button class="btn-icon" onclick="startRename('sec',${sec.id})">✏</button>
      <button class="btn-icon" style="color:#ef4444" onclick="delNode('sections',${sec.id},'${esc(sec.name)}')">×</button>
    </span>
  </div>
  <div class="h-children" id="${childId}">
    ${tms.map(t => buildTeamNode(t, opByTeam)).join('')}
  </div>
</div>`;
  }

  function buildTeamNode(t, opByTeam) {
    const ops = opByTeam[t.id] || [];
    const chips = ops.map(op => `
      <div class="op-chip" draggable="true" data-op-id="${op.id}">
        <span class="${op.online ? 'dot-on' : 'dot-off'}"></span>
        <span>${esc(op.callsign)}</span>
        <span style="color:#475569;font-size:.7rem">${esc(op.rank)}</span>
      </div>`).join('');

    return `
<div class="tree-node team-node" data-team-id="${t.id}">
  <div class="h-row">
    <span style="width:14px;flex-shrink:0"></span>
    <span class="h-icon">👥</span>
    <span class="h-name" id="nm-team-${t.id}">${esc(t.name)}</span>
    <span class="h-meta">${ops.length}</span>
    <span class="h-acts">
      <button class="btn-icon" onclick="startRename('team',${t.id})">✏</button>
      <button class="btn-icon" style="color:#ef4444" onclick="delNode('teams',${t.id},'${esc(t.name)}')">×</button>
    </span>
  </div>
  <div class="op-chips">${chips}</div>
</div>`;
  }

  // ── Tree drag-and-drop ─────────────────────────────────────────────────────
  function bindTreeDnD() {
    document.querySelectorAll('.op-chip[data-op-id]').forEach(chip => {
      chip.addEventListener('dragstart', e => {
        e.dataTransfer.setData('opId', chip.dataset.opId);
        e.stopPropagation();
        chip.classList.add('dragging');
      });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
    });

    document.querySelectorAll('.team-node[data-team-id]').forEach(zone => {
      zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('dragover'); });
      zone.addEventListener('dragleave', e => {
        if (!zone.contains(e.relatedTarget)) zone.classList.remove('dragover');
      });
      zone.addEventListener('drop', async e => {
        e.preventDefault(); zone.classList.remove('dragover');
        const opId = e.dataTransfer.getData('opId');
        if (!opId) return;
        await api(`/operators/${opId}`, {
          method: 'PATCH',
          body: JSON.stringify({ team_id: parseInt(zone.dataset.teamId) }),
        });
        await loadAll(); renderTree(); renderOps();
      });
    });
  }

  // ── Inline rename ──────────────────────────────────────────────────────────
  const kindToPath = { co:'companies', plt:'platoons', sec:'sections', team:'teams' };

  window.startRename = function(kind, id) {
    const span = document.getElementById(`nm-${kind}-${id}`);
    if (!span) return;
    const original = span.textContent;
    const inp = document.createElement('input');
    inp.className = 'h-name-input';
    inp.value = original;
    span.replaceWith(inp);
    inp.focus(); inp.select();

    async function commit() {
      const val = inp.value.trim();
      if (!val || val === original) { inp.replaceWith(span); return; }
      const r = await api(`/${kindToPath[kind]}/${id}`, {
        method: 'PATCH', body: JSON.stringify({ name: val }),
      });
      if (r.ok) { await loadAll(); renderTree(); }
      else       { inp.replaceWith(span); }
    }
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      if (e.key === 'Escape') inp.replaceWith(span);
    });
    inp.addEventListener('blur', commit);
  };

  // ── Add / delete nodes ─────────────────────────────────────────────────────
  let _ntype = '', _npid = null;

  window.addNode = function(type, parentId, parentName) {
    _ntype = type; _npid = parentId;
    const titles = {
      company: 'Add Company',
      platoon: `Add Platoon under ${parentName}`,
      section: `Add Section under ${parentName}`,
      team:    `Add Team under ${parentName}`,
    };
    document.getElementById('modal-node-title').textContent = titles[type];
    document.getElementById('node-name').value = '';
    document.getElementById('node-err').textContent = '';
    openModal('modal-node');
  };

  window.saveNode = async function() {
    const name  = document.getElementById('node-name').value.trim();
    const errEl = document.getElementById('node-err');
    if (!name) { errEl.textContent = 'Name is required.'; return; }
    const bodyMap = {
      company: { name },
      platoon: { name, company_id: _npid },
      section: { name, platoon_id: _npid },
      team:    { name, section_id: _npid },
    };
    const pathMap = { company:'companies', platoon:'platoons', section:'sections', team:'teams' };
    const r = await api(`/${pathMap[_ntype]}`, { method:'POST', body: JSON.stringify(bodyMap[_ntype]) });
    if (!r.ok) { errEl.textContent = `Failed (${r.status}): ${await r.text()}`; return; }
    closeModal('modal-node');
    await loadAll(); renderTree(); renderOps();
  };

  window.delNode = async function(path, id, name) {
    if (!confirm(`Delete "${name}"?\nAll children will be deleted too.`)) return;
    await api(`/${path}/${id}`, { method:'DELETE' });
    await loadAll(); renderTree(); renderOps();
  };

  // ── Operators table ────────────────────────────────────────────────────────
  function renderOps() {
    const q       = (document.getElementById('op-search').value || '').toLowerCase();
    const teamPath = buildTeamPaths();

    const filtered = q
      ? operators.filter(o =>
          o.callsign.toLowerCase().includes(q) ||
          (o.rank || '').toLowerCase().includes(q))
      : operators;

    const unassigned = filtered.filter(o => !o.team_id);
    const warnEl = document.getElementById('ops-warn');
    warnEl.innerHTML = unassigned.length
      ? `<div class="warn-banner">⚠️ <strong>${unassigned.length} unassigned operator${unassigned.length > 1 ? 's' : ''}</strong>:
         ${unassigned.map(o => `<code>${esc(o.callsign)}</code>`).join(', ')} — drag to a team or edit.</div>`
      : '';

    const tbody = document.getElementById('ops-tbody');
    tbody.innerHTML = filtered.map(op => {
      const badge = op.role === 'ADMIN' ? 'badge-adm'
                  : op.role === 'BATTLE_CAPTAIN' ? 'badge-bc' : 'badge-op';
      const teamLabel = op.team_id ? (teamPath[op.team_id] || `#${op.team_id}`) : '—';
      const ts = (op.last_seen || '').slice(0, 16).replace('T', ' ');
      const opJson = esc(JSON.stringify(op));
      return `<tr draggable="true" data-op-id="${op.id}">
        <td><span class="drag-hdl" title="Drag to assign to a team">⋮⋮</span></td>
        <td><span class="${op.online ? 'dot-on' : 'dot-off'}"></span></td>
        <td style="font-weight:600">${esc(op.callsign)}</td>
        <td><code style="font-size:.75rem">${esc(op.rank)}</code></td>
        <td><span class="badge ${badge}">${op.role === 'BATTLE_CAPTAIN' ? 'BC' : op.role}</span></td>
        <td style="color:#94a3b8;font-size:.78rem">${esc(teamLabel)}</td>
        <td><span class="badge ${op.online ? 'badge-ok' : 'badge-warn'}">${op.online ? 'ONLINE' : 'OFFLINE'}</span></td>
        <td style="color:#64748b;font-size:.75rem">${ts}</td>
        <td class="acts-cell">
          <button class="btn btn-ghost btn-sm" onclick="openEditOp('${opJson}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="delOp(${op.id},'${esc(op.callsign)}')">Del</button>
        </td>
      </tr>`;
    }).join('');

    bindTableDnD();
  }

  function buildTeamPaths() {
    const coMap  = Object.fromEntries(companies.map(c => [c.id, c.name]));
    const pltMap = Object.fromEntries(platoons.map(p => [p.id, p]));
    const secMap = Object.fromEntries(sections.map(s => [s.id, s]));
    const result = {};
    for (const t of teams) {
      const sec = secMap[t.section_id];
      const plt = sec ? pltMap[sec.platoon_id] : null;
      const co  = plt ? coMap[plt.company_id]  : null;
      result[t.id] = [co, plt?.name, sec?.name, t.name].filter(Boolean).join(' › ');
    }
    return result;
  }

  function bindTableDnD() {
    document.querySelectorAll('#ops-tbody tr[data-op-id]').forEach(row => {
      row.addEventListener('dragstart', e => {
        e.dataTransfer.setData('opId', row.dataset.opId);
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
    });
  }

  // ── Operator CRUD ──────────────────────────────────────────────────────────
  window.openCreateOp = function() {
    document.getElementById('op-id').value = '';
    document.getElementById('modal-op-title').textContent = '➕ New Operator';
    document.getElementById('field-callsign').style.display = '';
    document.getElementById('op-callsign').value = '';
    document.getElementById('op-password').value = '';
    document.getElementById('lbl-pwd').textContent = 'Password *';
    document.getElementById('hint-pwd').textContent = '';
    document.getElementById('op-rank').value = 'OR-3';
    document.getElementById('op-role').value = 'OPERATOR';
    document.getElementById('op-err').textContent = '';
    populateTeamSelect(null);
    openModal('modal-op');
  };

  window.openEditOp = function(opJson) {
    const op = JSON.parse(opJson);
    document.getElementById('op-id').value = op.id;
    document.getElementById('modal-op-title').textContent = `✏️ Edit: ${op.callsign}`;
    document.getElementById('field-callsign').style.display = 'none';
    document.getElementById('op-password').value = '';
    document.getElementById('lbl-pwd').textContent = 'New password';
    document.getElementById('hint-pwd').textContent = 'Leave blank to keep current password.';
    document.getElementById('op-rank').value = op.rank;
    document.getElementById('op-role').value = op.role;
    document.getElementById('op-err').textContent = '';
    populateTeamSelect(op.team_id);
    openModal('modal-op');
  };

  function populateTeamSelect(selectedId) {
    document.getElementById('op-team').innerHTML =
      '<option value="">— unassigned —</option>' +
      teams.map(t => `<option value="${t.id}" ${t.id == selectedId ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  }

  window.saveOp = async function() {
    const id     = document.getElementById('op-id').value;
    const pwd    = document.getElementById('op-password').value;
    const errEl  = document.getElementById('op-err');
    const tmVal  = document.getElementById('op-team').value;
    const body   = {
      rank:    document.getElementById('op-rank').value,
      role:    document.getElementById('op-role').value,
      team_id: tmVal ? parseInt(tmVal) : null,
    };
    errEl.textContent = '';

    if (!id) {
      const cs = document.getElementById('op-callsign').value.trim();
      if (!cs || !pwd) { errEl.textContent = 'Callsign and password required.'; return; }
      const r = await api('/auth/register/admin', {
        method: 'POST',
        body: JSON.stringify({ callsign: cs, password: pwd, rank: body.rank, role: body.role, team_id: body.team_id }),
      });
      if (!r.ok) { errEl.textContent = `Error ${r.status}: ${await r.text()}`; return; }
    } else {
      const r = await api(`/operators/${id}`, { method:'PATCH', body: JSON.stringify(body) });
      if (!r.ok) { errEl.textContent = `Save failed (${r.status}).`; return; }
      if (pwd) {
        const rp = await api(`/operators/${id}/set-password`, { method:'POST', body: JSON.stringify({ password: pwd }) });
        if (!rp.ok) { errEl.textContent = `Password change failed (${rp.status}).`; return; }
      }
    }
    closeModal('modal-op');
    await loadAll(); renderTree(); renderOps();
  };

  window.delOp = async function(id, callsign) {
    if (!confirm(`Delete operator "${callsign}"? Cannot be undone.`)) return;
    await api(`/operators/${id}`, { method:'DELETE' });
    await loadAll(); renderTree(); renderOps();
  };

  // ── Excel import ───────────────────────────────────────────────────────────
  let _impKind = 'hierarchy', _impRows = [];

  window.openImportModal = function(kind) {
    _impKind = kind; _impRows = [];
    document.getElementById('import-title').textContent =
      kind === 'hierarchy' ? '⬆ Import Hierarchy' : '⬆ Import Operators';
    document.getElementById('import-file').value = '';
    document.getElementById('import-preview').innerHTML = '';
    document.getElementById('import-status').innerHTML = '';
    document.getElementById('import-btn').style.display = 'none';
    openModal('modal-import');
  };

  window.previewImport = function() {
    const file = document.getElementById('import-file').files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const wb  = XLSX.read(e.target.result, { type: 'binary' });
      const ws  = wb.Sheets[wb.SheetNames[0]];
      _impRows  = XLSX.utils.sheet_to_json(ws, { defval: '' });
      if (!_impRows.length) {
        document.getElementById('import-preview').innerHTML =
          '<p style="color:#f59e0b;font-size:.8rem">No rows found.</p>';
        return;
      }
      const cols = Object.keys(_impRows[0]);
      const rows = _impRows.slice(0, 6);
      document.getElementById('import-preview').innerHTML = `
        <table class="preview-tbl">
          <thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
          <tbody>${rows.map(r =>
            `<tr>${cols.map(c => `<td>${esc(r[c])}</td>`).join('')}</tr>`
          ).join('')}</tbody>
        </table>
        <p style="font-size:.72rem;color:#64748b;margin-top:.35rem">
          ${_impRows.length} rows total${_impRows.length > 6 ? ' (showing first 6)' : ''}.
        </p>`;
      document.getElementById('import-btn').style.display = '';
      document.getElementById('import-status').innerHTML = '';
    };
    reader.readAsBinaryString(file);
  };

  window.confirmImport = async function() {
    const statusEl = document.getElementById('import-status');
    const btn = document.getElementById('import-btn');
    statusEl.innerHTML = '<span style="color:#94a3b8;font-size:.8rem">Importing…</span>';
    btn.disabled = true;

    let path, body;
    if (_impKind === 'hierarchy') {
      const rows = _impRows.map(r => ({
        company: String(r.Company || r.company || '').trim(),
        platoon: String(r.Platoon || r.platoon || '').trim(),
        section: String(r.Section || r.section || '').trim(),
        team:    String(r.Team    || r.team    || '').trim(),
      })).filter(r => r.company && r.platoon && r.section && r.team);
      path = '/import/hierarchy'; body = { rows };
    } else {
      const rows = _impRows.map(r => ({
        callsign: String(r.Callsign || r.callsign || '').trim(),
        password: String(r.Password || r.password || 'changeme').trim(),
        rank:     String(r.Rank     || r.rank     || 'OR-1').trim(),
        role:     String(r.Role     || r.role     || 'OPERATOR').trim().toUpperCase(),
        team:     String(r.Team     || r.team     || '').trim() || null,
      })).filter(r => r.callsign);
      path = '/import/operators'; body = { rows };
    }

    const r = await api(path, { method:'POST', body: JSON.stringify(body) });
    btn.disabled = false;
    if (r.ok) {
      const res = await r.json();
      const msg = _impKind === 'hierarchy'
        ? `✓ ${res.created} nodes created, ${res.total_rows} rows processed.`
        : `✓ ${res.created} created, ${res.updated} updated.`;
      statusEl.innerHTML = `<div class="import-ok">${msg}</div>`;
      await loadAll(); renderTree(); renderOps();
    } else {
      statusEl.innerHTML = `<div class="import-err">Error ${r.status}: ${esc(await r.text())}</div>`;
    }
  };

  window.downloadTemplate = function(kind) {
    const [headers, ...rows] = kind === 'hierarchy' ? [
      ['Company','Platoon','Section','Team'],
      ['Alpha Company','1st Platoon','HQ Section','Command Team'],
      ['Alpha Company','1st Platoon','Assault Section','Assault Team 1'],
      ['Alpha Company','2nd Platoon','Support Section','Weapons Team'],
    ] : [
      ['Callsign','Password','Rank','Role','Team'],
      ['ALPHA-6','changeme','OF-2','BATTLE_CAPTAIN','Command Team'],
      ['BRAVO-1','changeme','OR-5','OPERATOR','Assault Team 1'],
      ['CHARLIE-3','changeme','OR-3','OPERATOR',''],
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([headers, ...rows]), 'Import');
    XLSX.writeFile(wb, `arrow_${kind}_template.xlsx`);
  };

  // ── Init ───────────────────────────────────────────────────────────────────
  loadAll().then(() => { renderTree(); renderOps(); });

})();
</script>
{% endblock %}
