<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Arrow — Soldier System{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block head %}{% endblock %}
<style>
/* ── Floating stream windows (multi-window) ───────────────────────────────── */
.stream-float-win {
    position: fixed;
    bottom: 80px; right: 20px;
    width: 360px; height: 230px;
    min-width: 220px; min-height: 150px;
    background: #0d1117;
    border: 1px solid #7c3aed;
    border-radius: 8px;
    box-shadow: 0 6px 28px rgba(0,0,0,.85);
    overflow: hidden;
    resize: both;
    display: flex;
    flex-direction: column;
}
.stream-float-win.minimised { height: 32px !important; resize: none; }
.sf-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    background: #1a0d30;
    cursor: move;
    user-select: none;
    flex-shrink: 0;
}
.sf-bar .sf-live  { width:8px;height:8px;border-radius:50%;background:#22c55e;
                    box-shadow:0 0 6px #22c55e;animation:sflive 1s infinite;flex-shrink:0; }
@keyframes sflive { 0%,100%{opacity:1} 50%{opacity:.3} }
.sf-bar .sf-call  { color:#a78bfa;font-weight:700;font-size:.82rem;flex:1; }
.sf-bar .sf-fps   { font-size:.7rem;font-family:monospace;color:#475569; }
.sf-btn { background:none;border:0;color:#64748b;cursor:pointer;
          font-size:.85rem;padding:0 3px;line-height:1; }
.sf-btn:hover { color:#e2e8f0; }
.sf-video-wrap { flex:1;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden; }
.sf-img { max-width:100%;max-height:100%;object-fit:contain;display:block; }
.sf-no-feed { color:#475569;font-size:.8rem;text-align:center; }
</style>
</head>

<script>
    (function () {
        const token = localStorage.getItem('arrow_token');
        const role  = (localStorage.getItem('arrow_role') || '').toUpperCase();
        const user  = document.getElementById('nav-user');
        const auth  = document.getElementById('nav-auth');
        if (token) {
            user.textContent = role ? `Signed in (${role})` : 'Signed in';
            auth.textContent = 'Sign out';
            auth.href = '/logout';
        }
        // Plain OPERATORs only see the APK download page. Hide all internal
        // links and bounce them to /download if they land elsewhere.
        if (token && role === 'OPERATOR') {
            document.querySelectorAll('.nav-internal').forEach(a => a.style.display = 'none');
            const path = location.pathname;
            const allowed = path.startsWith('/download') || path === '/logout' || path === '/login';
            if (!allowed) location.replace('/download/');
        }
    })();
</script>

<div id="arrow-toast-container"></div>
<div id="arrow-chat-toast-container"></div>
<script>
    window.ARROW_BACKEND_URL = "{{ backend_url }}";
    window.ARROW_WS_URL = "{{ ws_url }}";

    /* Photo loader — `/photos/{id}` requires Authorization: Bearer, which an
       <img> tag cannot send. Fetch with auth, expose as blob URL, cache by id. */
    (function () {
        const cache = new Map();   // id -> Promise<blobUrl>
        window.arrowPhotoUrl = function (id) {
            if (cache.has(id)) return cache.get(id);
            const tok = localStorage.getItem('arrow_token') || '';
            const p = fetch(window.ARROW_BACKEND_URL + '/photos/' + id, {
                headers: { Authorization: 'Bearer ' + tok },
            }).then(r => r.ok ? r.blob() : Promise.reject(r.status))
              .then(b => URL.createObjectURL(b));
            cache.set(id, p);
            return p;
        };
        window.arrowApplyPhotos = function (root) {
            (root || document).querySelectorAll('img[data-photo-id]').forEach(img => {
                if (img.dataset.photoLoaded) return;
                img.dataset.photoLoaded = '1';
                window.arrowPhotoUrl(img.dataset.photoId)
                    .then(url => { img.src = url; })
                    .catch(()  => { img.alt = '⚠ photo unavailable'; });
            });
        };
    })();
</script>
<script>
(function () {
    const token = localStorage.getItem('arrow_token');
    if (!token) return;

    let meId = null;
    const api = (path, opts = {}) => fetch(window.ARROW_BACKEND_URL + path, {
        ...opts, headers: { Authorization: 'Bearer ' + token, ...(opts.headers || {}) },
    });

    api('/auth/me').then(r => r.ok ? r.json() : null).then(me => { if (me) meId = me.id; });

    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    // ── Per-operator notification preferences ─────────────────────────────
    // Stored in localStorage under ``arrow_visibility_prefs`` (same blob the
    // admin page edits and the map page reads). Each operator controls their
    // own toast stack; reload on cross-tab or same-tab changes. Defaults
    // to all-on so a missing-key never silences a critical alert.
    const VIS_LS_KEY = 'arrow_visibility_prefs';
    const notifVis = {
        notif_chat:               true,
        notif_fire_missions:      true,
        notif_alerts:             true,
        notif_streams:            true,
        notif_octopus_detections: true,
        sound_enabled:            true,
    };
    function _applyNotifVis(prefs) {
        if (!prefs) return;
        for (const k of Object.keys(notifVis)) {
            if (k in prefs) notifVis[k] = !!prefs[k];
        }
    }
    try {
        const raw = localStorage.getItem(VIS_LS_KEY);
        if (raw) _applyNotifVis(JSON.parse(raw));
        else api('/admin/map-visibility').then(r => r.ok ? r.json() : null).then(v => {
            if (v) { localStorage.setItem(VIS_LS_KEY, JSON.stringify(v)); _applyNotifVis(v); }
        });
    } catch (_) {}
    window.addEventListener('arrow-visibility-changed', e => _applyNotifVis(e.detail));
    window.addEventListener('storage', e => {
        if (e.key !== VIS_LS_KEY || !e.newValue) return;
        try { _applyNotifVis(JSON.parse(e.newValue)); } catch (_) {}
    });

    function esc(s) {
        return String(s).replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function recipientLabel(msgType, groupId) {
        if (msgType === 'BROADCAST') return '📢 Broadcast';
        if (msgType === 'GROUP') return '⭐ ' + (groupId || 'Group');
        return 'Direct';
    }

    function openHref(msgType, groupId, senderId) {
        if (msgType === 'BROADCAST') return '/messaging/?open=broadcast';
        if (msgType === 'GROUP')     return '/messaging/?open=group:' + groupId;
        return '/messaging/?open=direct:' + senderId;
    }

    // Auto-dismiss a toast after `ms` (default 5 s). Pauses the countdown while
    // the user is hovering or focused inside an input — so they can finish typing.
    function autoDismissToast(toast, ms = 5000) {
        let timer = null;
        const start = () => { clearTimeout(timer); timer = setTimeout(() => toast.remove(), ms); };
        const stop  = () => { clearTimeout(timer); timer = null; };
        toast.addEventListener('mouseenter', stop);
        toast.addEventListener('mouseleave', start);
        toast.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('focus', stop);
            el.addEventListener('blur',  start);
        });
        start();
    }

    function showToast(evt) {
        const data = evt.data || {};
        if (meId && data.sender_id === meId) return;
        // Admin can mute chat toasts globally via the Map visibility page.
        if (!notifVis.notif_chat) return;
        // Suppress in-page toast when already viewing messaging and tab is focused
        if (location.pathname.startsWith('/messaging') && document.visibilityState === 'visible') return;

        const from     = evt.from || 'Unknown';
        const content  = data.content || '';
        const msgType  = (data.message_type || 'DIRECT').toUpperCase();
        const senderId = data.sender_id;
        const groupId  = data.group_id || null;
        const href     = openHref(msgType, groupId, senderId);

        // Browser notification for background / other-tab case
        if (document.visibilityState !== 'visible' && Notification.permission === 'granted') {
            const n = new Notification('Arrow — ' + from, { body: content, tag: 'arrow-chat' });
            n.onclick = () => { window.location.href = href; n.close(); };
        }

        // Personal chats (DIRECT / GROUP) → separate left-side box with reply,
        // 10-minute auto-dismiss. BROADCAST / system → right-side box, 5 s.
        const replyable = (msgType === 'DIRECT' || msgType === 'GROUP');

        const toast = document.createElement('div');
        toast.className = 'arrow-toast';
        toast.innerHTML = `
            <div class="arrow-toast-header">
                <span class="arrow-toast-from">
                    <a href="${href}">💬 ${esc(from)}</a>
                    <em>${esc(recipientLabel(msgType, groupId))}</em>
                </span>
                <button class="arrow-toast-close" title="Dismiss">✕</button>
            </div>
            <div class="arrow-toast-body">${esc(content)}</div>
            ${replyable ? `
            <div class="arrow-toast-reply">
                <input class="arrow-toast-input" type="text" placeholder="Reply…" autocomplete="off" />
                <button class="arrow-toast-send">Send</button>
            </div>` : ''}`;

        const containerId = replyable ? 'arrow-chat-toast-container' : 'arrow-toast-container';
        document.getElementById(containerId).appendChild(toast);

        toast.querySelector('.arrow-toast-close').addEventListener('click', () => toast.remove());

        if (replyable) {
            const input = toast.querySelector('.arrow-toast-input');
            const send  = toast.querySelector('.arrow-toast-send');
            async function sendReply() {
                const text = input.value.trim();
                if (!text) return;
                send.disabled = true;
                const body = msgType === 'GROUP'
                    ? { content: text, message_type: 'GROUP', group_id: groupId }
                    : { content: text, message_type: 'DIRECT', receiver_id: senderId };
                const res = await api('/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (res.ok) { toast.remove(); }
                else { send.disabled = false; }
            }
            send.addEventListener('click', sendReply);
            input.addEventListener('keydown', e => { if (e.key === 'Enter') sendReply(); });
        }

        // 10 min for replyable chats, 30 s for system broadcasts.
        autoDismissToast(toast, replyable ? 10 * 60 * 1000 : 30 * 1000);
    }

    // ── Floating stream windows (multi-window) ────────────────────────────────
    const _sfWins = new Map(); // streamId → { el, ws, fpsTick, ping }
    let _sfZTop = 9990;

    function makeDraggable(el, handle) {
        let dragging = false, ox = 0, oy = 0;
        handle.addEventListener('mousedown', e => {
            dragging = true;
            const r = el.getBoundingClientRect();
            ox = e.clientX - r.left;
            oy = e.clientY - r.top;
            e.preventDefault();
        });
        document.addEventListener('mousemove', e => {
            if (!dragging) return;
            el.style.left   = Math.max(0, e.clientX - ox) + 'px';
            el.style.top    = Math.max(0, e.clientY - oy) + 'px';
            el.style.right  = 'auto';
            el.style.bottom = 'auto';
        });
        document.addEventListener('mouseup', () => { dragging = false; });
    }

    function sfFocus(id) {
        const win = _sfWins.get(id);
        if (win) win.el.style.zIndex = ++_sfZTop;
    }

    function sfOpen(id, callsign) {
        if (_sfWins.has(id)) { sfFocus(id); return; }

        const offset = _sfWins.size * 30;
        const el = document.createElement('div');
        el.className = 'stream-float-win';
        el.style.cssText = `right:${20 + offset}px;bottom:${80 + offset}px;z-index:${++_sfZTop}`;
        el.innerHTML = `
            <div class="sf-bar">
                <span class="sf-live"></span>
                <span class="sf-call">${esc(callsign)}</span>
                <span class="sf-fps">— fps</span>
                <button class="sf-btn sf-btn-min" title="Minimise">_</button>
                <button class="sf-btn sf-btn-full" title="Fullscreen">⛶</button>
                <button class="sf-btn sf-btn-close" title="Close">✕</button>
            </div>
            <div class="sf-video-wrap">
                <div class="sf-no-feed">Connecting…</div>
                <img class="sf-img" alt="Stream" style="display:none"/>
            </div>`;

        el.querySelector('.sf-btn-min').addEventListener('click',   () => sfMinimise(id));
        el.querySelector('.sf-btn-full').addEventListener('click',  () => sfFullscreen(id));
        el.querySelector('.sf-btn-close').addEventListener('click', () => sfClose(id));
        el.addEventListener('mousedown', () => sfFocus(id));
        document.body.appendChild(el);
        makeDraggable(el, el.querySelector('.sf-bar'));

        const tok = localStorage.getItem('arrow_token') || '';
        const wsUrl = window.ARROW_WS_URL.replace(/^http/, 'ws')
            + `/streams/${encodeURIComponent(id)}/consume?token=${encodeURIComponent(tok)}`;
        const ws = new WebSocket(wsUrl);
        ws.binaryType = 'arraybuffer';

        const img     = el.querySelector('.sf-img');
        const noFeed  = el.querySelector('.sf-no-feed');
        const fpsEl   = el.querySelector('.sf-fps');
        let frames = 0, lastT = Date.now();

        ws.onmessage = e => {
            if (typeof e.data === 'string') {
                try { if (JSON.parse(e.data).event === 'ended') sfClose(id); } catch(_){}
                return;
            }
            const blob = new Blob([e.data], { type: 'image/jpeg' });
            const prev = img.src;
            img.src = URL.createObjectURL(blob);
            if (prev.startsWith('blob:')) URL.revokeObjectURL(prev);
            noFeed.style.display = 'none';
            img.style.display = 'block';
            frames++;
        };
        ws.onclose = () => { if (_sfWins.has(id) && _sfWins.get(id).ws === ws) sfClose(id); };

        const fpsTick = setInterval(() => {
            const now = Date.now();
            fpsEl.textContent = Math.round(frames / ((now - lastT) / 1000)) + ' fps';
            frames = 0; lastT = now;
        }, 1000);

        const ping = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) ws.send('ping');
            else clearInterval(ping);
        }, 15000);

        _sfWins.set(id, { el, ws, fpsTick, ping });
    }
    window.sfOpen = sfOpen;

    window.sfClose = function(id) {
        const win = _sfWins.get(id);
        if (!win) return;
        win.ws.close();
        clearInterval(win.fpsTick);
        clearInterval(win.ping);
        const img = win.el.querySelector('.sf-img');
        if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
        win.el.remove();
        _sfWins.delete(id);
    };

    window.sfMinimise = function(id) {
        const win = _sfWins.get(id);
        if (win) win.el.classList.toggle('minimised');
    };

    window.sfFullscreen = function(id) {
        const win = _sfWins.get(id);
        if (!win) return;
        const wrap = win.el.querySelector('.sf-video-wrap');
        if (wrap.requestFullscreen) wrap.requestFullscreen();
        else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();
    };

    function handleStreamEvent(evt) {
        // Admin can mute live-stream notifications.
        if (!notifVis.notif_streams) return;
        const d = evt.data || {};
        console.log('[arrow] stream event', evt);
        if (evt.event === 'started') {
            if (notifVis.sound_enabled) {
                try {
                    const ctx  = audioCtx();
                    const now  = ctx.currentTime;
                    const osc  = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(1320, now + 0.18);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(now); osc.stop(now + 0.45);
                } catch (_) {}
            }

            const toast = document.createElement('div');
            toast.className = 'arrow-toast';
            toast.style.borderLeftColor = '#7c3aed';
            toast.style.borderLeftWidth = '4px';
            const streamId = d.id, streamCs = d.callsign;
            toast.innerHTML = `
                <div class="arrow-toast-header">
                    <span class="arrow-toast-from">
                        <span style="color:#a78bfa">📡 LIVE STREAM</span>
                        <em style="color:#7c3aed">${esc(streamCs)}</em>
                    </span>
                    <button class="arrow-toast-close" onclick="this.closest('.arrow-toast').remove()">✕</button>
                </div>
                <div class="arrow-toast-body">Tactical video stream — ${esc(streamCs)}</div>
                <div class="arrow-toast-reply" style="gap:.5rem">
                    <button class="sf-toast-accept arrow-toast-send"
                            style="background:#7c3aed;border:0;cursor:pointer;font:inherit">
                        ▶ Accept &amp; View
                    </button>
                    <button onclick="this.closest('.arrow-toast').remove()"
                            style="background:#1f2937;border:1px solid #2a3142;border-radius:4px;
                                   color:#64748b;cursor:pointer;padding:0 .6rem;font-size:.8rem;font:inherit">
                        Decline
                    </button>
                </div>`;
            toast.querySelector('.sf-toast-accept').addEventListener('click', () => {
                sfOpen(streamId, streamCs);
                toast.remove();
            });
            document.getElementById('arrow-toast-container').appendChild(toast);
            autoDismissToast(toast, 30 * 1000);

            if (Notification.permission === 'granted') {
                const n = new Notification(`📡 LIVE — ${d.callsign}`,
                    { body: 'Tactical video stream started. Click to view.', tag: 'arrow-stream' });
                n.onclick = () => { sfOpen(d.id, d.callsign); n.close(); };
            }
        } else if (evt.event === 'ended') {
            if (d.id) sfClose(d.id);
        }
    }

    function showFireMissionAlert(evt) {
        // Admin can mute the FM toast banner globally; audio is suppressed
        // by the caller (connectWS) which also reads the same flag.
        if (!notifVis.notif_fire_missions) return;
        const d    = evt.data || {};
        const cs   = d.callsign || 'Unknown';
        const type = (d.mission_type || '').replace(/_/g, ' ');
        const ammo = d.ammunition || '';
        const grid = d.latitude != null ? `${d.latitude.toFixed(4)}, ${d.longitude.toFixed(4)}` : '—';

        // Prominent red banner regardless of tab visibility
        const toast = document.createElement('div');
        toast.className = 'arrow-toast';
        toast.style.borderLeftColor = '#dc2626';
        toast.style.borderLeftWidth = '4px';
        toast.innerHTML = `
            <div class="arrow-toast-header">
                <span class="arrow-toast-from">
                    <a href="/fire-missions/" style="color:#ef4444">🎯 FIRE MISSION</a>
                    <em style="color:#f87171">${esc(type)}</em>
                </span>
                <button class="arrow-toast-close" onclick="this.closest('.arrow-toast').remove()">✕</button>
            </div>
            <div class="arrow-toast-body">
                <strong>${esc(cs)}</strong> requests ${esc(ammo)} — Grid: ${esc(grid)}<br>
                ${d.description ? `<span style="color:#94a3b8">${esc(d.description)}</span>` : ''}
            </div>
            <div class="arrow-toast-reply">
                <a href="/fire-missions/" class="arrow-toast-send" style="text-decoration:none;text-align:center">
                    Open FDC →
                </a>
            </div>`;

        document.getElementById('arrow-toast-container').appendChild(toast);
        autoDismissToast(toast, 30 * 1000);

        // Browser notification
        if (Notification.permission === 'granted') {
            const n = new Notification('🎯 FIRE MISSION — ' + cs,
                { body: `${type} · ${ammo} · ${grid}`, tag: 'arrow-fire' });
            n.onclick = () => { window.location.href = '/fire-missions/'; n.close(); };
        }
    }

    function esc(s) {
        return String(s||'').replace(/[&<>"']/g, c =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ── Audio alert system ─────────────────────────────────────────────────────
    let _audioCtx = null;
    function audioCtx() {
        if (!_audioCtx || _audioCtx.state === 'closed')
            _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (_audioCtx.state === 'suspended') _audioCtx.resume();
        return _audioCtx;
    }

    /**
     * triggerAudioAlert(type)
     *   'fire' → says "Fire mission" then plays a 5-second pulsing alarm (880 Hz sawtooth)
     *   'tic'  → says "Contact" then plays a 5-second alarm (1200 Hz square)
     */
    function triggerAudioAlert(type) {
        if (!notifVis.sound_enabled) return;
        const isFireMission = type === 'fire';
        const text     = isFireMission ? 'Fire mission, fire mission, fire mission' : 'Contact, contact, contact';
        const freq     = isFireMission ? 880  : 1200;
        const waveform = isFireMission ? 'sawtooth' : 'square';
        const duration = 5;      // seconds of alarm after voice

        // 1. Voice call (speech synthesis)
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();            // clear queue
            const utt  = new SpeechSynthesisUtterance(text);
            utt.lang   = 'en-US';
            utt.rate   = 0.85;
            utt.volume = 1;
            utt.pitch  = isFireMission ? 1.0 : 1.3;
            // Play alarm after voice finishes
            utt.onend  = () => playAlarmTone(freq, waveform, duration);
            speechSynthesis.speak(utt);
        } else {
            playAlarmTone(freq, waveform, duration);
        }
    }

    function playAlarmTone(freq, waveform, duration) {
        try {
            const ctx  = audioCtx();
            const now  = ctx.currentTime;
            const osc  = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type          = waveform;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(ctx.destination);

            // Pulsing: 0.3 s on / 0.2 s off
            gain.gain.setValueAtTime(0, now);
            const pulse = 0.5;   // period seconds
            const onRatio = 0.6; // fraction of period that's "on"
            for (let t = 0; t < duration; t += pulse) {
                gain.gain.setValueAtTime(0.6,  now + t);
                gain.gain.setValueAtTime(0,    now + t + pulse * onRatio);
            }

            osc.start(now);
            osc.stop(now + duration);
        } catch (_) {}
    }

    // Distinctive "drone buzz" — modulated triangle wave with rapid 0.1s pulses.
    // Sounds clearly different from the steady TIC alarm so operators can tell
    // a drone-spotted alert from a contact alert without looking at the screen.
    function playDroneBuzz(duration) {
        try {
            const ctx  = audioCtx();
            const now  = ctx.currentTime;
            const osc  = ctx.createOscillator();
            const lfo  = ctx.createOscillator();   // modulator → "buzz" effect
            const lfoGain = ctx.createGain();
            const gain = ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.value = 540;             // mid-band carrier
            lfo.type = 'square';
            lfo.frequency.value = 12;              // 12 Hz buzz
            lfoGain.gain.value = 180;              // ± 180 Hz modulation depth
            lfo.connect(lfoGain).connect(osc.frequency);
            osc.connect(gain).connect(ctx.destination);

            // Rapid 0.1s on / 0.05s off pulses for the whole duration
            const pulse = 0.15, onRatio = 0.66;
            gain.gain.setValueAtTime(0, now);
            for (let t = 0; t < duration; t += pulse) {
                gain.gain.setValueAtTime(0.5, now + t);
                gain.gain.setValueAtTime(0,   now + t + pulse * onRatio);
            }
            osc.start(now); lfo.start(now);
            osc.stop(now + duration); lfo.stop(now + duration);
        } catch (_) {}
    }

    // Handle TIC / MEDICAL / EVAC / LOST_COMMS / DRONE_SPOTTED alerts from WebSocket
    function handleTacAlert(evt) {
        if (evt.event !== 'triggered') return;
        // Admin can mute TIC / MEDICAL / EVAC / LOST_COMMS / DRONE toasts globally.
        if (!notifVis.notif_alerts) return;
        const d = evt.data || {};
        const type = (d.type || '').toUpperCase();

        // Choose voice text by alert type
        const voiceMap = {
            TIC:            'Contact! Troops in contact!',
            MEDICAL:        'Medical emergency! Casevac required!',
            EVAC:           'Evacuation! All units evacuate!',
            LOST_COMMS:     'Lost communications! Check radio!',
            DRONE_SPOTTED:  'Drone spotted! Drone spotted!',
        };
        const voice = voiceMap[type] || `Alert: ${type}`;

        // Drone gets the distinctive buzz; everything else gets the contact alarm.
        if (type === 'DRONE_SPOTTED') {
            triggerAudioAlertWithText('drone', voice);
        } else {
            triggerAudioAlertWithText('tic', voice);
        }

        // Build the toast body. Drone alerts pull extra detail from the event.
        let bodyHtml = `<div class="arrow-toast-body" style="color:#fca5a5">${esc(voice)}</div>`;
        let headerColor = '#ef4444';
        let headerIcon  = '🚨';
        let headerLabel = `${type} ALERT`;

        if (type === 'DRONE_SPOTTED') {
            headerColor = '#c084fc';
            headerIcon  = '🛸';
            headerLabel = 'DRONE SPOTTED';
            const fmt = v => (v === undefined || v === null || v === '') ? '—' : v;
            const altTxt = (d.altitude_m   != null) ? `${Math.round(d.altitude_m)} m` : '—';
            const dirTxt = (d.direction_deg!= null) ? `${Math.round(d.direction_deg)}°` : '—';
            const locTxt = (d.latitude     != null && d.longitude != null)
                ? `${Number(d.latitude).toFixed(4)}, ${Number(d.longitude).toFixed(4)}` : '—';
            bodyHtml = `
                <div class="arrow-toast-body" style="color:#e9d5ff;font-size:13px;line-height:1.45">
                    <div><b>Type:</b> ${esc(fmt(d.drone_type))} &nbsp;·&nbsp; <b>Behavior:</b> ${esc(fmt(d.behavior))}</div>
                    <div><b>Alt:</b> ${esc(altTxt)} &nbsp;·&nbsp; <b>Heading:</b> ${esc(dirTxt)}</div>
                    <div><b>Pos:</b> ${esc(locTxt)}</div>
                    ${d.observer_callsign ? `<div style="color:#a78bfa;margin-top:4px">spotted by ${esc(d.observer_callsign)}</div>` : ''}
                </div>`;
        }

        const toast = document.createElement('div');
        toast.className = 'arrow-toast';
        toast.style.cssText += `border-left-color:${headerColor};border-left-width:4px`;
        toast.innerHTML = `
            <div class="arrow-toast-header">
                <span class="arrow-toast-from" style="color:${headerColor}">
                    ${headerIcon} ${esc(headerLabel)}
                </span>
                <button class="arrow-toast-close" onclick="this.closest('.arrow-toast').remove()">✕</button>
            </div>
            ${bodyHtml}`;
        document.getElementById('arrow-toast-container').appendChild(toast);
        autoDismissToast(toast, 30 * 1000);

        if (Notification.permission === 'granted') {
            const notifBody = (type === 'DRONE_SPOTTED')
                ? `${d.drone_type || 'Unknown'} · ${d.behavior || ''} · alt ${d.altitude_m ?? '—'} m`
                : voice;
            new Notification(`${headerIcon} ${headerLabel}`, { body: notifBody, tag: 'arrow-alert' });
        }
    }

    // Variant that takes explicit voice text + alert kind for distinct tones.
    function triggerAudioAlertWithText(type, text) {
        if (!notifVis.sound_enabled) return;
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(text);
            utt.lang  = 'en-US'; utt.rate = 0.9; utt.volume = 1;
            utt.onend = () => playAlertTone(type);
            speechSynthesis.speak(utt);
        } else {
            playAlertTone(type);
        }
    }

    function playAlertTone(type) {
        if (type === 'drone') { playDroneBuzz(4); return; }
        const isFireMission = type === 'fire';
        const freq     = isFireMission ? 880  : 1200;
        const waveform = isFireMission ? 'sawtooth' : 'square';
        playAlarmTone(freq, waveform, 5);
    }

    // ── Octopus detection toasts ───────────────────────────────────────────────
    const _DET_COLOURS = {
        person:   { border: '#ef4444', header: '#fca5a5', icon: '🚶' },
        drone:    { border: '#c084fc', header: '#e9d5ff', icon: '🛸' },
        vehicle:  { border: '#f59e0b', header: '#fde68a', icon: '🚗' },
        car:      { border: '#f59e0b', header: '#fde68a', icon: '🚗' },
        truck:    { border: '#f59e0b', header: '#fde68a', icon: '🚛' },
        animal:   { border: '#34d399', header: '#a7f3d0', icon: '🐾' },
    };

    function _detColour(label) {
        return _DET_COLOURS[(label || '').toLowerCase()] ||
               { border: '#38bdf8', header: '#bae6fd', icon: '📸' };
    }

    function playDetectionTone(label) {
        if (!notifVis.sound_enabled) return;
        try {
            const ctx  = audioCtx();
            const now  = ctx.currentTime;
            // Two sharp pings — distinct from alarm tones
            [0, 0.18].forEach(offset => {
                const osc  = ctx.createOscillator();
                const gain = ctx.createGain();
                const freq = label === 'drone' ? 1800 : label === 'person' ? 1400 : 1200;
                osc.type = 'sine';
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.35, now + offset);
                gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.14);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now + offset); osc.stop(now + offset + 0.15);
            });
        } catch (_) {}
    }

    function handleOctopusDetection(evt) {
        if (evt.event !== 'detection') return;
        if (!notifVis.notif_octopus_detections) return;
        const d   = evt.data || {};
        const col = _detColour(d.label);
        const pct = d.confidence != null ? Math.round(d.confidence * 100) : '?';
        const ts  = d.occurred_at ? new Date(d.occurred_at).toLocaleTimeString() : '';

        playDetectionTone(d.label);

        const toast = document.createElement('div');
        toast.className = 'arrow-toast';
        toast.style.cssText += `border-left-color:${col.border};border-left-width:4px;max-width:320px`;
        toast.innerHTML = `
            <div class="arrow-toast-header">
                <span class="arrow-toast-from" style="color:${col.border}">
                    ${col.icon} DETECTION
                    <em style="color:${col.header};margin-left:.4rem;font-style:normal;font-weight:700">
                        ${esc(d.label || '').toUpperCase()}
                    </em>
                </span>
                <button class="arrow-toast-close" onclick="this.closest('.arrow-toast').remove()">✕</button>
            </div>
            <div class="arrow-toast-body" style="padding:.35rem .55rem .1rem">
                <div style="display:flex;gap:.5rem;align-items:flex-start">
                    <div id="det-snap-${d.id}" style="width:96px;height:72px;flex-shrink:0;
                         background:#0d1117;border-radius:3px;overflow:hidden;display:flex;
                         align-items:center;justify-content:center;color:#475569;font-size:.7rem">
                        Loading…
                    </div>
                    <div style="font-size:.78rem;line-height:1.5;min-width:0">
                        <div style="color:#e2e8f0">${esc(d.description || d.label)}</div>
                        <div style="color:#94a3b8">
                            Confidence: <b style="color:${col.header}">${pct}%</b>
                        </div>
                        <div style="color:#64748b">Stream: <code>${esc(d.stream_id || '')}</code></div>
                        ${ts ? `<div style="color:#475569;font-size:.7rem">${esc(ts)}</div>` : ''}
                    </div>
                </div>
                ${Array.isArray(d.bbox) && d.bbox.length === 4
                    ? `<div style="font-size:.68rem;color:#475569;margin-top:.3rem;font-family:monospace">
                        bbox [${d.bbox.map(Math.round).join(', ')}]
                       </div>`
                    : ''}
                <div style="margin-top:.5rem">
                    <a href="/streams/?octopus=${encodeURIComponent(d.stream_id)}"
                       style="display:inline-block;background:#f59e0b22;color:#fbbf24;
                              border:1px solid #f59e0b44;border-radius:4px;
                              padding:3px 10px;font-size:.75rem;text-decoration:none">
                        ▶ View Stream
                    </a>
                </div>
            </div>`;

        document.getElementById('arrow-toast-container').appendChild(toast);
        autoDismissToast(toast, 30 * 1000);

        // Load snapshot asynchronously after the toast is in the DOM
        if (d.snapshot_url) {
            (async () => {
                try {
                    const r = await api(d.snapshot_url);
                    if (!r.ok) return;
                    const blob = await r.blob();
                    const url  = URL.createObjectURL(blob);
                    const box  = document.getElementById(`det-snap-${d.id}`);
                    if (!box) return;
                    box.innerHTML = '';
                    const img = document.createElement('img');
                    img.style.cssText = 'width:100%;height:100%;object-fit:cover';
                    img.src = url;
                    img.onload = () => URL.revokeObjectURL(url);
                    box.appendChild(img);
                } catch (_) {}
            })();
        }

        // Browser notification when tab is in background
        if (document.visibilityState !== 'visible' && Notification.permission === 'granted') {
            new Notification(`${col.icon} ${(d.label || 'Detection').toUpperCase()} — ${pct}%`,
                { body: d.description || d.stream_id, tag: 'arrow-detection' });
        }
    }

    // One-shot listeners: map channel → array of {resolve, reject, timerId}
    const _wsOnce = {};
    window.arrowWsOnce = function(channel, timeoutMs = 8000) {
        return new Promise((resolve, reject) => {
            if (!_wsOnce[channel]) _wsOnce[channel] = [];
            const timerId = setTimeout(() => {
                _wsOnce[channel] = (_wsOnce[channel] || []).filter(e => e.timerId !== timerId);
                reject(new Error('timeout'));
            }, timeoutMs);
            _wsOnce[channel].push({ resolve, reject, timerId });
        });
    };

    function connectWS() {
        const wsUrl = window.ARROW_WS_URL.replace(/^http/, 'ws') + '/ws?token=' + encodeURIComponent(token);
        const ws = new WebSocket(wsUrl);
        window.arrowWs = ws;
        ws.onopen  = () => { window.arrowWsReady = true;  document.dispatchEvent(new Event('arrow-ws-open'));  };
        ws.onclose = () => { window.arrowWsReady = false; document.dispatchEvent(new Event('arrow-ws-close')); setTimeout(connectWS, 3000); };
        ws.onmessage = ev => {
            try {
                const e = JSON.parse(ev.data);
                // Fire one-shot listeners first
                if (_wsOnce[e.channel] && _wsOnce[e.channel].length) {
                    const entry = _wsOnce[e.channel].shift();
                    clearTimeout(entry.timerId);
                    entry.resolve(e);
                }
                if (e.channel === 'chat')         showToast(e);
                if (e.channel === 'fire-mission') {
                    showFireMissionAlert(e);
                    if (notifVis.notif_fire_missions &&
                        (e.data||{}).weapon !== 'L16_81MM') triggerAudioAlert('fire');
                }
                if (e.channel === 'alert')             handleTacAlert(e);
                if (e.channel === 'stream')            handleStreamEvent(e);
                if (e.channel === 'octopus-detection') handleOctopusDetection(e);
            } catch (_) {}
        };
    }
    window.arrowWsReady = false;
    connectWS();
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
