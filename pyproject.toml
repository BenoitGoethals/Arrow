[project]
name = "arrow"
version = "0.1.0"
description = "Soldier System Platform — TAK-style situational awareness."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "websockets>=13",
    "flask>=3.1.3",
    "httpx>=0.27",
    "lxml>=5.3",
    # security controls
    "slowapi>=0.1.9",
    "redis>=5.0",
    "pyotp>=2.9",
    "python-json-logger>=3.2",
    "cryptography>=43",
    "reportlab>=4.2",
    "psycopg[binary]>=3.2",
    "smbprotocol>=1.16.1",
    "pymumble>=1.6",
]
# NOTE: Desktop/GUI dependencies (PyQt6, wxPython, keyring, sounddevice, numpy,
# pyproj, mgrs, …) live in the `desktop`/`front`/`cot-sim` extras below — NOT in
# the core dependencies. The backend + web server images build with
# `uv sync --no-dev` (no extras), so they must never pull the GUI stack: wxPython
# has no Linux wheel and would try to compile (needs gcc, absent in python:slim),
# and the ~190 MB Qt binaries have no place on a headless server. Desktop apps
# install them explicitly, e.g. `uv run --extra desktop arrow-front`.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "playwright>=1.45",
    "pytest-playwright>=0.5",
    "pillow>=10.0",
]
# CoT simulator GUI (tools/cot_simulator.py). wxPython only ships a pre-built
# wheel for Ubuntu 24.04 cp314 linux_x86_64; install on Linux only.
cot-sim = [
    "wxpython==4.2.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Arrow Front — Python tactical desktop COP (Frontline-style). Requires Qt6 +
# PyQt6-WebEngine. On Linux: apt install libgl1 libglib2.0-0 libegl1
# Run with:  uv run --extra front arrow-front
front = [
    "pyqt6-sip>=13.11.1",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
    "keyring>=25.7.0",
    "sounddevice>=0.5.5",
    "numpy>=2.4.6",
    "mgrs>=1.5.4",
    # Native own-position fix for the front desktop COP. QtWebEngine's
    # navigator.geolocation does not resolve on macOS, so we query Core Location
    # directly (GPS when present, Wi-Fi/network otherwise). macOS-only.
    "pyobjc-framework-CoreLocation>=10.0; sys_platform == 'darwin'",
]
# Umbrella extra for every Python desktop tool (front COP, MortarCalc, sim GUI,
# CoT simulator). Superset of `front` + wxPython + pyproj. Run e.g.:
#   uv run --extra desktop arrow-front | arrow-mortarcalc | arrow-sim-gui
desktop = [
    "pyqt6-sip>=13.11.1",
    "pyqt6>=6.11.0",
    "pyqt6-webengine>=6.11.0",
    "keyring>=25.7.0",
    "sounddevice>=0.5.5",
    "numpy>=2.4.6",
    "mgrs>=1.5.4",
    "pyproj>=3.7.2",
    "pyobjc-framework-CoreLocation>=10.0; sys_platform == 'darwin'",
    "wxpython==4.2.4; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Package Arrow Front as a macOS .app bundle (needed for Core Location to work —
# see setup_front_app.py). Build with: uv run --extra front-bundle python setup_front_app.py py2app
front-bundle = [
    "py2app>=0.28; sys_platform == 'darwin'",
]
# Arrow Front (Kivy) — experimental Kivy port of front/. The map runs in a
# separate pywebview process (front_kivy/map/map_process.py) because Kivy and
# pywebview each require exclusive main-thread ownership of their native
# window/event loop and cannot share one process (verified on macOS: Kivy's
# window crashes if created off the main thread; pywebview raises
# WebViewException outright). On macOS: brew install pkg-config sdl2_image
# sdl2_ttf sdl2_mixer (Kivy's wheel build silently drops the SDL2 window
# backend without pkg-config).
front-kivy = [
    "kivy>=2.3.1",
    "pywebview>=6.2.1",
    "pillow>=10.0",
    "keyring>=25.7.0",
    "mgrs>=1.5.4",
    "pyobjc-framework-CoreLocation>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
arrow = "run:main"
arrow-backend = "backend.main:run"
arrow-web = "web.app:run"
arrow-seed = "backend.storage.seed:main"
arrow-battlefield = "simulate_battlefield:main"
arrow-cot-sim = "tools.cot_simulator:main"
arrow-nuts = "simulate_ranger_bastogne:main"
arrow-zeebrugge = "simulate_zeebrugge_assault:main"
arrow-front = "front.main:main"
arrow-front-kivy = "front_kivy.main:main"
arrow-mortarcalc = "mortarcalc.app:main"
arrow-sim-gui = "sim_gui.__main__:main"
tak-bridge = "tak_bridge.run:main"

[tool.uv]
# Restricts the universal lock to macOS/Linux. Added for the front-kivy extra:
# kivy's Windows dependency (kivy-deps-angle) has no cp314 wheel yet, which
# otherwise makes `uv sync` unsatisfiable on every platform (uv resolves one
# lock across all optional-dependencies groups regardless of which extra you
# sync). Windows already has a dedicated native port (front-wpf, see project
# memory) — `uv sync` on Windows is no longer supported for this project as a
# result; revisit if that changes.
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "web", "tools", "front", "front_kivy", "sim_gui", "mortarcalc"]
include = ["run.py", "simulate_battlefield.py"]

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
# E402: Qt entry-points must import after QApplication; sim scripts set globals first.
# E701/E702: compact one-liners tolerated in Qt GUI and simulate scripts.
# E741: 'l' common for QLabel in Qt code.
# F841: intentional sentinel assignments in simulate scripts.
# F821: undefined name in simulate_pl_arrow uses a dynamic monkeypatch pattern.
"front/**/*.py"                       = ["E402", "E701", "E702", "E741", "F841"]
"front/main.py"                       = ["E402"]
"front_kivy/**/*.py"                  = ["E402"]
"mortarcalc/**/*.py"                  = ["E402", "E701", "E702", "E741", "F841"]
"sim_gui/**/*.py"                     = ["E402", "E701", "E702", "E741"]
"simulate*.py"                        = ["E701", "E702", "F841"]
"sim_utils.py"                        = ["E402", "E701", "E702"]
"simulate_pl_arrow.py"                = ["F821"]
"tools/**/*.py"                       = ["E402"]
"generate_arrow_doc.py"               = ["F841"]
"tak_bridge/**/*.py"                  = ["F841"]
"tests/conftest.py"                   = ["E402"]
"tests/**/*.py"                       = ["E702"]
"tests/unit/test_map_alert_js.py"     = ["E701"]
"tests/integration/test_streams.py"   = ["E702"]
"backend/mumble/monitor.py"           = ["E402"]
"backend/octopus/router.py"           = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.mypy]
ignore_missing_imports = true
warn_return_any = false
check_untyped_defs = false
