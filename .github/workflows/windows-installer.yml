name: Windows installer

# Builds the Arrow Front Windows installer (PyInstaller -> Inno Setup).
#   * PR / manual run  -> build and upload the Setup.exe as a workflow artifact
#   * tag push (v*)    -> also publish it to a GitHub Release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "front/**"
      - "mortarcalc/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write # needed to create/attach a Release on tag builds

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # fetch the default MBTiles map if it is LFS-tracked

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\front\packaging\build_windows.ps1

      - name: Locate installer
        id: artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\installer\*.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer produced in dist\installer" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)"     >> $env:GITHUB_OUTPUT
          Write-Host "Built: $($exe.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
