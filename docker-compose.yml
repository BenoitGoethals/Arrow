services:
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    image: arrow-backend
    container_name: arrow-backend
    expose:
      - "6001"
    volumes:
      - arrow-data:/app/data
      - ./config.xml:/app/config.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6001/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web.dockerfile
    image: arrow-web
    container_name: arrow-web
    environment:
      # Browser hits same origin -> Caddy -> backend. Server-side BACKEND_URL
      # is used by the Flask /api proxy fallback only.
      ARROW_BACKEND_URL: http://backend:6001
    expose:
      - "6002"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    container_name: arrow-proxy
    ports:
      - "6200:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - web
    restart: unless-stopped

volumes:
  arrow-data:
  caddy-data:
  caddy-config:
