services:

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: arrow-postgres
    environment:
      POSTGRES_DB: arrow
      POSTGRES_USER: arrow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-arrow_dev}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrow -d arrow"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── MapServer (OGC WMS/WFS from PostGIS) ─────────────────────────────────────
  mapserver:
    image: camptocamp/mapserver:8.0
    container_name: arrow-mapserver
    entrypoint: ["/mapserver/docker-entrypoint.sh"]
    command: ["/usr/sbin/apache2ctl", "-D", "FOREGROUND"]
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-arrow_dev}"
    volumes:
      - ./infra/mapserver:/mapserver:ro
    expose:
      - "80"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    image: arrow-backend
    container_name: arrow-backend
    # Port 6001 is NOT exposed directly — nginx owns it (HTTPS proxy for Arrow Front).
    # The backend is reachable within Docker as backend:6001.
    expose:
      - "6001"
    # CoT ports ARE published to the host so ATAK devices can connect directly
    # (raw TCP/TLS — not HTTP, so they bypass the nginx proxy).
    ports:
      - "8087:8087"   # CoT plain TCP (ATAK, non-SSL)
      - "8089:8089"   # CoT TLS       (ATAK, SSL)
    environment:
      # Public IP/hostname ATAK dials — added to the CoT TLS cert SAN so SSL
      # connections validate. Set in .env, e.g. ARROW_COT_EXTRA_IPS=78.21.255.210
      ARROW_COT_EXTRA_IPS: "${ARROW_COT_EXTRA_IPS:-}"
      # ARROW_JWT_SECRET: ""    # set a 64-char hex secret here or in .env for production
      #                         # if unset, a random secret is auto-generated on first boot
      #                         # and saved to data/jwt_secret.key (persisted in arrow-data volume)
      ARROW_REDIS_URL: redis://redis:6379/0
      ARROW_DATABASE_URL: "postgresql+psycopg://arrow:${POSTGRES_PASSWORD:-arrow_dev}@postgres:5432/arrow"
      ARROW_JSON_LOGS: "1"
      # ARROW_PHOTO_KEY: <64-char hex>      # enable photo encryption at rest
    volumes:
      - arrow-data:/app/data
      - ./config.xml:/app/config.xml:ro
      - ./maps:/app/maps
      - apk-nfs:/mnt/apks:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6001/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Web dashboard (Flask) ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web.dockerfile
    image: arrow-web
    container_name: arrow-web
    environment:
      ARROW_BACKEND_URL: http://backend:6001
      ARROW_ALLOWED_ORIGINS: "${ARROW_ALLOWED_ORIGINS:-http://localhost:6200}"
      FLASK_DEBUG: "0"
      ARROW_JSON_LOGS: "1"
      # For non-Docker HTTPS dev (arrow-web run locally): set public IP so the
      # auto-generated self-signed cert covers it.  In Docker, Caddy handles TLS.
      ARROW_WEB_HTTP: "1"
    expose:
      - "6002"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis (token blacklist + rate-limit state) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arrow-redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # ── nginx reverse proxy ──────────────────────────────────────────────────────
  proxy:
    image: nginx:1-alpine
    container_name: arrow-proxy
    ports:
      - "${ARROW_HTTP_PORT:-6200}:6200"   # web dashboard (browser)
      - "6001:6001"                        # FastAPI direct (Arrow Front desktop)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/arrow.conf:ro  # generated by deploy.sh
      - ./data/ssl:/etc/nginx/ssl:ro                  # cert generated by deploy.sh
    depends_on:
      - backend
      - web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Automated backup ─────────────────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    container_name: arrow-backup
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Backup service started (interval: $${BACKUP_INTERVAL_HOURS:-24}h)"
        while true; do
          DATE=$$(date -u +%Y-%m-%dT%H%M%SZ)
          PGPASSWORD=$${POSTGRES_PASSWORD} \
            pg_dump -h postgres -U arrow arrow \
            | gzip > /backups/arrow-db-$${DATE}.sql.gz \
            && echo "DB backup ok: $${DATE}" \
            || echo "DB backup FAILED"
          tar czf /backups/arrow-photos-$${DATE}.tar.gz -C /data photos 2>/dev/null \
            && echo "Photo backup ok: $${DATE}"
          find /backups -name "*.gz" -mtime +$${BACKUP_KEEP_DAYS:-7} -delete
          echo "Next backup in $${BACKUP_INTERVAL_HOURS:-24}h"
          sleep $$(( $${BACKUP_INTERVAL_HOURS:-24} * 3600 ))
        done
    volumes:
      - arrow-data:/data:ro
      - arrow-backups:/backups
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-arrow_dev}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-7}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Mumble voice server ──────────────────────────────────────────────────────
  murmur:
    image: mumblevoip/mumble-server:latest
    container_name: murmur
    ports:
      - "64738:64738/tcp"   # desktop clients connect from outside Docker
      - "64738:64738/udp"
    volumes:
      - murmur-data:/data
    environment:
      MUMBLE_SUPERUSER_PASSWORD: "${MUMBLE_SUPERUSER_PASSWORD:-R@nger&1401!}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Log aggregation (optional — enable with: docker compose --profile logging up) ──
  loki:
    image: grafana/loki:3.0.0
    container_name: arrow-loki
    profiles: ["logging"]
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: arrow-promtail
    profiles: ["logging"]
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./infra/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: arrow-grafana
    profiles: ["logging"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-changeme}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    restart: unless-stopped

volumes:
  postgres-data:
  arrow-data:
  arrow-backups:
  redis-data:
  murmur-data:
  loki-data:
  grafana-data:
  apk-nfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.0.240,ro,vers=3,soft,timeo=30"
      device: ":/share/apks/release"
