services:

  # ── Backend (FastAPI) ────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    image: arrow-backend
    container_name: arrow-backend
    ports:
      - "6001:6001"
    environment:
      # ARROW_JWT_SECRET: ""    # set a 64-char hex secret here or in .env for production
      #                         # if unset, a random secret is auto-generated on first boot
      #                         # and saved to data/jwt_secret.key (persisted in arrow-data volume)
      ARROW_REDIS_URL: redis://redis:6379/0
      # Persist the SQLite DB inside the named volume (same path the backup
      # service reads from at /data/arrow.db) so it survives container recreation
      # and the default seed (benoit/capt/ops1/ops2/ops3 — all password "ranger14")
      # only runs on first boot.
      ARROW_DATABASE_URL: sqlite:////app/data/arrow.db
      ARROW_JSON_LOGS: "1"
      # ARROW_PHOTO_KEY: <64-char hex>      # enable photo encryption at rest
    volumes:
      - arrow-data:/app/data
      - ./config.xml:/app/config.xml:ro
      - ./maps:/app/maps
      - apk-nfs:/mnt/apks:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:6001/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Web dashboard (Flask) ────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: web.dockerfile
    image: arrow-web
    container_name: arrow-web
    environment:
      ARROW_BACKEND_URL: http://backend:6001
      ARROW_ALLOWED_ORIGINS: "${ARROW_ALLOWED_ORIGINS:-http://localhost:6200}"
      FLASK_DEBUG: "0"
      ARROW_JSON_LOGS: "1"
      # For non-Docker HTTPS dev (arrow-web run locally): set public IP so the
      # auto-generated self-signed cert covers it.  In Docker, Caddy handles TLS.
      ARROW_WEB_HTTP: "1"
    expose:
      - "6002"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis (token blacklist + rate-limit state) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arrow-redis
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  # ── Caddy reverse proxy ──────────────────────────────────────────────────────
  proxy:
    image: caddy:2-alpine
    container_name: arrow-proxy
    ports:
      # HTTP (dev default)
      - "${ARROW_HTTP_PORT:-6200}:6200"
      # HTTPS — enabled when ARROW_TLS=internal or ARROW_TLS=acme
      - "${ARROW_HTTPS_PORT:-443}:443"
    environment:
      # :6200        → HTTP dev (default)
      # :443         → HTTPS self-signed (ARROW_TLS=internal)
      # my.host.com  → HTTPS Let's Encrypt (ARROW_TLS=acme)
      ARROW_DOMAIN:  "${ARROW_DOMAIN:-:6200}"
      CADDY_EMAIL:   "${CADDY_EMAIL:-admin@example.com}"
    volumes:
      # deploy.sh writes the right Caddyfile to ./Caddyfile.active
      - ${ARROW_CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - web
    restart: unless-stopped

  # ── Automated backup ─────────────────────────────────────────────────────────
  backup:
    image: alpine:3.20
    container_name: arrow-backup
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache sqlite
        echo "Backup service started (interval: $${BACKUP_INTERVAL_HOURS:-24}h)"
        while true; do
          DATE=$$(date -u +%Y-%m-%dT%H%M%SZ)
          sqlite3 /data/arrow.db ".dump" | gzip > /backups/arrow-db-$${DATE}.sql.gz \
            && echo "DB backup ok: $${DATE}" \
            || echo "DB backup FAILED"
          tar czf /backups/arrow-photos-$${DATE}.tar.gz -C /data photos 2>/dev/null \
            && echo "Photo backup ok: $${DATE}"
          # Prune old backups
          find /backups -name "*.gz" -mtime +$${BACKUP_KEEP_DAYS:-7} -delete
          echo "Next backup in $${BACKUP_INTERVAL_HOURS:-24}h"
          sleep $$(( $${BACKUP_INTERVAL_HOURS:-24} * 3600 ))
        done
    volumes:
      - arrow-data:/data:ro
      - arrow-backups:/backups
    environment:
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-7}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Log aggregation (optional — enable with: docker compose --profile logging up) ──
  loki:
    image: grafana/loki:3.0.0
    container_name: arrow-loki
    profiles: ["logging"]
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./infra/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: arrow-promtail
    profiles: ["logging"]
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./infra/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: arrow-grafana
    profiles: ["logging"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-changeme}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [loki]
    restart: unless-stopped

volumes:
  arrow-data:
  arrow-backups:
  redis-data:
  caddy-data:
  caddy-config:
  loki-data:
  grafana-data:
  apk-nfs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.0.240,ro,vers=3,soft,timeo=30"
      device: ":/share/apks/release"
